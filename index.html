<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat.AI 🐈</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --text: #f8f3ff;
  --muted: #aaa0bd;
  --panel: rgba(24, 18, 40, .88);
  --panel2: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.13);
  --accent: #9b62ff;
  --accent2: #5d7cff;
  --user1: #7550c9;
  --user2: #536dd5;
  --shadow: rgba(0,0,0,.35);
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: #080611;
  transition: background .4s, color .4s;
}

/* =========================
   THEMES
========================= */

/* OG */
body.theme-og {
  --text: #eeeeee;
  --muted: #999999;
  --panel: #191919;
  --panel2: #252525;
  --border: #3a3a3a;
  --accent: #888888;
  --accent2: #555555;
  --user1: #444444;
  --user2: #303030;
  --shadow: rgba(0,0,0,.5);

  background: #111111;
}

/* PURPLE */
body.theme-purple {
  --text: #f8f3ff;
  --muted: #aaa0bd;
  --panel: rgba(24,18,40,.88);
  --panel2: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.13);
  --accent: #9b62ff;
  --accent2: #5d7cff;
  --user1: #7550c9;
  --user2: #536dd5;

  background:
    radial-gradient(circle at 10% 20%, rgba(155,98,255,.25), transparent 30%),
    radial-gradient(circle at 90% 80%, rgba(70,110,255,.20), transparent 30%),
    #080611;
}

/* YARN */
body.theme-yarn {
  --text: #fff6eb;
  --muted: #d4bca5;
  --panel: rgba(74,43,31,.88);
  --panel2: rgba(255,220,180,.09);
  --border: rgba(255,220,180,.20);
  --accent: #ffad68;
  --accent2: #d87b43;
  --user1: #c86c3c;
  --user2: #8e4f32;

  background-color: #4b2e24;

  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 2px,
      transparent 2px,
      transparent 8px
    ),
    repeating-linear-gradient(
      -45deg,
      rgba(0,0,0,.05) 0px,
      rgba(0,0,0,.05) 2px,
      transparent 2px,
      transparent 8px
    );
}

/* PILLOW */
body.theme-pillow {
  --text: #382b40;
  --muted: #7c6a80;
  --panel: rgba(255,255,255,.88);
  --panel2: rgba(255,255,255,.65);
  --border: rgba(100,70,110,.18);
  --accent: #bd83dc;
  --accent2: #8ca8ed;
  --user1: #b77bd5;
  --user2: #829ee3;

  background-color: #dcd4ea;

  background-image:
    radial-gradient(circle at 20% 20%, #f8e5ed 0 7%, transparent 8%),
    radial-gradient(circle at 80% 25%, #d8e5f7 0 8%, transparent 9%),
    radial-gradient(circle at 35% 75%, #f5e0c7 0 8%, transparent 9%),
    radial-gradient(circle at 75% 80%, #d5eedb 0 7%, transparent 8%);
}

/* =========================
   APP
========================= */

.app {
  width: 100vw;
  height: 100vh;
  display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 270px;
  padding: 18px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 5;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: bold;
}

.logo-cat {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow: 0 0 25px var(--shadow);
  font-size: 26px;
}

.new-chat {
  border: 0;
  border-radius: 14px;
  padding: 13px;
  color: white;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.new-chat:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

.history-title {
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-top: 8px;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.history-item {
  padding: 11px;
  margin-bottom: 7px;
  border-radius: 12px;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  transition: .15s;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-item:hover {
  background: var(--panel2);
  color: var(--text);
}

.sidebar-buttons {
  display: flex;
  gap: 8px;
}

.small-button {
  flex: 1;
  padding: 10px 5px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  background: var(--panel2);
  cursor: pointer;
}

/* =========================
   THEME MENU
========================= */

.theme-menu {
  position: absolute;
  left: 18px;
  bottom: 70px;
  width: 234px;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(20px);
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
  display: none;
  z-index: 20;
}

.theme-menu.open {
  display: block;
  animation: menuIn .2s ease;
}

@keyframes menuIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.theme-menu h3 {
  margin: 4px 5px 10px;
  font-size: 13px;
}

.theme-option {
  width: 100%;
  border: 0;
  padding: 11px;
  margin: 4px 0;
  border-radius: 11px;
  text-align: left;
  color: var(--text);
  background: var(--panel2);
  cursor: pointer;
}

.theme-option:hover {
  outline: 1px solid var(--accent);
}

/* =========================
   MAIN
========================= */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

header {
  height: 76px;
  padding: 14px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(20px);
}

.avatar {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  font-size: 28px;
}

.header-text h1 {
  margin: 0;
  font-size: 19px;
}

.header-text span {
  color: #55dc8a;
  font-size: 10px;
  font-weight: bold;
}

.shoe-meter {
  margin-left: auto;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255,180,100,.25);
  background: rgba(255,160,70,.08);
  color: #d99049;
  font-size: 11px;
}

/* =========================
   CHAT
========================= */

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  scroll-behavior: smooth;
}

.message {
  max-width: 78%;
  margin: 13px 0;
  padding: 14px 17px;
  border-radius: 20px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: pop .2s ease;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.user {
  margin-left: auto;
  background: linear-gradient(135deg,var(--user1),var(--user2));
  color: white;
  border-bottom-right-radius: 6px;
}

.cat {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 6px;
}

.cat-label {
  font-weight: bold;
  margin-bottom: 6px;
}

/* =========================
   THINKING
========================= */

.thinking {
  display: flex;
  gap: 5px;
  padding: 5px 0;
}

.thinking i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1s infinite;
}

.thinking i:nth-child(2) {
  animation-delay: .15s;
}

.thinking i:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {
  50% {
    transform: translateY(-6px);
    opacity: .5;
  }
}

/* =========================
   INPUT
========================= */

.bottom {
  padding: 15px 22px 20px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(20px);
}

.input-row {
  display: flex;
  gap: 10px;
}

#input {
  flex: 1;
  min-width: 0;
  padding: 15px 17px;
  border-radius: 15px;
  border: 1px solid var(--border);
  outline: none;
  color: var(--text);
  background: var(--panel2);
  font-size: 15px;
}

#input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 18px var(--shadow);
}

.send {
  width: 90px;
  border: 0;
  border-radius: 15px;
  color: white;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.send:hover {
  transform: scale(1.03);
}

.hint {
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  margin-top: 8px;
}

/* =========================
   SECRET CAT
========================= */

.secret-cat {
  position: fixed;
  right: 18px;
  bottom: 18px;

  width: 45px;
  height: 45px;

  border: 1px solid var(--border);
  border-radius: 50%;

  background: var(--panel);
  backdrop-filter: blur(12px);

  font-size: 25px;
  cursor: pointer;

  opacity: .35;

  transition: .2s;
  z-index: 999;
}

.secret-cat:hover {
  opacity: 1;
  transform: scale(1.15) rotate(-6deg);
}

.secret-cat.meowing {
  animation: catMeow .5s ease;
}

@keyframes catMeow {
  0% {
    transform: scale(1) rotate(0);
  }

  30% {
    transform: scale(1.35) rotate(-8deg);
  }

  60% {
    transform: scale(.9) rotate(8deg);
  }

  100% {
    transform: scale(1) rotate(0);
  }
}

/* =========================
   YARN DECORATIONS
========================= */

.yarn-ball {
  position: fixed;
  font-size: 48px;
  opacity: .18;
  pointer-events: none;
  z-index: 0;
}

.yarn1 {
  left: 30%;
  top: 15%;
}

.yarn2 {
  right: 12%;
  bottom: 20%;
}

/* =========================
   PILLOW CATS
========================= */

.pillow-cat {
  position: fixed;
  font-size: 48px;
  opacity: .18;
  pointer-events: none;
  z-index: 0;
}

.pc1 {
  left: 35%;
  top: 12%;
}

.pc2 {
  right: 18%;
  top: 35%;
}

.pc3 {
  left: 25%;
  bottom: 14%;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

  .sidebar {
    display: none;
  }

  header {
    padding: 12px;
  }

  .shoe-meter {
    display: none;
  }

  #messages {
    padding: 16px;
  }

  .message {
    max-width: 90%;
  }

  .secret-cat {
    bottom: 80px;
  }
}
</style>

</head>

<body class="theme-purple">

<!-- Decorative cats/yarn -->

<div class="yarn-ball yarn1">🧶</div>
<div class="yarn-ball yarn2">🧶</div>

<div class="pillow-cat pc1">🐱</div>
<div class="pillow-cat pc2">🐱</div>
<div class="pillow-cat pc3">🐱</div>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

```
<div class="logo">
  <div class="logo-cat">🐈</div>
  Cat.AI
</div>

<button class="new-chat" onclick="newChat()">
  ＋ New Chat
</button>

<div class="history-title">
  CHAT HISTORY
</div>

<div id="history" class="history"></div>

<div class="sidebar-buttons">

  <button class="small-button" onclick="toggleThemeMenu()">
    🎨 Themes
  </button>

  <button class="small-button" onclick="clearHistory()">
    🗑️ Clear
  </button>

</div>

<!-- THEME MENU -->

<div id="themeMenu" class="theme-menu">

  <h3>🎨 Cat.AI Themes</h3>

  <button
    class="theme-option"
    onclick="setTheme('og')">
    🩶 OG
  </button>

  <button
    class="theme-option"
    onclick="setTheme('purple')">
    💜 Purple Shade
  </button>

  <button
    class="theme-option"
    onclick="setTheme('yarn')">
    🧶 Yarn Texture
  </button>

  <button
    class="theme-option"
    onclick="setTheme('pillow')">
    🛏️ Pillow Wall
  </button>

</div>
```

  </aside>

  <!-- MAIN -->

  <main class="main">

```
<header>

  <div class="avatar">
    🐈
  </div>

  <div class="header-text">

    <h1>Cat.AI</h1>

    <span>
      ● BRAIN ONLINE
    </span>

  </div>

  <div class="shoe-meter">
    👟 SHOES: SUSPICIOUS
  </div>

</header>

<div id="messages"></div>

<div class="bottom">

  <div class="input-row">

    <input
      id="input"
      placeholder="Talk to Cat.AI..."
      autocomplete="off"
    >

    <button
      class="send"
      onclick="sendMessage()">
      MEOW
    </button>

  </div>

  <div class="hint">

  </div>

</div>
```

  </main>

</div>

<!-- SECRET CAT -->

<button
class="secret-cat"
onclick="secretMeow()"
aria-label="Secret cat">
🐈 </button>

<script>

/* =========================
   ELEMENTS
========================= */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const historyBox =
  document.getElementById("history");

const themeMenu =
  document.getElementById("themeMenu");


/* =========================
   CURRENT CHAT
========================= */

let currentChat = {
  id: Date.now(),
  title: "New Chat",
  messages: []
};


/* =========================
   CHAT HISTORY
========================= */

function saveChat() {

  if (
    currentChat.messages.length === 0
  ) {
    return;
  }

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats")
      || "[]"
    );

  const index =
    chats.findIndex(
      chat => chat.id === currentChat.id
    );

  if (index >= 0) {
    chats[index] = currentChat;
  } else {
    chats.unshift(currentChat);
  }

  localStorage.setItem(
    "catAIChats",
    JSON.stringify(
      chats.slice(0, 30)
    )
  );

  loadHistory();
}


function loadHistory() {

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats")
      || "[]"
    );

  historyBox.innerHTML = "";

  chats.forEach(chat => {

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.textContent =
      "🐾 " +
      (chat.title || "Untitled Chat");

    item.onclick =
      () => loadChat(chat.id);

    historyBox.appendChild(item);

  });
}


function loadChat(id) {

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats")
      || "[]"
    );

  const chat =
    chats.find(
      c => c.id === id
    );

  if (!chat) {
    return;
  }

  currentChat = chat;

  messages.innerHTML = "";

  currentChat.messages.forEach(
    message => {

      addMessage(
        message.text,
        message.type,
        false
      );

    }
  );

}


/* =========================
   NEW CHAT
========================= */

function newChat() {

  saveChat();

  currentChat = {
    id: Date.now(),
    title: "New Chat",
    messages: []
  };

  messages.innerHTML = "";

  showWelcome();

}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory() {

  if (
    !confirm(
      "Delete all saved Cat.AI chats?"
    )
  ) {
    return;
  }

  localStorage.removeItem(
    "catAIChats"
  );

  loadHistory();

}


/* =========================
   WELCOME
========================= */

function showWelcome() {

  addMessage(
    "MEOW! New chat detected! What are we talking about?",
    "cat",
    true
  );

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type,
  save = true
) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  if (type === "cat") {

    div.innerHTML =
      `<div class="cat-label">🐈 Cat.AI</div>` +
      escapeHTML(text);

  } else {

    div.textContent =
      text;

  }

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;


  if (save) {

    currentChat.messages.push({
      text,
      type
    });

    if (
      type === "user" &&
      currentChat.title === "New Chat"
    ) {

      currentChat.title =
        text.slice(0, 30) +
        (
          text.length > 30
          ? "..."
          : ""
        );

    }

    saveChat();

  }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  addMessage(
    text,
    "user"
  );

  input.value = "";


  const thinking =
    document.createElement("div");

  thinking.className =
    "message cat";

  thinking.innerHTML = `
    <div class="cat-label">
      🐈 Cat.AI
    </div>

    <div class="thinking">
      <i></i>
      <i></i>
      <i></i>
    </div>
  `;

  messages.appendChild(
    thinking
  );

  messages.scrollTop =
    messages.scrollHeight;


  try {

    const response =
      await fetch(
        "/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text
            })
        }
      );


    const data =
      await response.json();


    thinking.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
       </div>` +
      escapeHTML(data.reply);


    currentChat.messages.push({
      text: data.reply,
      type: "cat"
    });

    saveChat();


  } catch (error) {

    thinking.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
       </div>
       MRRP! I can't reach my brain! 🧠💥`;

  }


  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   THEME MENU
========================= */

function toggleThemeMenu() {

  themeMenu.classList.toggle(
    "open"
  );

}


function setTheme(theme) {

  document.body.classList.remove(
    "theme-og",
    "theme-purple",
    "theme-yarn",
    "theme-pillow"
  );

  document.body.classList.add(
    "theme-" + theme
  );

  localStorage.setItem(
    "catAITheme",
    theme
  );

  themeMenu.classList.remove(
    "open"
  );

}


/* =========================
   SECRET CAT
========================= */

function secretMeow() {

  const cat =
    document.querySelector(
      ".secret-cat"
    );

  cat.classList.remove(
    "meowing"
  );

  void cat.offsetWidth;

  cat.classList.add(
    "meowing"
  );


  /*
    Make a tiny synthesized
    meow sound using the browser.
  */

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) {
    return;
  }

  const audio =
    new AudioContext();

  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    500,
    audio.currentTime
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    850,
    audio.currentTime + .12
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    350,
    audio.currentTime + .45
  );


  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .25,
    audio.currentTime + .04
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + .45
  );


  oscillator.connect(gain);

  gain.connect(
    audio.destination
  );


  oscillator.start();

  oscillator.stop(
    audio.currentTime + .45
  );


  setTimeout(
    () => audio.close(),
    700
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   ENTER TO SEND
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      sendMessage();

    }

  }
);


/* =========================
   LOAD SAVED THEME
========================= */

const savedTheme =
  localStorage.getItem(
    "catAITheme"
  );

if (savedTheme) {

  setTheme(savedTheme);

}


/* =========================
   START
========================= */

loadHistory();

showWelcome();

</script>

</body>
</html>
