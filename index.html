<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat.AI 🐈</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --text: #f8f3ff;
  --muted: #aaa0bd;
  --panel: rgba(25,18,42,.88);
  --panel2: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.14);
  --accent: #9b62ff;
  --accent2: #5d7cff;
  --user1: #7550c9;
  --user2: #536dd5;
}

/* =========================
   GENERAL
========================= */

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: var(--text);
  background: #080611;
  transition: .4s;
}

/* =========================
   OG THEME
========================= */

body.theme-og {
  --text: #eee;
  --muted: #999;
  --panel: #191919;
  --panel2: #252525;
  --border: #3a3a3a;
  --accent: #888;
  --accent2: #555;
  --user1: #444;
  --user2: #303030;

  background: #111;
}

/* =========================
   PURPLE SHADE
========================= */

body.theme-purple {
  --text: #f8f3ff;
  --muted: #aaa0bd;
  --panel: rgba(25,18,42,.88);
  --panel2: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.14);
  --accent: #9b62ff;
  --accent2: #5d7cff;
  --user1: #7550c9;
  --user2: #536dd5;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(155,98,255,.3),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(70,110,255,.25),
      transparent 30%
    ),
    #080611;
}

/* =========================
   YARN TEXTURE 🧶
========================= */

body.theme-yarn {
  --text: #fff8f2;
  --muted: #d8c2b2;
  --panel: rgba(76,45,35,.88);
  --panel2: rgba(255,230,210,.10);
  --border: rgba(255,225,205,.22);
  --accent: #ff9b68;
  --accent2: #e76f9b;
  --user1: #c96572;
  --user2: #a85282;

  background-color: #704536;

  /* Woven yarn strands */
  background-image:
    repeating-linear-gradient(
      25deg,
      rgba(255,255,255,.13) 0px,
      rgba(255,255,255,.13) 2px,
      transparent 2px,
      transparent 7px
    ),
    repeating-linear-gradient(
      -25deg,
      rgba(0,0,0,.13) 0px,
      rgba(0,0,0,.13) 2px,
      transparent 2px,
      transparent 7px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 5px
    );

  background-size:
    18px 18px,
    18px 18px,
    7px 7px;

  box-shadow:
    inset 0 0 100px rgba(0,0,0,.28);
}

/* Extra yarn strands */

body.theme-yarn::before {
  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;
  z-index: -1;

  background:
    repeating-linear-gradient(
      115deg,
      transparent 0px,
      transparent 9px,
      rgba(255,255,255,.045) 10px,
      rgba(255,255,255,.045) 12px,
      transparent 13px,
      transparent 22px
    );

  opacity: .8;
}

/* Tiny fuzzy fibers */

body.theme-yarn::after {
  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;
  z-index: -1;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.10) 0 1px,
      transparent 2px
    );

  background-size: 13px 13px;

  opacity: .35;
}

/* =========================
   PILLOW WALL
========================= */

body.theme-pillow {
  --text: #3d3044;
  --muted: #76667b;
  --panel: rgba(255,255,255,.9);
  --panel2: rgba(255,255,255,.7);
  --border: rgba(100,70,110,.18);
  --accent: #b87bd8;
  --accent2: #829fe7;
  --user1: #b77bd5;
  --user2: #829ee3;

  background: #d9d1df;
}

/* Actual wall of pillows */

body.theme-pillow::before {
  content: "";

  position: fixed;
  inset: 0;

  z-index: -2;

  background-color: #d8cbdc;

  background-image:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.95) 0 38%,
      transparent 40%
    );

  background-size: 155px 120px;

  box-shadow:
    inset 0 0 100px rgba(70,40,80,.25);
}

/* Cat pillows */

body.theme-pillow::after {
  content:
    "🛏️  🛏️  🐱  🛏️  🛏️  🛏️  "
    "🛏️  🛏️  🛏️  🛏️  🐱  🛏️  "
    "🐱  🛏️  🛏️  🛏️  🛏️  🛏️  ";

  position: fixed;
  inset: -30px;

  z-index: -1;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 68px;
  line-height: 1.7;
  word-spacing: 15px;

  opacity: .9;

  transform: rotate(-2deg);

  filter:
    drop-shadow(
      0 10px 8px rgba(60,40,70,.18)
    );

  pointer-events: none;
}

/* =========================
   APP
========================= */

.app {
  width: 100vw;
  height: 100vh;

  display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 270px;

  padding: 18px;

  background: var(--panel);

  border-right:
    1px solid var(--border);

  backdrop-filter: blur(20px);

  display: flex;
  flex-direction: column;

  gap: 14px;

  z-index: 5;
}

.logo {
  display: flex;
  align-items: center;

  gap: 12px;

  font-size: 21px;
  font-weight: bold;
}

.logo-cat {
  width: 44px;
  height: 44px;

  display: grid;
  place-items: center;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-size: 26px;
}

.new-chat {
  border: 0;

  border-radius: 14px;

  padding: 13px;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

.new-chat:hover {
  transform: translateY(-2px);
}

.history-title {
  color: var(--muted);

  font-size: 11px;
  font-weight: bold;

  letter-spacing: 1px;
}

.history {
  flex: 1;

  overflow-y: auto;
}

.history-item {
  padding: 11px;

  margin-bottom: 7px;

  border-radius: 12px;

  cursor: pointer;

  color: var(--muted);

  font-size: 13px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  transition: .15s;
}

.history-item:hover {
  background: var(--panel2);
  color: var(--text);
}

.sidebar-buttons {
  display: flex;
  gap: 8px;
}

.small-button {
  flex: 1;

  padding: 10px 5px;

  border:
    1px solid var(--border);

  border-radius: 12px;

  color: var(--text);

  background: var(--panel2);

  cursor: pointer;
}

/* =========================
   THEME MENU
========================= */

.theme-menu {
  position: absolute;

  left: 18px;
  bottom: 70px;

  width: 234px;

  padding: 12px;

  background: var(--panel);

  border:
    1px solid var(--border);

  border-radius: 16px;

  backdrop-filter: blur(20px);

  display: none;

  z-index: 20;
}

.theme-menu.open {
  display: block;

  animation:
    menuIn .2s ease;
}

@keyframes menuIn {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: none;
  }

}

.theme-menu h3 {
  margin: 4px 5px 10px;

  font-size: 13px;
}

.theme-option {
  width: 100%;

  border: 0;

  padding: 11px;

  margin: 4px 0;

  border-radius: 11px;

  text-align: left;

  color: var(--text);

  background: var(--panel2);

  cursor: pointer;
}

.theme-option:hover {
  outline:
    1px solid var(--accent);
}

/* =========================
   MAIN
========================= */

.main {
  flex: 1;

  min-width: 0;

  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

header {
  height: 76px;

  padding: 14px 22px;

  display: flex;
  align-items: center;

  gap: 14px;

  border-bottom:
    1px solid var(--border);

  background: var(--panel);

  backdrop-filter: blur(20px);
}

.avatar {
  width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-size: 28px;
}

.header-text h1 {
  margin: 0;

  font-size: 19px;
}

.header-text span {
  color: #55dc8a;

  font-size: 10px;

  font-weight: bold;
}

.shoe-meter {
  margin-left: auto;

  padding: 8px 12px;

  border-radius: 999px;

  border:
    1px solid rgba(255,180,100,.25);

  background:
    rgba(255,160,70,.08);

  color: #d99049;

  font-size: 11px;
}

/* =========================
   CHAT
========================= */

#messages {
  flex: 1;

  overflow-y: auto;

  padding: 28px;
}

.message {
  max-width: 78%;

  margin: 13px 0;

  padding: 14px 17px;

  border-radius: 20px;

  line-height: 1.5;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  animation:
    pop .2s ease;
}

@keyframes pop {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: none;
  }

}

.user {
  margin-left: auto;

  background:
    linear-gradient(
      135deg,
      var(--user1),
      var(--user2)
    );

  color: white;

  border-bottom-right-radius: 6px;
}

.cat {
  background: var(--panel2);

  border:
    1px solid var(--border);

  border-bottom-left-radius: 6px;
}

.cat-label {
  font-weight: bold;

  margin-bottom: 6px;
}

/* =========================
   THINKING
========================= */

.thinking {
  display: flex;

  gap: 5px;
}

.thinking i {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--accent);

  animation:
    bounce 1s infinite;
}

.thinking i:nth-child(2) {
  animation-delay: .15s;
}

.thinking i:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {

  50% {
    transform: translateY(-6px);
    opacity: .5;
  }

}

/* =========================
   INPUT
========================= */

.bottom {
  padding: 15px 22px 20px;

  border-top:
    1px solid var(--border);

  background: var(--panel);

  backdrop-filter: blur(20px);
}

.input-row {
  display: flex;

  gap: 10px;
}

#input {
  flex: 1;

  min-width: 0;

  padding: 15px 17px;

  border-radius: 15px;

  border:
    1px solid var(--border);

  outline: none;

  color: var(--text);

  background: var(--panel2);

  font-size: 15px;
}

#input:focus {
  border-color: var(--accent);

  box-shadow:
    0 0 18px rgba(0,0,0,.15);
}

.send {
  width: 90px;

  border: 0;

  border-radius: 15px;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight: bold;

  cursor: pointer;
}

.send:hover {
  transform: scale(1.03);
}

.hint {
  text-align: center;

  color: var(--muted);

  font-size: 10px;

  margin-top: 8px;
}

/* =========================
   SECRET CAT
========================= */

.secret-cat {
  position: fixed;

  right: 18px;
  bottom: 18px;

  width: 45px;
  height: 45px;

  border:
    1px solid var(--border);

  border-radius: 50%;

  background: var(--panel);

  backdrop-filter: blur(12px);

  font-size: 25px;

  cursor: pointer;

  opacity: .3;

  transition: .2s;

  z-index: 999;
}

.secret-cat:hover {
  opacity: 1;

  transform:
    scale(1.15)
    rotate(-6deg);
}

.secret-cat.meowing {
  animation:
    catMeow .5s ease;
}

@keyframes catMeow {

  0% {
    transform: scale(1);
  }

  30% {
    transform:
      scale(1.35)
      rotate(-8deg);
  }

  60% {
    transform:
      scale(.9)
      rotate(8deg);
  }

  100% {
    transform: scale(1);
  }

}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

  .sidebar {
    display: none;
  }

  .shoe-meter {
    display: none;
  }

  #messages {
    padding: 16px;
  }

  .message {
    max-width: 90%;
  }

  .secret-cat {
    bottom: 80px;
  }

}
</style>

</head>

<body class="theme-purple">

<div class="app">

<script>

/* =========================
   ELEMENTS
========================= */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const historyBox =
  document.getElementById("history");

const themeMenu =
  document.getElementById("themeMenu");


/* =========================
   CURRENT CHAT
========================= */

let currentChat = {
  id: Date.now(),
  title: "New Chat",
  messages: []
};


/* =========================
   SAVE CHAT
========================= */

function saveChat() {

  if (
    currentChat.messages.length === 0
  ) return;

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats")
      || "[]"
    );

  const index =
    chats.findIndex(
      chat =>
        chat.id === currentChat.id
    );

  if (index >= 0) {

    chats[index] =
      currentChat;

  } else {

    chats.unshift(
      currentChat
    );

  }

  localStorage.setItem(
    "catAIChats",
    JSON.stringify(
      chats.slice(0, 30)
    )
  );

  loadHistory();

}


/* =========================
   HISTORY
========================= */

function loadHistory() {

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats")
      || "[]"
    );

  historyBox.innerHTML = "";

  chats.forEach(chat => {

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.textContent =
      "🐾 " +
      (
        chat.title ||
        "Untitled Chat"
      );

    item.onclick =
      () => loadChat(chat.id);

    historyBox.appendChild(
      item
    );

  });

}


/* =========================
   LOAD CHAT
========================= */

function loadChat(id) {

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats")
      || "[]"
    );

  const chat =
    chats.find(
      c => c.id === id
    );

  if (!chat) return;

  currentChat =
    chat;

  messages.innerHTML = "";

  currentChat.messages.forEach(
    message => {

      addMessage(
        message.text,
        message.type,
        false
      );

    }
  );

}


/* =========================
   NEW CHAT
========================= */

function newChat() {

  saveChat();

  currentChat = {
    id: Date.now(),
    title: "New Chat",
    messages: []
  };

  messages.innerHTML = "";

  showWelcome();

}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory() {

  if (
    !confirm(
      "Delete all saved Cat.AI chats?"
    )
  ) return;

  localStorage.removeItem(
    "catAIChats"
  );

  loadHistory();

}


/* =========================
   WELCOME
========================= */

function showWelcome() {

  addMessage(
    "MEOW! New chat detected! What are we talking about?",
    "cat",
    true
  );

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type,
  save = true
) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  if (type === "cat") {

    div.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
       </div>` +
      escapeHTML(text);

  } else {

    div.textContent =
      text;

  }

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;


  if (save) {

    currentChat.messages.push({
      text,
      type
    });

    if (
      type === "user" &&
      currentChat.title === "New Chat"
    ) {

      currentChat.title =
        text.slice(0, 30) +
        (
          text.length > 30
          ? "..."
          : ""
        );

    }

    saveChat();

  }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;

  addMessage(
    text,
    "user"
  );

  input.value = "";


  const thinking =
    document.createElement("div");

  thinking.className =
    "message cat";

  thinking.innerHTML = `
    <div class="cat-label">
      🐈 Cat.AI
    </div>

    <div class="thinking">
      <i></i>
      <i></i>
      <i></i>
    </div>
  `;

  messages.appendChild(
    thinking
  );

  messages.scrollTop =
    messages.scrollHeight;


  try {

    const response =
      await fetch(
        "/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text
            })
        }
      );

    const data =
      await response.json();


    thinking.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
       </div>` +
      escapeHTML(
        data.reply
      );


    currentChat.messages.push({
      text: data.reply,
      type: "cat"
    });

    saveChat();


  } catch {

    thinking.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
       </div>
       MRRP! I can't reach my brain! 🧠💥`;

  }

}


/* =========================
   THEME MENU
========================= */

function toggleThemeMenu() {

  themeMenu.classList.toggle(
    "open"
  );

}


function setTheme(theme) {

  document.body.classList.remove(
    "theme-og",
    "theme-purple",
    "theme-yarn",
    "theme-pillow"
  );

  document.body.classList.add(
    "theme-" + theme
  );

  localStorage.setItem(
    "catAITheme",
    theme
  );

  themeMenu.classList.remove(
    "open"
  );

}


/* =========================
   SECRET CAT
========================= */

function secretMeow() {

  const cat =
    document.querySelector(
      ".secret-cat"
    );

  cat.classList.remove(
    "meowing"
  );

  void cat.offsetWidth;

  cat.classList.add(
    "meowing"
  );


  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) return;

  const audio =
    new AudioContext();

  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    500,
    audio.currentTime
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    850,
    audio.currentTime + .12
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    350,
    audio.currentTime + .45
  );


  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .25,
    audio.currentTime + .04
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + .45
  );


  oscillator.connect(
    gain
  );

  gain.connect(
    audio.destination
  );

  oscillator.start();

  oscillator.stop(
    audio.currentTime + .45
  );

  setTimeout(
    () => audio.close(),
    700
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}
