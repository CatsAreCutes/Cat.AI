<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cat.AI 🐈</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #f5efff;
      background:
        radial-gradient(circle at 15% 20%, rgba(150, 80, 255, 0.25), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(60, 120, 255, 0.2), transparent 30%),
        linear-gradient(135deg, #100b1c, #181329 50%, #0c1020);

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    /* Main window */

    .app {
      width: min(900px, 100%);
      height: min(850px, 92vh);

      display: flex;
      flex-direction: column;

      background: rgba(25, 20, 40, 0.88);
      border: 1px solid rgba(190, 150, 255, 0.25);
      border-radius: 28px;

      overflow: hidden;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(140, 80, 255, 0.12);

      backdrop-filter: blur(18px);
    }

    /* Header */

    header {
      position: relative;

      display: flex;
      align-items: center;
      gap: 15px;

      padding: 20px 25px;

      background: linear-gradient(
        135deg,
        rgba(90, 45, 140, 0.65),
        rgba(45, 55, 130, 0.65)
      );

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cat-icon {
      width: 58px;
      height: 58px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 34px;

      background: rgba(255, 255, 255, 0.1);
      border-radius: 18px;

      box-shadow:
        0 0 20px rgba(180, 120, 255, 0.25);
    }

    .title-area h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 1px;
    }

    .title-area p {
      margin: 4px 0 0;
      color: #cfc4e8;
      font-size: 13px;
    }

    .online {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 8px 12px;

      background: rgba(50, 200, 120, 0.12);
      border: 1px solid rgba(80, 255, 160, 0.2);
      border-radius: 999px;

      font-size: 12px;
      color: #aaffd0;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      background: #62e99b;
      border-radius: 50%;

      box-shadow: 0 0 10px #62e99b;
    }

    /* Chat */

    #messages {
      flex: 1;

      padding: 25px;

      overflow-y: auto;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(180, 140, 240, 0.25);
      border-radius: 10px;
    }

    .message {
      width: fit-content;
      max-width: 80%;

      margin: 12px 0;
      padding: 14px 17px;

      border-radius: 20px;

      line-height: 1.5;
      font-size: 15px;

      animation: appear 0.2s ease-out;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user {
      margin-left: auto;

      background: linear-gradient(
        135deg,
        #7549c7,
        #4c63c9
      );

      border-bottom-right-radius: 6px;

      box-shadow: 0 5px 20px rgba(70, 80, 200, 0.18);
    }

    .cat {
      margin-right: auto;

      background: rgba(255, 255, 255, 0.075);

      border: 1px solid rgba(255, 255, 255, 0.08);

      border-bottom-left-radius: 6px;
    }

    /* Cat avatar */

    .cat-message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .mini-cat {
      flex-shrink: 0;

      width: 32px;
      height: 32px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(160, 100, 240, 0.15);
      border-radius: 10px;

      font-size: 18px;
    }

    /* Thinking animation */

    .thinking {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .thinking span {
      width: 7px;
      height: 7px;

      background: #c3a5ff;
      border-radius: 50%;

      animation: bounce 1.2s infinite;
    }

    .thinking span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .thinking span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* Bottom area */

    .bottom {
      padding: 16px 20px 20px;

      background: rgba(10, 8, 18, 0.35);

      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;

      min-width: 0;

      padding: 15px 18px;

      color: white;
      background: rgba(255, 255, 255, 0.07);

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;

      outline: none;

      font-size: 15px;

      transition: 0.2s;
    }

    #input::placeholder {
      color: #9289a5;
    }

    #input:focus {
      border-color: rgba(180, 130, 255, 0.6);

      box-shadow:
        0 0 0 3px rgba(150, 100, 240, 0.1),
        0 0 20px rgba(150, 100, 240, 0.08);
    }

    button {
      padding: 0 22px;

      border: none;
      border-radius: 16px;

      color: white;

      background: linear-gradient(
        135deg,
        #8755d7,
        #526dd8
      );

      font-weight: bold;
      font-size: 15px;

      cursor: pointer;

      transition:
        transform 0.15s,
        filter 0.15s,
        box-shadow 0.15s;
    }

    button:hover {
      filter: brightness(1.12);

      transform: translateY(-2px);

      box-shadow:
        0 8px 25px rgba(100, 80, 220, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 9px;

      text-align: center;

      color: #716982;
      font-size: 11px;
    }

    /* Shoe detector */

    .shoe-warning {
      position: absolute;

      right: 20px;
      bottom: -12px;

      padding: 4px 9px;

      background: rgba(35, 25, 50, 0.95);

      border: 1px solid rgba(220, 170, 255, 0.15);
      border-radius: 999px;

      color: #9f93b8;
      font-size: 10px;
    }

    /* Mobile */

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      header {
        padding: 16px;
      }

      .online {
        display: none;
      }

      #messages {
        padding: 18px;
      }

      .message {
        max-width: 90%;
      }

      .bottom {
        padding: 12px;
      }

      button {
        padding: 0 17px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>

      <div class="cat-icon">
        🐈
      </div>

      <div class="title-area">
        <h1>CAT.AI</h1>
        <p>Your chaotic virtual cat companion</p>
      </div>

      <div class="online">
        <div class="online-dot"></div>
        BRAIN ONLINE
      </div>

      <div class="shoe-warning">
        👟 SHOES: SUSPICIOUS
      </div>

    </header>


    <div id="messages">

      <div class="message cat">
        <div class="cat-message">
          <div class="mini-cat">🐈</div>

          <div>
            <strong>Cat.AI</strong><br>
            MEOW! Welcome to my website! 🐈
            <br><br>
            My brain is online.
            My suspicion of shoes is also online.
          </div>
        </div>
      </div>

    </div>


    <div class="bottom">

      <div class="input-area">

        <input
          id="input"
          type="text"
          placeholder="Talk to Cat.AI..."
          autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
          MEOW
        </button>

      </div>

      <div class="hint">
        Press Enter to send • Warning: shoes may be judged
      </div>

    </div>

  </div>


  <script>

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");


    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });


    async function sendMessage() {

      const text = input.value.trim();

      if (!text) return;


      addMessage(
        "You: " + text,
        "user"
      );

      input.value = "";

      sendButton.disabled = true;
      sendButton.textContent = "...";


      const thinking = document.createElement("div");

      thinking.className = "message cat";

      thinking.innerHTML = `
        <div class="cat-message">
          <div class="mini-cat">🐈</div>

          <div>
            <strong>Cat.AI</strong><br>

            <div class="thinking">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      `;

      messages.appendChild(thinking);

      messages.scrollTop = messages.scrollHeight;


      try {

        const response = await fetch("/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })

        });


        const data = await response.json();


        thinking.innerHTML = `
          <div class="cat-message">
            <div class="mini-cat">🐈</div>

            <div>
              <strong>Cat.AI</strong><br>
              ${escapeHTML(data.reply)}
            </div>
          </div>
        `;


      } catch (error) {

        thinking.innerHTML = `
          <div class="cat-message">
            <div class="mini-cat">🐈</div>

            <div>
              <strong>Cat.AI</strong><br>
              MRRRP! I can't reach my brain! 🧠💥
            </div>
          </div>
        `;

      }


      sendButton.disabled = false;
      sendButton.textContent = "MEOW";

      messages.scrollTop = messages.scrollHeight;

    }


    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;

    }


    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
