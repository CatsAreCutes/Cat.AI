<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat.AI 🐈</title>

<style>
*{box-sizing:border-box}

:root{
  --text:#f8f3ff;
  --muted:#aaa0bd;
  --panel:rgba(25,18,42,.95);
  --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.14);
  --accent:#9b62ff;
  --accent2:#5d7cff;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 20%,rgba(155,98,255,.3),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(70,110,255,.25),transparent 30%),
    #080611;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:100vw;
  height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  padding:18px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:14px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:bold;
}

.logo-cat,.avatar{
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.logo-cat{
  width:44px;
  height:44px;
  border-radius:14px;
  font-size:26px;
}

.sidebar button{
  border:0;
  border-radius:13px;
  padding:12px;
  color:white;
  font-weight:bold;
}

.new-chat{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.arcade-button{
  background:linear-gradient(135deg,#ff8a3d,#e74d91);
}

.history-title{
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
  font-weight:bold;
}

.history{
  flex:1;
  overflow:auto;
}

.history-item{
  padding:10px;
  margin-bottom:6px;
  border-radius:10px;
  color:var(--muted);
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

header{
  height:76px;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}

.avatar{
  width:48px;
  height:48px;
  border-radius:15px;
  font-size:28px;
}

.header-text h1{margin:0}

.header-text span{
  color:#55dc8a;
  font-size:10px;
  font-weight:bold;
}

.shoe-meter{
  margin-left:auto;
  color:#d99049;
}

#messages{
  flex:1;
  overflow:auto;
  padding:28px;
}

.message{
  max-width:78%;
  margin:13px 0;
  padding:14px 17px;
  border-radius:20px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user{
  margin-left:auto;
  background:linear-gradient(135deg,#7550c9,#536dd5);
}

.cat{
  background:var(--panel2);
  border:1px solid var(--border);
}

.cat-label{
  font-weight:bold;
  margin-bottom:6px;
}

.bottom{
  padding:15px 22px 20px;
  border-top:1px solid var(--border);
  background:var(--panel);
}

.input-row{
  display:flex;
  gap:10px;
}

#input{
  flex:1;
  min-width:0;
  padding:15px;
  border-radius:15px;
  border:1px solid var(--border);
  outline:none;
  color:var(--text);
  background:var(--panel2);
}

.send{
  width:90px;
  border:0;
  border-radius:15px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

/* ARCADE */

.arcade{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(5,3,12,.9);
  backdrop-filter:blur(15px);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.arcade.open{
  display:flex;
}

.arcade-card{
  width:min(1000px,100%);
  height:min(750px,94vh);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:25px;
  border:1px solid var(--border);
  background:var(--panel);
}

.arcade-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 22px;
  border-bottom:1px solid var(--border);
}

.arcade-header h2{
  margin:0;
}

.close-game{
  margin-left:auto;
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  color:var(--text);
  background:var(--panel2);
}

.arcade-tabs{
  display:flex;
  gap:8px;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
}

.arcade-tab{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 15px;
  color:var(--text);
  background:var(--panel2);
}

.arcade-tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.arcade-view{
  flex:1;
  overflow:auto;
  padding:20px;
}

.game-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.game-card{
  padding:20px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel2);
}

.game-card-icon{
  font-size:45px;
}

.game-card h3{
  margin:10px 0 5px;
}

.game-card p{
  color:var(--muted);
  min-height:42px;
}

.play-button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

.game-screen{
  height:100%;
  display:flex;
  flex-direction:column;
}

.game-title{
  text-align:center;
}

.game-title h2{
  margin:5px;
}

.game-title p{
  color:var(--muted);
}

.game-stats{
  display:flex;
  justify-content:center;
  gap:50px;
  padding:12px;
  font-weight:bold;
}

.game-stats span{
  color:var(--accent);
  font-size:20px;
}

.game-board{
  position:relative;
  flex:1;
  min-height:300px;
  overflow:hidden;
  margin:10px;
  border-radius:20px;
  border:2px solid var(--border);
  background:
    radial-gradient(circle at 20% 20%,rgba(155,98,255,.2),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(93,124,255,.2),transparent 30%),
    var(--panel2);
}

.target{
  position:absolute;
  border:0;
  background:transparent;
  font-size:45px;
  padding:0;
  user-select:none;
}

.game-message{
  min-height:55px;
  margin:0 10px 12px;
  padding:14px;
  text-align:center;
  border-radius:15px;
  border:1px solid var(--border);
  background:var(--panel2);
}

.exit-button{
  align-self:center;
  padding:12px 22px;
  margin-bottom:10px;
  border:0;
  border-radius:12px;
  color:white;
  background:#555;
}

.leaderboard-table{
  width:100%;
  border-collapse:collapse;
}

.leaderboard-table th,
.leaderboard-table td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.leaderboard-table th{
  color:var(--muted);
}

.name-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  padding:20px;
}

.name-overlay.open{
  display:flex;
}

.name-box{
  width:min(430px,100%);
  padding:30px;
  border-radius:22px;
  background:var(--panel);
  border:1px solid var(--border);
  text-align:center;
}

.name-box input{
  width:100%;
  padding:14px;
  margin:15px 0;
  border-radius:12px;
  border:1px solid var(--border);
  color:var(--text);
  background:var(--panel2);
}

.name-box button{
  padding:12px 20px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.secret-cat{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:300;
  width:45px;
  height:45px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--panel);
  font-size:25px;
}

@media(max-width:700px){
  .sidebar{display:none}
  #messages{padding:16px}
  .message{max-width:90%}
  .shoe-meter{display:none}
  .arcade{padding:5px}
  .arcade-card{height:97vh}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">
    <div class="logo-cat">🐈</div>
    Cat.AI
  </div>

  <button class="new-chat" onclick="newChat()">
    🐾 New Chat
  </button>

  <button class="arcade-button" onclick="openArcade()">
    🎮 Cat Arcade
  </button>

  <div class="history-title">
    CHAT HISTORY
  </div>

  <div id="history" class="history"></div>

</aside>

<main class="main">

<header>

  <div class="avatar">🐈</div>

  <div class="header-text">
    <h1>Cat.AI</h1>
    <span>● BRAIN ONLINE</span>
  </div>

  <div class="shoe-meter">
    👟 SHOES: SUSPICIOUS
  </div>

</header>

<div id="messages"></div>

<div class="bottom">

  <div class="input-row">

    <input
      id="input"
      placeholder="Talk to Cat.AI..."
      autocomplete="off"
    >

    <button class="send" onclick="sendMessage()">
      MEOW
    </button>

  </div>

</div>

</main>
</div>


<!-- ARCADE -->

<div id="arcade" class="arcade">

<div class="arcade-card">

<div class="arcade-header">

<div style="font-size:32px">🐈</div>

<div>
<h2>Cat.AI Arcade</h2>
<div style="font-size:11px;color:var(--muted)">
SIX GAMES • LOCAL SCORES
</div>
</div>

<button class="close-game" onclick="closeArcade()">✕</button>

</div>

<div class="arcade-tabs">

<button
id="gamesTab"
class="arcade-tab active"
onclick="showTab('games')">
🎮 Games
</button>

<button
id="leaderboardTab"
class="arcade-tab"
onclick="showTab('leaderboard')">
🏆 Leaderboard
</button>

</div>

<div id="arcadeView" class="arcade-view"></div>

</div>
</div>


<!-- NAME -->

<div id="nameOverlay" class="name-overlay">

<div class="name-box">

<h2>🐈 Who are you?</h2>

<p>Pick the name Cat.AI will use.</p>

<input
id="playerName"
maxlength="20"
placeholder="Cookie"
>

<button onclick="saveName()">
MEOW, LET'S PLAY!
</button>

</div>

</div>

<button class="secret-cat" onclick="secretMeow()">🐈</button>


<script>

/* =====================================================
   PLAYER
===================================================== */

let playerName =
  localStorage.getItem("catAIPlayerName") || "";

let pendingAction = null;

let currentGame = null;

let game = {
  running:false,
  score:0,
  time:0,
  timer:null,
  target:null
};


/* =====================================================
   ALL SIX GAMES
===================================================== */

const games = {

  mouse:{
    name:"Catch the Mouse!",
    icon:"🐭",
    description:"Catch 20 mice in 1 minute!",
    time:60,
    goal:20
  },

  yarn:{
    name:"Yarn Frenzy",
    icon:"🧶",
    description:"Catch 30 balls of yarn!",
    time:45,
    goal:30
  },

  fish:{
    name:"Fish Frenzy",
    icon:"🐟",
    description:"Catch 25 fish!",
    time:45,
    goal:25
  },

  shoe:{
    name:"Shoe Destroyer",
    icon:"👟",
    description:"DESTROY 30 SUSPICIOUS SHOES!",
    time:45,
    goal:30
  },

  feather:{
    name:"Feather Chase",
    icon:"🪶",
    description:"Catch 25 feathers!",
    time:45,
    goal:25
  },

  box:{
    name:"Box Attack",
    icon:"📦",
    description:"ATTACK 20 BOXES!",
    time:45,
    goal:20
  }

};


/* =====================================================
   ELEMENTS
===================================================== */

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("input");

const historyBox =
  document.getElementById("history");

const arcade =
  document.getElementById("arcade");

const arcadeView =
  document.getElementById("arcadeView");

const nameOverlay =
  document.getElementById("nameOverlay");

const playerNameInput =
  document.getElementById("playerName");


/* =====================================================
   CHAT
===================================================== */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  if(type === "cat"){

    div.innerHTML =
      `<div class="cat-label">🐈 Cat.AI</div>`;

    div.appendChild(
      document.createTextNode(text)
    );

  }else{

    div.textContent = text;

  }

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}


async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";

  const thinking =
    document.createElement("div");

  thinking.className =
    "message cat";

  thinking.innerHTML =
    `<div class="cat-label">🐈 Cat.AI</div>
     Cat.AI is thinking... 🧠`;

  messages.appendChild(thinking);

  try{

    const response =
      await fetch("/chat",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          message:text
        })
      });

    if(!response.ok)
      throw new Error("Chat request failed");

    const data =
      await response.json();

    thinking.innerHTML =
      `<div class="cat-label">🐈 Cat.AI</div>`;

    thinking.appendChild(
      document.createTextNode(
        data.reply || "MEOW!"
      )
    );

  }catch(error){

    thinking.innerHTML =
      `<div class="cat-label">🐈 Cat.AI</div>
       MEOW! My brain server isn't available right now.`;

  }
}


input.addEventListener("keydown",function(e){

  if(e.key === "Enter")
    sendMessage();

});


/* =====================================================
   HISTORY
===================================================== */

function loadHistory(){

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats") || "[]"
    );

  historyBox.innerHTML = "";

  chats.forEach(chat=>{

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.textContent =
      "🐾 " + chat.title;

    historyBox.appendChild(item);

  });
}


function saveChat(title){

  const chats =
    JSON.parse(
      localStorage.getItem("catAIChats") || "[]"
    );

  chats.unshift({
    title:title,
    date:Date.now()
  });

  localStorage.setItem(
    "catAIChats",
    JSON.stringify(chats.slice(0,30))
  );

}


function newChat(){

  messages.innerHTML = "";

  addMessage(
    "MEOW! New chat detected! What are we talking about?",
    "cat"
  );

}


/* =====================================================
   PLAYER NAME
===================================================== */

function requireName(action){

  if(playerName){

    action();
    return;

  }

  pendingAction = action;

  nameOverlay.classList.add("open");

  playerNameInput.focus();

}


function saveName(){

  const name =
    playerNameInput.value
      .trim()
      .replace(/[<>]/g,"")
      .slice(0,20);

  if(!name)
    return;

  playerName = name;

  localStorage.setItem(
    "catAIPlayerName",
    playerName
  );

  nameOverlay.classList.remove("open");

  if(pendingAction){

    const action =
      pendingAction;

    pendingAction = null;

    action();

  }

}


/* =====================================================
   ARCADE
===================================================== */

function openArcade(){

  arcade.classList.add("open");

  showTab("games");

}


function closeArcade(){

  stopGame();

  arcade.classList.remove("open");

}


function showTab(tab){

  document
    .getElementById("gamesTab")
    .classList.toggle(
      "active",
      tab === "games"
    );

  document
    .getElementById("leaderboardTab")
    .classList.toggle(
      "active",
      tab === "leaderboard"
    );

  if(tab === "games")
    renderGames();
  else
    renderLeaderboard();

}


/* =====================================================
   SIX GAME MENU
===================================================== */

function renderGames(){

  arcadeView.innerHTML = `

    <h2 style="text-align:center">
      🎮 Choose Your Game
    </h2>

    <p style="
      text-align:center;
      color:var(--muted);
    ">
      SIX games. SIX ways for cats to cause chaos.
    </p>

    <div class="game-list">

      ${Object.entries(games).map(
        ([id,g])=>`

          <div class="game-card">

            <div class="game-card-icon">
              ${g.icon}
            </div>

            <h3>${g.name}</h3>

            <p>${g.description}</p>

            <button
              class="play-button"
              onclick="playGame('${id}')">
              PLAY
            </button>

          </div>

        `
      ).join("")}

    </div>

  `;

}


/* =====================================================
   START GAME
===================================================== */

function playGame(id){

  requireName(
    ()=>startGame(id)
  );

}


function startGame(id){

  stopGame();

  currentGame = id;

  const config = games[id];

  game = {
    running:true,
    score:0,
    time:config.time,
    timer:null,
    target:null
  };

  renderGame();

  requestAnimationFrame(()=>{
    spawnTarget();
  });

  game.timer =
    setInterval(()=>{

      if(!game.running)
        return;

      game.time--;

      updateStats();

      if(game.time <= 0)
        finishGame(false);

    },1000);

}


/* =====================================================
   GAME SCREEN
===================================================== */

function renderGame(){

  const config =
    games[currentGame];

  arcadeView.innerHTML = `

    <div class="game-screen">

      <div class="game-title">

        <h2>
          ${config.icon}
          ${config.name}
        </h2>

        <p>
          ${config.description}
        </p>

      </div>

      <div class="game-stats">

        <div>
          Score:
          <span id="score">0</span>
          / ${config.goal}
        </div>

        <div>
          Time:
          <span id="time">${config.time}</span>
          s
        </div>

      </div>

      <div
        id="gameBoard"
        class="game-board">
      </div>

      <div
        id="gameMessage"
        class="game-message">

        🐈 Cat.AI:
        Ready, ${escapeHTML(playerName)}?

      </div>

      <button
        class="exit-button"
        onclick="exitGame()">

        ← EXIT GAME

      </button>

    </div>

  `;

}


function updateStats(){

  const score =
    document.getElementById("score");

  const time =
    document.getElementById("time");

  if(score)
    score.textContent = game.score;

  if(time)
    time.textContent = game.time;

}


/* =====================================================
   TARGET
===================================================== */

function spawnTarget(){

  if(!game.running)
    return;

  const board =
    document.getElementById("gameBoard");

  if(!board)
    return;

  if(game.target)
    game.target.remove();

  const target =
    document.createElement("button");

  target.className = "target";

  target.textContent =
    games[currentGame].icon;

  const size = 60;

  const maxX =
    Math.max(0,board.clientWidth-size);

  const maxY =
    Math.max(0,board.clientHeight-size);

  target.style.left =
    Math.random()*maxX + "px";

  target.style.top =
    Math.random()*maxY + "px";

  target.addEventListener(
    "click",
    hitTarget
  );

  board.appendChild(target);

  game.target = target;

}


/* =====================================================
   HIT TARGET
===================================================== */

function hitTarget(){

  if(!game.running)
    return;

  game.score++;

  updateStats();

  playMeow();

  if(
    game.score >=
    games[currentGame].goal
  ){

    finishGame(true);
    return;

  }

  if(game.score % 5 === 0){

    const message =
      document.getElementById("gameMessage");

    if(message){

      message.textContent =
        `🐈 Cat.AI: MEOW! ${game.score} already! KEEP GOING!`;

    }

  }

  spawnTarget();

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(won){

  if(!game.running)
    return;

  game.running = false;

  clearInterval(game.timer);

  game.timer = null;

  if(game.target){

    game.target.remove();
    game.target = null;

  }

  const message =
    document.getElementById("gameMessage");

  if(won){

    message.textContent =
      `🐈 Cat.AI: MEOW!!! ${playerName.toUpperCase()} WON! 🎉`;

    playWinSound();

  }else{

    message.textContent =
      `🐈 Cat.AI: TIME'S UP! You got ${game.score}!`;

  }

  saveLocalScore(
    currentGame,
    game.score,
    games[currentGame].time - game.time
  );

  submitScoreToServer();

  const button =
    document.querySelector(".exit-button");

  if(button){

    button.textContent =
      "🏆 VIEW LEADERBOARD";

    button.onclick =
      ()=>showGameScores(currentGame);

  }

}


/* =====================================================
   LOCAL LEADERBOARD
===================================================== */

function getScores(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "catAIScores"
      ) || "{}"
    );

  }catch{

    return {};

  }

}


function saveLocalScore(
  gameId,
  score,
  time
){

  const scores =
    getScores();

  if(!scores[gameId])
    scores[gameId] = [];

  scores[gameId].push({

    name:playerName,
    score:Number(score),
    time:Number(time),
    date:Date.now()

  });

  scores[gameId]
    .sort((a,b)=>{

      if(b.score !== a.score)
        return b.score-a.score;

      return a.time-b.time;

    });

  scores[gameId] =
    scores[gameId].slice(0,50);

  localStorage.setItem(
    "catAIScores",
    JSON.stringify(scores)
  );

}


async function submitScoreToServer(){

  try{

    await fetch(
      "/api/scores",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({

          name:playerName,
          game:currentGame,
          score:game.score,
          time:
            games[currentGame].time -
            game.time,
          won:
            game.score >=
            games[currentGame].goal

        })
      }
    );

  }catch{

    // Local leaderboard still works.

  }

}

    </p>

}


async function showGameScores(id){

  const localScores =
    getScores()[id] || [];

  arcadeView.innerHTML = `

    <button
      class="arcade-tab"
      onclick="renderLeaderboard()">

      ← ALL GAMES

    </button>

    <h2>
      ${games[id].icon}
      ${games[id].name}
    </h2>

    <table class="leaderboard-table">

      <thead>

        <tr>
          <th>#</th>
          <th>PLAYER</th>
          <th>SCORE</th>
          <th>TIME</th>
        </tr>

      </thead>

      <tbody>

        ${
          localScores.length

          ?

          localScores.map(
            (row,i)=>`

              <tr>

                <td>
                  ${i === 0 ? "👑" : i+1}
                </td>

                <td>
                  ${escapeHTML(row.name)}
                </td>

                <td>
                  ${row.score}
                </td>

                <td>
                  ${row.time}s
                </td>

              </tr>

            `
          ).join("")

          :

          `
            <tr>
              <td colspan="4">
                No scores yet! Be the first cat!
              </td>
            </tr>
          `
        }

      </tbody>

    </table>

    <p style="color:var(--muted);margin-top:20px">
      Scores are saved in this browser.
    </p>

  `;

}


/* =====================================================
   GAME CONTROL
===================================================== */

function stopGame(){

  game.running = false;

  if(game.timer){

    clearInterval(game.timer);
    game.timer = null;

  }

  if(game.target){

    game.target.remove();
    game.target = null;

  }

}


function exitGame(){

  stopGame();

  renderGames();

}


/* =====================================================
   SOUND
===================================================== */

function playMeow(){

  const AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC)
    return;

  const audio = new AC();

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.frequency.value = 700;

  gain.gain.setValueAtTime(
    0.001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.15,
    audio.currentTime+0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audio.currentTime+0.2
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime+0.2
  );

}


function playWinSound(){

  const AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC)
    return;

  const audio = new AC();

  [523,659,784,1046].forEach(
    (freq,i)=>{

      const osc =
        audio.createOscillator();

      const gain =
        audio.createGain();

      const start =
        audio.currentTime+i*0.12;

      osc.frequency.value = freq;

      gain.gain.setValueAtTime(
        0.001,
        start
      );

      gain.gain.exponentialRampToValueAtTime(
        0.18,
        start+0.02
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        start+0.18
      );

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start(start);
      osc.stop(start+0.18);

    }
  );

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}
