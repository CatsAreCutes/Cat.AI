<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cat.AI 🐈</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --text:#f8f3ff;
  --muted:#aaa0bd;
  --panel:rgba(25,18,42,.92);
  --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.14);
  --accent:#9b62ff;
  --accent2:#5d7cff;
  --user1:#7550c9;
  --user2:#536dd5;
}

body {
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 20%,rgba(155,98,255,.3),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(70,110,255,.25),transparent 30%),
    #080611;
}

button,
input {
  font:inherit;
}

button {
  cursor:pointer;
}

/* =====================================================
   APP
===================================================== */

.app {
  width:100vw;
  height:100vh;
  display:flex;
  position:relative;
  z-index:2;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  width:270px;
  padding:18px;
  background:var(--panel);
  border-right:1px solid var(--border);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  gap:14px;
  z-index:5;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:21px;
  font-weight:bold;
}

.logo-cat,
.avatar {
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.logo-cat {
  width:44px;
  height:44px;
  border-radius:15px;
  font-size:26px;
}

.new-chat,
.arcade-button {
  border:0;
  border-radius:14px;
  padding:13px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

.arcade-button {
  background:linear-gradient(135deg,#ff8a3d,#e74d91);
}

.history-title {
  color:var(--muted);
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
}

.history {
  flex:1;
  overflow-y:auto;
}

.history-item {
  padding:11px;
  margin-bottom:7px;
  border-radius:12px;
  cursor:pointer;
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover {
  background:var(--panel2);
  color:var(--text);
}

.sidebar-buttons {
  display:flex;
  gap:8px;
}

.small-button {
  flex:1;
  padding:10px 5px;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  background:var(--panel2);
}

/* =====================================================
   MAIN CHAT
===================================================== */

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

header {
  height:76px;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(20px);
}

.avatar {
  width:48px;
  height:48px;
  border-radius:15px;
  font-size:28px;
}

.header-text h1 {
  margin:0;
  font-size:19px;
}

.header-text span {
  color:#55dc8a;
  font-size:10px;
  font-weight:bold;
}

.shoe-meter {
  margin-left:auto;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(255,180,100,.25);
  background:rgba(255,160,70,.08);
  color:#d99049;
  font-size:11px;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:28px;
}

.message {
  max-width:78%;
  margin:13px 0;
  padding:14px 17px;
  border-radius:20px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  margin-left:auto;
  background:linear-gradient(135deg,var(--user1),var(--user2));
  color:white;
  border-bottom-right-radius:6px;
}

.cat {
  background:var(--panel2);
  border:1px solid var(--border);
  border-bottom-left-radius:6px;
}

.cat-label {
  font-weight:bold;
  margin-bottom:6px;
}

.bottom {
  padding:15px 22px 20px;
  border-top:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(20px);
}

.input-row {
  display:flex;
  gap:10px;
}

#input {
  flex:1;
  min-width:0;
  padding:15px 17px;
  border-radius:15px;
  border:1px solid var(--border);
  outline:none;
  color:var(--text);
  background:var(--panel2);
}

.send {
  width:90px;
  border:0;
  border-radius:15px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

.hint {
  text-align:center;
  color:var(--muted);
  font-size:10px;
  margin-top:8px;
}

/* =====================================================
   ARCADE
===================================================== */

.arcade {
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  background:rgba(5,3,12,.86);
  backdrop-filter:blur(15px);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.arcade.open {
  display:flex;
}

.arcade-card {
  width:min(1000px,100%);
  height:min(760px,94vh);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:25px;
  border:1px solid var(--border);
  background:var(--panel);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.arcade-header {
  display:flex;
  align-items:center;
  padding:18px 22px;
  gap:12px;
  border-bottom:1px solid var(--border);
}

.arcade-header h2 {
  margin:0;
}

.close-game {
  margin-left:auto;
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  color:var(--text);
  background:var(--panel2);
}

.arcade-tabs {
  display:flex;
  gap:8px;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}

.arcade-tab {
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  background:var(--panel2);
  white-space:nowrap;
}

.arcade-tab.active {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

.arcade-view {
  flex:1;
  overflow:auto;
  padding:20px;
}

/* =====================================================
   GAME LIST
===================================================== */

.game-list {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.game-card {
  padding:20px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel2);
  transition:.15s;
}

.game-card:hover {
  transform:translateY(-3px);
  border-color:rgba(155,98,255,.5);
}

.game-card-icon {
  font-size:42px;
}

.game-card h3 {
  margin:10px 0 5px;
}

.game-card p {
  margin:0 0 15px;
  color:var(--muted);
  font-size:13px;
  min-height:38px;
}

.play-button {
  width:100%;
  padding:11px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

/* =====================================================
   GAME SCREEN
===================================================== */

.game-screen {
  height:100%;
  min-height:500px;
  display:flex;
  flex-direction:column;
}

.game-title {
  text-align:center;
}

.game-title h2 {
  margin:4px 0;
}

.game-description {
  color:var(--muted);
  font-size:13px;
}

.game-stats {
  display:flex;
  justify-content:center;
  gap:40px;
  padding:14px;
  font-weight:bold;
}

.game-stats span {
  color:var(--accent);
}

.game-board {
  flex:1;
  min-height:300px;
  position:relative;
  overflow:hidden;
  margin:10px;
  border-radius:20px;
  border:2px solid var(--border);
  background:
    radial-gradient(circle at 20% 20%,rgba(155,98,255,.18),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(93,124,255,.18),transparent 30%),
    var(--panel2);
}

.target {
  position:absolute;
  border:0;
  background:transparent;
  font-size:44px;
  cursor:pointer;
  user-select:none;
  transition:transform .08s;
  padding:5px;
}

.target:hover {
  transform:scale(1.2);
}

.game-message {
  min-height:55px;
  margin:0 20px 12px;
  padding:13px;
  border-radius:15px;
  background:var(--panel2);
  border:1px solid var(--border);
  text-align:center;
}

.game-buttons {
  display:flex;
  justify-content:center;
  gap:10px;
  padding-bottom:10px;
}

.start-game,
.exit-game {
  padding:12px 22px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:bold;
}

.start-game {
  background:linear-gradient(135deg,#ff8a3d,#e74d91);
}

.exit-game {
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
}

/* =====================================================
   LEADERBOARD
===================================================== */

.leaderboard-select {
  width:100%;
  max-width:350px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  margin-bottom:20px;
}

.leaderboard-table {
  width:100%;
  border-collapse:collapse;
}

.leaderboard-table th,
.leaderboard-table td {
  padding:12px 9px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.leaderboard-table th {
  color:var(--muted);
  font-size:11px;
}

.leaderboard-table tr:first-child td {
  font-weight:bold;
}

/* =====================================================
   NAME OVERLAY
===================================================== */

.name-overlay {
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  padding:20px;
}

.name-overlay.open {
  display:flex;
}

.name-box {
  width:min(450px,100%);
  padding:28px;
  border-radius:22px;
  background:var(--panel);
  border:1px solid var(--border);
  text-align:center;
}

.name-box h2 {
  margin-top:0;
}

.name-box p {
  color:var(--muted);
}

.name-box input {
  width:100%;
  padding:14px;
  margin:14px 0;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  outline:none;
}

.name-box button {
  padding:12px 20px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

/* =====================================================
   SECRET CAT
===================================================== */

.secret-cat {
  position:fixed;
  right:18px;
  bottom:18px;
  width:45px;
  height:45px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--panel);
  backdrop-filter:blur(12px);
  font-size:25px;
  opacity:.3;
  transition:.2s;
  z-index:999;
}

.secret-cat:hover {
  opacity:1;
  transform:scale(1.15) rotate(-6deg);
}

.secret-cat.meowing {
  animation:catMeow .5s ease;
}

@keyframes catMeow {
  0% {transform:scale(1);}
  30% {transform:scale(1.35) rotate(-8deg);}
  60% {transform:scale(.9) rotate(8deg);}
  100% {transform:scale(1);}
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

  .sidebar {
    display:none;
  }

  .shoe-meter {
    display:none;
  }

  #messages {
    padding:16px;
  }

  .message {
    max-width:90%;
  }

  .secret-cat {
    bottom:80px;
  }

  .arcade {
    padding:5px;
  }

  .arcade-card {
    width:100%;
    height:96vh;
    border-radius:18px;
  }

  .game-list {
    grid-template-columns:1fr;
  }

  .game-stats {
    gap:20px;
  }
}
</style>

</head>

<body>

<script>

/* =====================================================
   STATE
===================================================== */

let playerName =
  localStorage.getItem("catAIPlayerName") || "";

let selectedGame = "mouse";

let pendingGame = null;

let currentChat = {
  id:Date.now(),
  title:"New Chat",
  messages:[]
};

let gameState = {
  running:false,
  score:0,
  time:0,
  goal:0,
  timer:null,
  target:null,
  startedAt:0,
  game:null
};


/* =====================================================
   GAME DEFINITIONS
===================================================== */

const GAMES = {

  mouse:{
    icon:"🐭",
    title:"Catch the Mouse!",
    description:"Catch 20 mice in 1 minute!",
    goal:20,
    time:60,
    mode:"score"
  },

  yarn:{
    icon:"🧶",
    title:"Yarn Frenzy!",
    description:"Catch 40 balls of yarn in 30 seconds!",
    goal:40,
    time:30,
    mode:"score"
  },

  fish:{
    icon:"🐟",
    title:"Fish Frenzy!",
    description:"Catch 30 fish in 30 seconds!",
    goal:30,
    time:30,
    mode:"score"
  },

  shoe:{
    icon:"👟",
    title:"Shoe Destroyer!",
    description:"DESTROY 35 suspicious shoes in 30 seconds!",
    goal:35,
    time:30,
    mode:"score"
  },

  feather:{
    icon:"🪶",
    title:"Feather Chase!",
    description:"Catch 25 feathers before time runs out!",
    goal:25,
    time:30,
    mode:"score"
  },

  box:{
    icon:"📦",
    title:"Box Attack!",
    description:"Attack 20 boxes in 30 seconds!",
    goal:20,
    time:30,
    mode:"score"
  }

};


/* =====================================================
   ELEMENTS
===================================================== */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const historyBox =
  document.getElementById("history");

const arcade =
  document.getElementById("arcade");

const arcadeView =
  document.getElementById("arcadeView");

const nameOverlay =
  document.getElementById("nameOverlay");

const playerNameInput =
  document.getElementById("playerName");


/* =====================================================
   CHAT
===================================================== */

function addMessage(text,type,save=true) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  if(type === "cat") {

    const label =
      document.createElement("div");

    label.className =
      "cat-label";

    label.textContent =
      "🐈 Cat.AI";

    div.appendChild(label);

    div.appendChild(
      document.createTextNode(text)
    );

  } else {

    div.textContent = text;

  }

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

  if(save) {

    currentChat.messages.push({
      text,
      type
    });

    if(
      type === "user" &&
      currentChat.title === "New Chat"
    ) {

      currentChat.title =
        text.slice(0,30) +
        (text.length > 30 ? "..." : "");

    }

    saveChat();

  }
}


function showWelcome() {

  addMessage(
    "MEOW! New chat detected! What are we talking about?",
    "cat"
  );

}


async function sendMessage() {

  const text =
    input.value.trim();

  if(!text)
    return;

  addMessage(
    text,
    "user"
  );

  input.value = "";

  const thinking =
    document.createElement("div");

  thinking.className =
    "message cat";

  thinking.innerHTML =
    `
      <div class="cat-label">
        🐈 Cat.AI
      </div>
      Cat.AI is thinking... 🧠
    `;

  messages.appendChild(thinking);

  messages.scrollTop =
    messages.scrollHeight;

  try {

    const response =
      await fetch(
        "/chat",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            message:text,
            playerName:playerName
          })
        }
      );

    const data =
      await response.json();

    const reply =
      data.reply ||
      "MRRP! My brain exploded! 🐈";

    thinking.innerHTML =
      `
        <div class="cat-label">
          🐈 Cat.AI
        </div>
      `;

    thinking.appendChild(
      document.createTextNode(reply)
    );

    currentChat.messages.push({
      text:reply,
      type:"cat"
    });

    saveChat();

  } catch(error) {

    thinking.innerHTML =
      `
        <div class="cat-label">
          🐈 Cat.AI
        </div>
        MRRP! I can't reach my brain! 🧠💥
      `;

  }
}


input.addEventListener(
  "keydown",
  function(event) {

    if(event.key === "Enter") {
      sendMessage();
    }

  }
);


/* =====================================================
   CHAT HISTORY
===================================================== */

function saveChat() {

  if(!currentChat.messages.length)
    return;

  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );

  const index =
    chats.findIndex(
      chat =>
        chat.id === currentChat.id
    );

  if(index >= 0)
    chats[index] = currentChat;
  else
    chats.unshift(currentChat);

  localStorage.setItem(
    "catAIChats",
    JSON.stringify(
      chats.slice(0,30)
    )
  );

  loadHistory();

}


function loadHistory() {

  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );

  historyBox.innerHTML = "";

  chats.forEach(
    function(chat) {

      const item =
        document.createElement("div");

      item.className =
        "history-item";

      item.textContent =
        "🐾 " +
        (chat.title || "Untitled Chat");

      item.onclick =
        function() {
          loadChat(chat.id);
        };

      historyBox.appendChild(item);

    }
  );

}


function loadChat(id) {

  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );

  const chat =
    chats.find(
      c => c.id === id
    );

  if(!chat)
    return;

  currentChat =
    chat;

  messages.innerHTML = "";

  currentChat.messages.forEach(
    function(message) {

      addMessage(
        message.text,
        message.type,
        false
      );

    }
  );

}


function newChat() {

  saveChat();

  currentChat = {
    id:Date.now(),
    title:"New Chat",
    messages:[]
  };

  messages.innerHTML = "";

  showWelcome();

}


function clearHistory() {

  if(
    !confirm(
      "Delete all saved Cat.AI chats?"
    )
  )
    return;

  localStorage.removeItem(
    "catAIChats"
  );

  loadHistory();

}


/* =====================================================
   PLAYER NAME
===================================================== */

function ensurePlayerName(callback) {

  if(playerName) {

    callback();

    return;

  }

  pendingGame =
    callback;

  nameOverlay.classList.add(
    "open"
  );

  setTimeout(
    () => playerNameInput.focus(),
    50
  );

}


function savePlayerName() {

  const name =
    playerNameInput.value.trim();

  if(!name)
    return;

  playerName =
    name
      .replace(/[<>]/g,"")
      .slice(0,20);

  localStorage.setItem(
    "catAIPlayerName",
    playerName
  );

  nameOverlay.classList.remove(
    "open"
  );

  if(pendingGame) {

    const callback =
      pendingGame;

    pendingGame =
      null;

    callback();

  }

}


playerNameInput.addEventListener(
  "keydown",
  function(event) {

    if(event.key === "Enter") {
      savePlayerName();
    }

  }
);


/* =====================================================
   ARCADE
===================================================== */

function openArcade() {

  arcade.classList.add(
    "open"
  );

  showArcadeTab(
    "games"
  );

}


function closeArcade() {

  stopGame();

  arcade.classList.remove(
    "open"
  );

}


function showArcadeTab(tab) {

  document
    .getElementById("gamesTab")
    .classList.toggle(
      "active",
      tab === "games"
    );

  document
    .getElementById("leaderboardTab")
    .classList.toggle(
      "active",
      tab === "leaderboard"
    );

  if(tab === "games") {

    renderGameList();

  } else {

    loadLeaderboard();

  }

}


/* =====================================================
   GAME LIST
===================================================== */

function renderGameList() {

  const gameCards =
    Object.entries(GAMES)
      .map(
        ([id,game]) => {

          return `
            <div class="game-card">

              <div class="game-card-icon">
                ${game.icon}
              </div>

              <h3>
                ${game.title}
              </h3>

              <p>
                ${game.description}
              </p>

              <button
                class="play-button"
                onclick="startGame('${id}')">

                PLAY

              </button>

            </div>
          `;

        }
      )
      .join("");

  arcadeView.innerHTML =
    `
      <h2>
        🎮 Choose a game!
      </h2>

      <p style="color:var(--muted)">
        Six completely playable Cat.AI games.
      </p>

      <div class="game-list">
        ${gameCards}
      </div>
    `;

}


/* =====================================================
   START GAME
===================================================== */

function startGame(gameId) {

  ensurePlayerName(
    function() {

      selectedGame =
        gameId;

      const game =
        GAMES[gameId];

      gameState = {

        running:true,

        score:0,

        time:game.time,

        goal:game.goal,

        timer:null,

        target:null,

        startedAt:
          performance.now(),

        game:gameId

      };

      renderGameScreen();

      spawnTarget();

      gameState.timer =
        setInterval(
          tickGame,
          1000
        );

    }
  );

}


/* =====================================================
   GAME SCREEN
===================================================== */

function renderGameScreen() {

  const game =
    GAMES[
      gameState.game
    ];

  arcadeView.innerHTML =
    `

      <div class="game-screen">

        <div class="game-title">

          <h2>
            ${game.icon}
            ${game.title}
          </h2>

          <div class="game-description">
            ${game.description}
          </div>

        </div>

        <div class="game-stats">

          <div>
            Score:
            <span id="gameScore">
              0
            </span>
            / ${game.goal}
          </div>

          <div>
            Time:
            <span id="gameTime">
              ${game.time}
            </span>
            s
          </div>

        </div>

        <div
          id="gameBoard"
          class="game-board">
        </div>

        <div
          id="gameMessage"
          class="game-message">

          🐈 Cat.AI:
          ${getStartMessage()}

        </div>

        <div class="game-buttons">

          <button
            class="exit-game"
            onclick="exitGame()">

            ← EXIT GAME

          </button>

        </div>

      </div>

    `;

}


function getStartMessage() {

  const game =
    gameState.game;

  if(game === "shoe") {

    return "HISS! DESTROY THOSE SUSPICIOUS SHOES!";

  }

  if(game === "mouse") {

    return `MEOW, ${playerName}! Ready to hunt some mice?`;

  }

  return `MEOW, ${playerName}! LET'S GO!`;

}


/* =====================================================
   TIMER
===================================================== */

function tickGame() {

  if(!gameState.running)
    return;

  gameState.time--;

  updateGameStats();

  if(gameState.time <= 0) {

    finishGame(false);

  }

}


/* =====================================================
   TARGET SPAWNING
===================================================== */

function spawnTarget() {

  if(!gameState.running)
    return;

  const board =
    document.getElementById(
      "gameBoard"
    );

  if(!board)
    return;

  if(gameState.target) {

    gameState.target.remove();

  }

  const target =
    document.createElement(
      "button"
    );

  target.className =
    "target";

  target.textContent =
    GAMES[
      gameState.game
    ].icon;

  const maxX =
    Math.max(
      5,
      board.clientWidth - 70
    );

  const maxY =
    Math.max(
      5,
      board.clientHeight - 70
    );

  target.style.left =
    (
      Math.random() *
      maxX
    ) + "px";

  target.style.top =
    (
      Math.random() *
      maxY
    ) + "px";

  target.onclick =
    hitTarget;

  board.appendChild(
    target
  );

  gameState.target =
    target;

}


/* =====================================================
   HIT TARGET
===================================================== */

function hitTarget() {

  if(!gameState.running)
    return;

  gameState.score++;

  updateGameStats();

  playMeow();

  if(
    gameState.score >=
    gameState.goal
  ) {

    finishGame(true);

    return;

  }

  updateEncouragement();

  spawnTarget();

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateGameStats() {

  const score =
    document.getElementById(
      "gameScore"
    );

  const time =
    document.getElementById(
      "gameTime"
    );

  if(score) {

    score.textContent =
      gameState.score;

  }

  if(time) {

    time.textContent =
      gameState.time;

  }

}


/* =====================================================
   CAT.AI ENCOURAGEMENT
===================================================== */

let lastEncouragement = 0;

async function updateEncouragement() {

  if(
    gameState.score -
    lastEncouragement < 5 &&
    gameState.score !== 1
  ) {

    return;

  }

  lastEncouragement =
    gameState.score;

  const message =
    document.getElementById(
      "gameMessage"
    );

  if(!message)
    return;

  message.textContent =
    "🐈 Cat.AI: MEOW! KEEP GOING!";

  try {

    const response =
      await fetch(
        "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:
              `You are Cat.AI encouraging ${playerName} during the ${GAMES[gameState.game].title} minigame. They have ${gameState.score}/${gameState.goal} points and ${gameState.time} seconds left. Give one short excited cat-like encouragement. Maximum 12 words.`,

            playerName:
              playerName

          })
        }
      );

    if(!response.ok)
      throw new Error(
        "Chat request failed"
      );

    const data =
      await response.json();

    message.textContent =
      "🐈 Cat.AI: " +
      (
        data.reply ||
        fallbackEncouragement()
      );

  } catch(error) {

    message.textContent =
      "🐈 Cat.AI: " +
      fallbackEncouragement();

  }

}


function fallbackEncouragement() {

  const game =
    gameState.game;

  if(game === "shoe")
    return "HISS! DESTROY MORE SHOES!";

  if(gameState.score >=
     gameState.goal - 2)
    return "MEOW!!! YOU'RE ALMOST THERE!";

  if(gameState.score >= 10)
    return "PURRRR! THAT'S A LOT OF CATCHES!";

  if(game === "mouse")
    return "GET THAT MOUSE!";

  if(game === "yarn")
    return "THE YARN CANNOT ESCAPE!";

  if(game === "fish")
    return "CATCH THAT FISH!";

  if(game === "feather")
    return "FLY AFTER THE FEATHER!";

  if(game === "box")
    return "ATTACK THE BOX!";

  return "MEOW! KEEP GOING!";

}


/* =====================================================
   FINISH GAME
===================================================== */

async function finishGame(won) {

  if(!gameState.running)
    return;

  gameState.running =
    false;

  clearInterval(
    gameState.timer
  );

  gameState.timer =
    null;

  if(gameState.target) {

    gameState.target.remove();

    gameState.target =
      null;

  }

  const game =
    GAMES[
      gameState.game
    ];

  const completionTime =
    Math.max(
      0,
      Math.round(
        (
          performance.now() -
          gameState.startedAt
        ) / 1000
      )
    );

  const message =
    document.getElementById(
      "gameMessage"
    );

  if(won) {

    message.textContent =
      `🐈 Cat.AI: MEOW!!! ${playerName.toUpperCase()} WON ${game.title.toUpperCase()}! 🎉`;

    playWinSound();

  } else {

    message.textContent =
      `🐈 Cat.AI: TIME'S UP! ${playerName.toUpperCase()} got ${gameState.score} points!`;

  }

  await submitScore(
    gameState.score,
    completionTime,
    won
  );

  const buttons =
    document.querySelector(
      ".game-buttons"
    );

  if(buttons) {

    buttons.innerHTML =
      `

        <button
          class="start-game"
          onclick="startGame('${gameState.game}')">

          🔄 PLAY AGAIN

        </button>

        <button
          class="exit-game"
          onclick="showArcadeTab('leaderboard')">

          🏆 LEADERBOARD

        </button>

      `;

  }

}


/* =====================================================
   EXIT GAME
===================================================== */

function exitGame() {

  stopGame();

  renderGameList();

}


/* =====================================================
   STOP GAME
===================================================== */

function stopGame() {

  gameState.running =
    false;

  clearInterval(
    gameState.timer
  );

  gameState.timer =
    null;

  if(gameState.target) {

    gameState.target.remove();

    gameState.target =
      null;

  }

}


/* =====================================================
   SCORE SUBMISSION
===================================================== */

async function submitScore(
  score,
  time,
  won
) {

  try {

    const response =
      await fetch(
        "/api/scores",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            name:
              playerName,

            game:
              gameState.game,

            score:
              score,

            time:
              time,

            won:
              won

          })
        }
      );

    if(!response.ok) {

      console.error(
        "Server rejected score."
      );

    }

  } catch(error) {

    console.error(
      "Score submission failed:",
      error
    );

  }

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard() {

  arcadeView.innerHTML =
    `

      <h2>
        🏆 Global Cat.AI Leaderboard
      </h2>

      <p style="color:var(--muted)">
        Real scores from players using your server.
      </p>

      <select
        id="leaderboardGame"
        class="leaderboard-select"
        onchange="loadLeaderboardFor(this.value)">

        ${Object.entries(GAMES)
          .map(
            ([id,game]) =>
              `
                <option
                  value="${id}"
                  ${id === selectedGame ? "selected" : ""}>
                  ${game.icon} ${game.title}
                </option>
              `
          )
          .join("")}

      </select>

      <div id="leaderboardResults">
        Loading cats...
      </div>

    `;

  await loadLeaderboardFor(
    selectedGame
  );

}


async function loadLeaderboardFor(gameId) {

  selectedGame =
    gameId;

  const results =
    document.getElementById(
      "leaderboardResults"
    );

  if(!results)
    return;

  results.innerHTML =
    `
      <p style="color:var(--muted)">
        🐈 Cat.AI is checking the scores...
      </p>
    `;

  try {

    const response =
      await fetch(
        "/api/leaderboard?game=" +
        encodeURIComponent(
          gameId
        )
      );

    if(!response.ok)
      throw new Error(
        "Leaderboard request failed"
      );

    const data =
      await response.json();

    const rows =
      Array.isArray(data.scores)
        ? data.scores
        : [];

    results.innerHTML =
      `

        <table class="leaderboard-table">

          <thead>

            <tr>
              <th>#</th>
              <th>PLAYER</th>
              <th>SCORE</th>
              <th>TIME</th>
            </tr>

          </thead>

          <tbody>

            ${
              rows.length

                ? rows
                    .slice(0,50)
                    .map(
                      function(row,index) {

                        return `

                          <tr>

                            <td>
                              ${
                                index === 0
                                  ? "👑"
                                  : index + 1
                              }
                            </td>

                            <td>
                              ${escapeHtml(
                                String(
                                  row.name ||
                                  "Anonymous Cat"
                                )
                              )}
                            </td>

                            <td>
                              ${Number(
                                row.score || 0
                              )}
                            </td>

                            <td>
                              ${Number(
                                row.time || 0
                              )}s
                            </td>

                          </tr>

                        `;

                      }
                    )
                    .join("")

                : `

                  <tr>

                    <td
                      colspan="4"
                      style="text-align:center">

                      No scores yet!
                      Be the first cat! 🐈

                    </td>

                  </tr>

                `
            }

          </tbody>

        </table>

      `;

  } catch(error) {

    results.innerHTML =
      `

        <div
          style="
            padding:20px;
            border:1px solid var(--border);
            border-radius:15px;
            background:var(--panel2);
          ">

          <h3>
            🐈 Leaderboard unavailable
          </h3>

          <p style="color:var(--muted)">
            Cat.AI can't reach the leaderboard server yet.
          </p>

          <p style="color:var(--muted);font-size:12px">
            Make sure your Node.js server is running
            and has the /api/scores and
            /api/leaderboard endpoints.
          </p>

        </div>

      `;

  }

}


/* =====================================================
   HTML ESCAPING
===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* =====================================================
   SECRET CAT
===================================================== */

function secretMeow() {

  const cat =
    document.querySelector(
      ".secret-cat"
    );

  cat.classList.remove(
    "meowing"
  );

  void cat.offsetWidth;

  cat.classList.add(
    "meowing"
  );

  playMeow();

  const bubble =
    document.createElement(
      "div"
    );

  bubble.textContent =
    "MEOW! 🐈";

  bubble.style.cssText =
    `
      position:fixed;
      right:70px;
      bottom:70px;
      padding:10px 15px;
      border-radius:15px;
      background:var(--panel);
      color:var(--text);
      border:1px solid var(--border);
      z-index:1000;
      font-weight:bold;
    `;

  document.body.appendChild(
    bubble
  );

  setTimeout(
    () => bubble.remove(),
    1200
  );

}


/* =====================================================
   MEOW SOUND
===================================================== */

function playMeow() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext)
    return;

  const audio =
    new AudioContext();

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.type =
    "sine";

  osc.frequency.setValueAtTime(
    650,
    audio.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    900,
    audio.currentTime + .08
  );

  osc.frequency.exponentialRampToValueAtTime(
    420,
    audio.currentTime + .22
  );

  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .18,
    audio.currentTime + .02
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + .22
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime + .22
  );

}


function playWinSound() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext)
    return;

  const audio =
    new AudioContext();

  [
    523,
    659,
    784,
    1046
  ].forEach(
    function(frequency,index) {

      const osc =
        audio.createOscillator();

      const gain =
        audio.createGain();

      const start =
        audio.currentTime +
        index * .12;

      osc.type =
        "sine";

      osc.frequency.value =
        frequency;

      gain.gain.setValueAtTime(
        .001,
        start
      );

      gain.gain.exponentialRampToValueAtTime(
        .2,
        start + .02
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        start + .18
      );

      osc.connect(gain);
      gain.connect(
        audio.destination
      );

      osc.start(start);

      osc.stop(
        start + .18
      );

    }
  );

}


/* =====================================================
   STARTUP
===================================================== */

loadHistory();

showWelcome();

</script>
