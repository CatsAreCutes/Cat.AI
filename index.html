<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cat.AI 🐈</title>

<style>

* {
  box-sizing:border-box;
}

:root {
  --text:#f8f3ff;
  --muted:#aaa0bd;

  --bg:#080611;
  --panel:rgba(25,18,42,.94);
  --panel2:rgba(255,255,255,.07);

  --border:rgba(255,255,255,.14);

  --accent:#9b62ff;
  --accent2:#5d7cff;

  --user1:#7550c9;
  --user2:#536dd5;

  --good:#55dc8a;
  --gold:#ffd45c;
}

body {
  margin:0;
  min-height:100vh;

  font-family:
    Arial,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(155,98,255,.30),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(70,110,255,.25),
      transparent 30%
    ),
    var(--bg);

  overflow:hidden;
}

button,
input {
  font:inherit;
}

button {
  cursor:pointer;
}

button:active {
  transform:scale(.97);
}


/* =====================================================
   APP
===================================================== */

.app {
  width:100vw;
  height:100vh;

  display:flex;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  width:280px;

  padding:18px;

  background:var(--panel);

  border-right:
    1px solid var(--border);

  display:flex;
  flex-direction:column;

  gap:12px;

  overflow:hidden;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;

  font-size:23px;
  font-weight:bold;

  margin-bottom:3px;
}

.logo-cat {
  width:46px;
  height:46px;

  display:grid;
  place-items:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-size:27px;

  box-shadow:
    0 8px 25px
    rgba(115,80,220,.3);
}

.sidebar-button {
  width:100%;

  border:0;
  border-radius:13px;

  padding:12px;

  color:white;

  font-weight:bold;

  transition:.15s;
}

.sidebar-button:hover {
  filter:brightness(1.15);
}

.new-chat {
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.arcade-button {
  background:
    linear-gradient(
      135deg,
      #ff8a3d,
      #e74d91
    );
}

.shop-button {
  background:
    linear-gradient(
      135deg,
      #36c98b,
      #2e9ed8
    );
}

.themes-button {
  background:
    linear-gradient(
      135deg,
      #c56cff,
      #ff66b5
    );
}

.clear-button {
  background:#34303d;
}

.credits-button {
  background:#24202d;
}

.dollars {
  padding:12px 14px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      rgba(255,212,92,.18),
      rgba(255,255,255,.05)
    );

  border:
    1px solid
    rgba(255,212,92,.25);

  color:var(--gold);

  font-weight:bold;

  text-align:center;

  box-shadow:
    0 5px 20px
    rgba(255,212,92,.05);
}

.history-title {
  margin-top:5px;

  color:var(--muted);

  font-size:11px;

  letter-spacing:1px;

  font-weight:bold;
}

.history {
  flex:1;

  overflow:auto;

  padding-right:3px;
}

.history-item {
  padding:10px;

  margin-bottom:6px;

  border-radius:10px;

  color:var(--muted);

  cursor:pointer;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  transition:.15s;
}

.history-item:hover {
  background:var(--panel2);
  color:var(--text);
}

.empty-history {
  color:var(--muted);
  font-size:13px;
  padding:10px;
}


/* =====================================================
   MAIN
===================================================== */

.main {
  flex:1;

  min-width:0;

  display:flex;
  flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

header {
  height:78px;

  padding:
    14px 22px;

  display:flex;
  align-items:center;

  gap:14px;

  border-bottom:
    1px solid var(--border);

  background:var(--panel);

  backdrop-filter:blur(15px);
}

.avatar {
  width:48px;
  height:48px;

  display:grid;
  place-items:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-size:28px;
}

.header-text h1 {
  margin:0;
}

.header-text span {
  color:var(--good);

  font-size:10px;

  font-weight:bold;
}

.shoe-meter {
  margin-left:auto;

  color:#d99049;

  font-size:13px;

  font-weight:bold;
}


/* =====================================================
   MESSAGES
===================================================== */

#messages {
  flex:1;

  overflow:auto;

  padding:28px;
}

.message {
  max-width:78%;

  margin:13px 0;

  padding:14px 17px;

  border-radius:20px;

  line-height:1.5;

  white-space:pre-wrap;

  overflow-wrap:anywhere;

  animation:
    messageIn .18s ease;
}

@keyframes messageIn {
  from {
    opacity:0;
    transform:translateY(5px);
  }

  to {
    opacity:1;
    transform:translateY(0);
  }
}

.user {
  margin-left:auto;

  background:
    linear-gradient(
      135deg,
      var(--user1),
      var(--user2)
    );

  box-shadow:
    0 5px 20px
    rgba(70,60,160,.15);
}

.cat {
  background:var(--panel2);

  border:
    1px solid var(--border);
}

.cat-label {
  font-weight:bold;

  margin-bottom:6px;
}


/* =====================================================
   INPUT
===================================================== */

.bottom {
  padding:
    15px 22px 20px;

  border-top:
    1px solid var(--border);

  background:var(--panel);
}

.input-row {
  display:flex;

  gap:10px;
}

#input {
  flex:1;

  min-width:0;

  padding:15px;

  border-radius:15px;

  border:
    1px solid var(--border);

  outline:none;

  color:var(--text);

  background:var(--panel2);
}

#input:focus {
  border-color:var(--accent);
}

.send {
  width:90px;

  border:0;

  border-radius:15px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight:bold;
}


/* =====================================================
   MODAL SYSTEM
===================================================== */

.modal {
  display:none;

  position:fixed;

  inset:0;

  z-index:500;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:blur(12px);
}

.modal.open {
  display:flex;
}

.modal-card {
  width:min(800px,100%);

  max-height:90vh;

  overflow:auto;

  padding:25px;

  border-radius:25px;

  border:
    1px solid var(--border);

  background:var(--panel);

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.45);
}

.modal-header {
  display:flex;
  align-items:center;

  gap:12px;

  margin-bottom:20px;
}

.modal-header h2 {
  margin:0;
}

.close-button {
  margin-left:auto;

  width:40px;
  height:40px;

  border:0;

  border-radius:12px;

  color:var(--text);

  background:var(--panel2);
}


/* =====================================================
   STORE
===================================================== */

.store-tabs {
  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:18px;
}

.store-tab {
  padding:10px 14px;

  border:
    1px solid var(--border);

  border-radius:12px;

  color:var(--text);

  background:var(--panel2);
}

.store-tab.active {
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.store-grid {
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(190px,1fr)
    );

  gap:14px;
}

.store-item {
  padding:18px;

  border-radius:18px;

  border:
    1px solid var(--border);

  background:var(--panel2);

  text-align:center;
}

.store-icon {
  font-size:45px;
}

.store-item h3 {
  margin:
    10px 0 5px;
}

.store-item p {
  color:var(--muted);

  min-height:38px;
}

.buy-button {
  width:100%;

  padding:11px;

  border:0;

  border-radius:12px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #36c98b,
      #2e9ed8
    );

  font-weight:bold;
}

.buy-button:disabled {
  opacity:.4;
  cursor:not-allowed;
}

.owned {
  background:#555;
}


/* =====================================================
   ARCADE
===================================================== */

.arcade {
  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  background:
    rgba(5,3,12,.88);

  backdrop-filter:blur(15px);

  align-items:center;
  justify-content:center;

  padding:20px;
}

.arcade.open {
  display:flex;
}

.arcade-card {
  width:min(950px,100%);

  height:min(720px,92vh);

  display:flex;
  flex-direction:column;

  overflow:hidden;

  border-radius:25px;

  border:
    1px solid var(--border);

  background:var(--panel);
}

.arcade-header {
  display:flex;
  align-items:center;

  gap:12px;

  padding:
    18px 22px;

  border-bottom:
    1px solid var(--border);
}

.arcade-header h2 {
  margin:0;
}

.arcade-tabs {
  display:flex;

  gap:8px;

  padding:12px 18px;

  border-bottom:
    1px solid var(--border);
}

.arcade-tab {
  border:
    1px solid var(--border);

  border-radius:12px;

  padding:10px 15px;

  color:var(--text);

  background:var(--panel2);
}

.arcade-tab.active {
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.arcade-view {
  flex:1;

  overflow:auto;

  padding:20px;
}

.game-list {
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(220px,1fr)
    );

  gap:15px;
}

.game-card {
  padding:20px;

  border:
    1px solid var(--border);

  border-radius:18px;

  background:var(--panel2);
}

.game-card-icon {
  font-size:42px;
}

.game-card h3 {
  margin:10px 0 5px;
}

.game-card p {
  color:var(--muted);

  min-height:38px;
}

.play-button {
  width:100%;

  padding:12px;

  border:0;

  border-radius:12px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight:bold;
}

.game-screen {
  height:100%;

  display:flex;
  flex-direction:column;
}

.game-title {
  text-align:center;
}

.game-title h2 {
  margin:5px;
}

.game-title p {
  color:var(--muted);
}

.game-stats {
  display:flex;

  justify-content:center;

  gap:40px;

  padding:12px;

  font-weight:bold;
}

.game-stats span {
  color:var(--accent);

  font-size:20px;
}

.game-board {
  position:relative;

  flex:1;

  min-height:280px;

  overflow:hidden;

  margin:10px;

  border-radius:20px;

  border:
    2px solid var(--border);

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(155,98,255,.2),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(93,124,255,.2),
      transparent 30%
    ),
    var(--panel2);
}

.target {
  position:absolute;

  border:0;

  background:transparent;

  font-size:45px;

  padding:0;

  user-select:none;

  transition:
    transform .08s;
}

.target:hover {
  transform:scale(1.15);
}

.game-message {
  min-height:55px;

  margin:
    0 10px 12px;

  padding:14px;

  text-align:center;

  border-radius:15px;

  border:
    1px solid var(--border);

  background:var(--panel2);
}

.exit-button {
  align-self:center;

  padding:
    12px 22px;

  margin-bottom:10px;

  border:0;

  border-radius:12px;

  color:white;

  background:#555;
}

.leaderboard-table {
  width:100%;

  border-collapse:collapse;
}

.leaderboard-table th,
.leaderboard-table td {
  padding:12px;

  border-bottom:
    1px solid var(--border);

  text-align:left;
}

.leaderboard-table th {
  color:var(--muted);
}


/* =====================================================
   SECRET CAT
===================================================== */

.secret-cat {
  position:fixed;

  left:7px;
  bottom:7px;

  z-index:450;

  width:18px;
  height:18px;

  border:0;

  padding:0;

  opacity:.04;

  background:transparent;

  color:white;

  font-size:13px;

  transition:
    opacity .2s,
    transform .2s;
}

.secret-cat:hover {
  opacity:.35;
  transform:scale(1.5);
}

.secret-bubble {
  position:fixed;

  left:28px;
  bottom:28px;

  z-index:451;

  padding:7px 11px;

  border-radius:12px;

  background:var(--panel);

  border:
    1px solid var(--border);

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transform:translateY(5px);

  transition:.2s;
}

.secret-bubble.show {
  opacity:1;
  transform:translateY(0);
}


/* =====================================================
   NAME
===================================================== */

.name-box {
  width:min(430px,100%);

  padding:30px;

  border-radius:22px;

  background:var(--panel);

  border:
    1px solid var(--border);

  text-align:center;
}

.name-box input {
  width:100%;

  padding:14px;

  margin:15px 0;

  border-radius:12px;

  border:
    1px solid var(--border);

  color:var(--text);

  background:var(--panel2);
}

.name-box button {
  padding:
    12px 20px;

  border:0;

  border-radius:12px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}


/* =====================================================
   CREDITS
===================================================== */

.credits {
  text-align:center;

  padding:20px;

  font-size:20px;
}

.credits .big {
  font-size:55px;
}

.credits p {
  color:var(--muted);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

  .sidebar {
    display:none;
  }

  #messages {
    padding:16px;
  }

  .message {
    max-width:90%;
  }

  .shoe-meter {
    display:none;
  }

  .arcade {
    padding:5px;
  }

  .arcade-card {
    height:97vh;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

  <div class="logo">
    <div class="logo-cat">🐈</div>
    Cat.AI
  </div>

  <div id="dollars" class="dollars">
    💰 Dollars: 0
  </div>

  <button
    class="sidebar-button new-chat"
    onclick="newChat()">
    🐾 New Chat
  </button>

  <button
    class="sidebar-button arcade-button"
    onclick="openArcade()">
    🎮 Cat Arcade
  </button>

  <button
    class="sidebar-button shop-button"
    onclick="openStore('food')">
    🛍️ Cat Shop
  </button>

  <button
    class="sidebar-button themes-button"
    onclick="openStore('themes')">
    🎨 Themes
  </button>

  <button
    class="sidebar-button clear-button"
    onclick="clearChat()">
    🧹 Clear Chat
  </button>

  <button
    class="sidebar-button credits-button"
    onclick="openCredits()">
    💳 Credits
  </button>

  <div class="history-title">
    📜 CHAT HISTORY
  </div>

  <div
    id="history"
    class="history">
  </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

<header>

  <div class="avatar">
    🐈
  </div>

  <div class="header-text">

    <h1>
      Cat.AI
    </h1>

    <span>
      ● BRAIN ONLINE
    </span>

  </div>

  <div class="shoe-meter">
    👟 SHOES: SUSPICIOUS
  </div>

</header>


<div id="messages"></div>


<div class="bottom">

  <div class="input-row">

    <input
      id="input"
      placeholder="Talk to Cat.AI..."
      autocomplete="off">

    <button
      class="send"
      onclick="sendMessage()">
      SEND
    </button>

  </div>

</div>

</main>

</div>


<!-- =====================================================
     SECRET CAT
===================================================== -->

<button
  class="secret-cat"
  onclick="secretCat()"
  title="">
  🐈
</button>

<div
  id="secretBubble"
  class="secret-bubble">
  mrrp...
</div>


<!-- =====================================================
     ARCADE
===================================================== -->

<div
  id="arcade"
  class="modal">

  <div class="arcade-card">

    <div class="arcade-header">

      <div style="font-size:32px">
        🐈
      </div>

      <div>
        <h2>
          Cat.AI Arcade
        </h2>

        <div
          style="font-size:11px;color:var(--muted)">
          SIX GAMES • EARN DOLLARS
        </div>
      </div>

      <button
        class="close-button"
        onclick="closeArcade()">
        ✕
      </button>

    </div>


    <div class="arcade-tabs">

      <button
        id="gamesTab"
        class="arcade-tab active"
        onclick="showTab('games')">
        🎮 Games
      </button>

      <button
        id="leaderboardTab"
        class="arcade-tab"
        onclick="showTab('leaderboard')">
        🏆 Leaderboard
      </button>

    </div>


    <div
      id="arcadeView"
      class="arcade-view">
    </div>

  </div>

</div>


<!-- =====================================================
     STORE
===================================================== -->

<div
  id="store"
  class="modal">

  <div class="modal-card">

    <div class="modal-header">

      <h2>
        🛍️ Cat.AI Shop
      </h2>

      <button
        class="close-button"
        onclick="closeStore()">
        ✕
      </button>

    </div>

    <div
      id="storeContent">
    </div>

  </div>

</div>


<!-- =====================================================
     CREDITS
===================================================== -->

<div
  id="credits"
  class="modal">

  <div class="modal-card">

    <div class="modal-header">

      <h2>
        💳 Credits
      </h2>

      <button
        class="close-button"
        onclick="closeCredits()">
        ✕
      </button>

    </div>

    <div class="credits">

      <div class="big">
        🐈
      </div>

      <h2>
        Cat.AI
      </h2>

      <p>
        Website created by
      </p>

      <h2>
        Cookie
      </h2>

      <p>
        with help from
      </p>

      <h2>
        ChatGPT
      </h2>

      <p>
        ChatGPT kinda mid lol
      </p>

    </div>

  </div>

</div>


<!-- =====================================================
     NAME
===================================================== -->

<div
  id="nameOverlay"
  class="modal">

  <div class="name-box">

    <h2>
      🐈 Who are you?
    </h2>

    <p>
      Pick the name Cat.AI will use.
    </p>

    <input
      id="playerName"
      maxlength="20"
      placeholder="Cookie">

    <button
      onclick="saveName()">
      LET'S PLAY!
    </button>

  </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let playerName =
  localStorage.getItem(
    "catAIPlayerName"
  ) || "";

let dollars =
  Number(
    localStorage.getItem(
      "catAIDollars"
    ) || 0
  );

let currentChatId = null;

let currentGame = null;

let currentStoreTab = "food";

let offended = false;

let pendingAction = null;

let game = {
  running:false,
  score:0,
  time:0,
  timer:null,
  target:null
};


/* =====================================================
   ELEMENTS
===================================================== */

const messages =
  document.getElementById(
    "messages"
  );

const input =
  document.getElementById(
    "input"
  );

const historyBox =
  document.getElementById(
    "history"
  );

const arcade =
  document.getElementById(
    "arcade"
  );

const arcadeView =
  document.getElementById(
    "arcadeView"
  );

const store =
  document.getElementById(
    "store"
  );

const storeContent =
  document.getElementById(
    "storeContent"
  );

const credits =
  document.getElementById(
    "credits"
  );

const nameOverlay =
  document.getElementById(
    "nameOverlay"
  );

const playerNameInput =
  document.getElementById(
    "playerName"
  );

const dollarsBox =
  document.getElementById(
    "dollars"
  );


/* =====================================================
   DOLLARS
===================================================== */

function updateDollars() {

  dollarsBox.textContent =
    "💰 Dollars: " +
    dollars;

  localStorage.setItem(
    "catAIDollars",
    dollars
  );

}

function addDollars(amount) {

  dollars += amount;

  updateDollars();

}


/* =====================================================
   THEMES
===================================================== */

function getChats() {

  return JSON.parse(
    localStorage.getItem(
      "catAIChats"

  );

}


function saveChats(chats) {

  localStorage.setItem(
    "catAIChats",
    JSON.stringify(
      chats
    )
  );

}


function createChat() {

  const chat = {

    id:
      Date.now().toString() +
      Math.random()
        .toString(36)
        .slice(2),

    title:
      "New Chat",

    messages:[],

    date:
      Date.now()

  };

  const chats =
    getChats();

  chats.unshift(
    chat
  );

  saveChats(
    chats.slice(0,50)
  );

  return chat;

}


function getCurrentChat() {

  const chats =
    getChats();

  return chats.find(
    chat =>
      chat.id ===
      currentChatId
  );

}


function ensureChat() {

  if(currentChatId)
    return;

  const chat =
    createChat();

  currentChatId =
    chat.id;

}


function saveMessage(
  text,
  type
) {

  ensureChat();

  const chats =
    getChats();

  const chat =
    chats.find(
      c =>
        c.id ===
        currentChatId
    );

  if(!chat)
    return;

  chat.messages.push({
    text,
    type
  });

  if(
    type === "user" &&
    chat.title ===
      "New Chat"
  ) {

    chat.title =
      text.slice(0,35) ||
      "New Chat";

  }

  chat.date =
    Date.now();

  saveChats(
    chats
  );

  loadHistory();

}


function loadChat(id) {

  const chats =
    getChats();

  const chat =
    chats.find(
      c =>
        c.id === id
    );

  if(!chat)
    return;

  currentChatId =
    id;

  messages.innerHTML =
    "";

  chat.messages.forEach(
    message => {

      renderMessage(
        message.text,
        message.type,
        false
      );

    }
  );

  if(!chat.messages.length) {

    addCatMessage(
      "Cat.AI is online. Ask me anything or open the Cat Arcade! 6 Games in the arcade! Yay!"
    );

  }

}


function loadHistory() {

  const chats =
    getChats();

  historyBox.innerHTML =
    "";

  if(!chats.length) {

    historyBox.innerHTML =
      `<div class="empty-history">
        No chats yet.
      </div>`;

    return;

  }

  chats.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      item.textContent =
        "🐾 " +
        chat.title;

      item.onclick =
        () =>
          loadChat(
            chat.id
          );

      historyBox.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   MESSAGE RENDERING
===================================================== */

function cleanReply(text) {

  if(
    typeof text !==
    "string"
  )
    return "";

  return text
    .replace(
      /```/g,
      ""
    )
    .replace(
      /`{1,2}/g,
      ""
    )
    .trim();

}


function renderMessage(
  text,
  type,
  save = true
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " +
    type;

  if(type === "cat") {

    const label =
      document.createElement(
        "div"
      );

    label.className =
      "cat-label";

    label.textContent =
      "🐈 Cat.AI";

    div.appendChild(
      label
    );

    div.appendChild(
      document.createTextNode(
        cleanReply(text)
      )
    );

  } else {

    div.textContent =
      text;

  }

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;

  if(save)
    saveMessage(
      text,
      type
    );

  return div;

}


function addMessage(
  text,
  type
) {

  return renderMessage(
    text,
    type,
    true
  );

}


function addCatMessage(
  text
) {

  return addMessage(
    text,
    "cat"
  );

}

function containsAnotherAI(
  text
) {

  const lower =
    text.toLowerCase();

  return knownAIs.some(
    ai =>
      lower.includes(
        ai.toLowerCase()
      )
  );

}


function exactSorry(
  text
) {

  return text
    .trim()
    .toLowerCase() ===
    "sorry";

}


function offendedResponse(
  text
) {

  if(
    !offended &&
    containsAnotherAI(text)
  ) {

    offended =
      true;

    return true;

  }

  return false;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();

  if(!text)
    return;

  addMessage(
    text,
    "user"
  );

  input.value =
    "";

  /*
    EXACTLY "sorry" forgives Cat.AI.
    "sorryy", "sorryyyyy", etc. do NOT.
  */

  if(offended) {

    if(
      exactSorry(text)
    ) {

      offended =
        false;

      addCatMessage(
        "Fine. I forgive you. 😾➡️🐈"
      );

      return;

    }

    addCatMessage(
      "You mentioned another AI. I am offended. 😾"
    );

    return;

  }

  if(
    containsAnotherAI(text)
  ) {

    offended =
      true;

    addCatMessage(
      "Oh. Another AI? REALLY? 😾"
    );

    return;

  }

  const thinking =
    renderMessage(
      "Cat.AI is thinking...",
      "cat",
      false
    );

  try {

    const response =
      await fetch(
        "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:text
            })
        }
      );

    if(!response.ok)
      throw new Error(
        "Chat request failed"
      );

    const data =
      await response.json();

    const reply =
      cleanReply(
        data.reply ||
        "Mrrp! My brain turned into a potatoh. 🥔"
      );

    thinking.remove();

    addCatMessage(
      reply
    );

  } catch(error) {

    console.error(
      error
    );

    thinking.remove();

    addCatMessage(
      "Mrrp! My brain turned into a potatoh. 🥔"
    );

  }

}


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ) {

      sendMessage();

    }

  }
);

function requireName(
  action
) {

  if(playerName) {

    action();

    return;

  }

  pendingAction =
    action;

  nameOverlay.classList.add(
    "open"
  );

  playerNameInput.focus();

}


function saveName() {

  const name =
    playerNameInput.value
      .trim()
      .replace(
        /[<>]/g,
        ""
      )
      .slice(0,20);

  if(!name)
    return;

  playerName =
    name;

  localStorage.setItem(
    "catAIPlayerName",
    playerName
  );

  nameOverlay.classList.remove(
    "open"
  );

  if(pendingAction) {

    const action =
      pendingAction;

    pendingAction =
      null;

    action();

  }

}


/* =====================================================
   START GAME
===================================================== */

function playGame(id) {

  requireName(
    () =>
      startGame(id)
  );

}


function startGame(id) {

  stopGame();

  currentGame =
    id;

  const config =
    games[id];

  game = {

    running:true,

    score:0,

    time:
      config.time,

    timer:null,

    target:null

  };

  renderGame();

  spawnTarget();

  game.timer =
    setInterval(
      () => {

        game.time--;

        updateStats();

        if(
          game.time <= 0
        ) {

          finishGame(
            false
          );

        }

      },
      1000
    );

}


function renderGame() {

  const config =
    games[currentGame];

  arcadeView.innerHTML = `

    <div class="game-screen">

      <div class="game-title">

        <h2>
          ${config.icon}

function updateStats() {

  const score =

  if(score)
    score.textContent =

/* =====================================================
   TARGET
===================================================== */

function spawnTarget() {

  if(!game.running)
    return;

  const board =
    document.getElementById(
      "gameBoard"
    );

  if(!board)
    return;

  if(game.target)
    game.target.remove();

  const target =
    document.createElement(
      "button"
    );

  target.className =
    "target";

  target.textContent =
    games[
      currentGame
    ].icon;

  const x =
    Math.random() *
    Math.max(
      1,
      board.clientWidth - 60
    );

  const y =
    Math.random() *
    Math.max(
      1,
      board.clientHeight - 60
    );

  target.style.left =
    x + "px";

  target.style.top =
    y + "px";

  target.onclick =
    hitTarget;

  board.appendChild(
    target
  );

  game.target =
    target;

}


/* =====================================================
   HIT
===================================================== */

function hitTarget() {

  if(!game.running)
    return;

  game.score++;

  /*
    100 dollars EVERY HIT.
  */

  addDollars(
    100
  );

  updateStats();

  playMeow();

  if(
    game.score >=
    games[
      currentGame
    ].goal
  ) {

    finishGame(
      true
    );

    return;

  }

  gameEncouragement();

  spawnTarget();

}


/* =====================================================
   GAME ENCOURAGEMENT
===================================================== */

function gameEncouragement() {

  const message =
    document.getElementById(
      "gameMessage"
    );

  if(!message)
    return;

  if(
    game.score % 5 !== 0 &&
    game.score !== 1
  )
    return;

  const lines = [

    "KEEP GOING! 🐈",

    "CAT POWER!!!",

    "THE MOUSE CANNOT ESCAPE! 🐭",

    "MORE! MORE! MORE!",

    "YOU GOT THIS! 🐈",

    "THE CAT IS IMPRESSED.",

    "ABSOLUTELY DESTROYING IT!"

  ];

  message.textContent =
    "🐈 " +
    lines[
      Math.floor(
        Math.random() *
        lines.length
      )
    ];

}


/* =====================================================
   FINISH GAME
===================================================== */

async function finishGame(
  won
) {

  if(!game.running)
    return;

  game.running =
    false;

  clearInterval(
    game.timer
  );

  if(game.target)
    game.target.remove();

  const message =
    document.getElementById(
      "gameMessage"
    );

  if(won) {

    message.textContent =
      `🐈 ${playerName.toUpperCase()} WON! 🎉`;

    playWinSound();

  } else {

    message.textContent =
      `🐈 TIME'S UP! ${game.score} points!`;

  }

  await submitScore(
    game.score,
    games[
      currentGame
    ].time -
    game.time,
    won
  );

  const button =
    document.querySelector(
      ".exit-button"
    );

  if(button) {

    button.textContent =
      "🏆 VIEW LEADERBOARD";

    button.onclick =
      () =>
        showTab(
          "leaderboard"
        );

  }

}


/* =====================================================
   SCORE SUBMISSION
===================================================== */

async function submitScore(
  score,
  time,
  won
) {

  try {

    const response =
      await fetch(
        "/api/scores",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              name:
                playerName,

              game:
                currentGame,

              score,

              time,

              won

            })

        }
      );

    if(!response.ok)
      throw new Error(
        "Score submission failed"
      );

  } catch(error) {

    console.error(
      "Score failed:",
      error
    );

  }

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function renderLeaderboard() {

  arcadeView.innerHTML = `

    <h2>
      🏆 Cat.AI Global Leaderboard
    </h2>

    <p style="color:var(--muted)">
      Top three earn bonus dollars!
    </p>

    <div class="game-list">

      ${
        Object.entries(games)
          .map(
            ([id,g]) => `

              <div class="game-card">

                <div class="game-card-icon">
                  ${g.icon}
                </div>

                <h3>
                  ${g.name}
                </h3>

                <p>
                  🥇 1st: 1250 💰<br>
                  🥈 2nd: 500 💰<br>
                  🥉 3rd: 350 💰
                </p>

                <button
                  class="play-button"
                  onclick="loadScores('${id}')">

                  VIEW SCORES

                </button>

              </div>

            `
          )
          .join("")
      }

    </div>

  `;

}


async function loadScores(id) {

  arcadeView.innerHTML = `

    <h2>
      ${games[id].icon}
      ${games[id].name}
    </h2>

    <p style="color:var(--muted)">
      Loading scores...
    </p>

  `;

  try {

    const response =
      await fetch(
        "/api/leaderboard?game=" +
        encodeURIComponent(id)
      );

    if(!response.ok)
      throw new Error();

    const data =
      await response.json();

    const rows =
      data.scores || [];

    /*
      Give leaderboard rewards
      ONLY when viewing/submitting
      the actual leaderboard result.
    */

    arcadeView.innerHTML = `

      <button
        class="arcade-tab"
        onclick="renderLeaderboard()">

        ← All Games

      </button>

      <h2>
        🏆 ${games[id].name}
      </h2>

      <table class="leaderboard-table">

        <thead>

          <tr>
            <th>#</th>
            <th>PLAYER</th>
            <th>SCORE</th>
            <th>TIME</th>
            <th>REWARD</th>
          </tr>

        </thead>

        <tbody>

          ${
            rows.length

              ? rows.map(
                  (row,i) => {

                    let reward =
                      i === 0
                        ? 1250
                        : i === 1
                          ? 500
                          : i === 2
                            ? 350
                            : 0;

                    return `

                      <tr>

                        <td>
                          ${
                            i === 0
                              ? "🥇"
                              : i === 1
                                ? "🥈"
                                : i === 2
                                  ? "🥉"
                                  : i + 1
                          }
                        </td>

                        <td>
                          ${escapeHTML(
                            row.name
                          )}
                        </td>

                        <td>
                          ${row.score}
                        </td>

                        <td>
                          ${row.time}s
                        </td>

                        <td>
                          ${
                            reward
                              ? "+" +
                                reward +
                                " 💰"
                              : "—"
                          }
                        </td>

                      </tr>

                    `;

                  }
                ).join("")

              :

              `
                <tr>
                  <td colspan="5">
                    No scores yet!
                    Be the first cat!
                  </td>
                </tr>
              `
          }

        </tbody>

      </table>

    `;

  } catch {

    arcadeView.innerHTML = `

      <h2>
        🏆 Leaderboard
      </h2>

      <p>
        Mrrp! I can't reach the leaderboard server.
      </p>

      <button
        class="arcade-tab"
        onclick="renderLeaderboard()">

        TRY AGAIN

      </button>

    `;

  }

}


/* =====================================================
   GAME CONTROL
===================================================== */

function stopGame() {

  game.running =
    false;

  clearInterval(
    game.timer
  );

  game.timer =
    null;

  if(game.target) {

    game.target.remove();

    game.target =
      null;

  }

}


function exitGame() {

  stopGame();

  renderGames();

}


/* =====================================================
   SOUND
===================================================== */

function playMeow() {

  const AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC)
    return;

  const audio =
    new AC();

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.frequency.value =
    700;

  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .15,
    audio.currentTime + .02
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + .2
  );

  osc.connect(gain);

  gain.connect(
    audio.destination
  );

  osc.start();

  osc.stop(
    audio.currentTime + .2
  );

}


function playWinSound() {

  const AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC)
    return;

  const audio =
    new AC();

  [
    523,
    659,
    784,
    1046
  ].forEach(
    (freq,i) => {

      const osc =
        audio.createOscillator();

      const gain =
        audio.createGain();

      const start =
        audio.currentTime +
        i * .12;

      osc.frequency.value =
        freq;

      gain.gain.setValueAtTime(
        .001,
        start
      );

      gain.gain.exponentialRampToValueAtTime(
        .18,
        start + .02
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        start + .18
      );

      osc.connect(gain);

      gain.connect(
        audio.destination
      );

      osc.start(start);

      osc.stop(
        start + .18
      );

    }
  );

}


/* =====================================================
   SECRET CAT
===================================================== */

function secretCat() {

  const bubble =
    document.getElementById(
      "secretBubble"
    );

  bubble.classList.add(
    "show"
  );

  playMeow();

  setTimeout(
    () => {

      bubble.classList.remove(
        "show"
      );

    },
    1800
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(value);

  return div.innerHTML;

}
