<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat.AI 🐈</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat {
      width: min(700px, 90%);
      height: 80vh;
      background: #222;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 20px;
      background: #333;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 80%;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #444;
    }

    .cat {
      background: #333;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #333;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="chat">

    <header>
      🐈 CAT.AI
    </header>

    <div id="messages">
      <div class="message cat">
        Cat.AI: MEOW! Welcome to my website! 🐈
      </div>
    </div>

    <div class="input-area">
      <input
        id="input"
        type="text"
        placeholder="Talk to Cat.AI..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage("You: " + text, "user");

      input.value = "";

      addMessage("Cat.AI is thinking... 🧠🐈", "cat");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        messages.lastElementChild.textContent =
          "Cat.AI: " + data.reply;

      } catch (error) {
        messages.lastElementChild.textContent =
          "Cat.AI: MRRRP! I can't reach my brain!";
      }

      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
