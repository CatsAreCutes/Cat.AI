<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat.AI 🐈</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --text:#f8f3ff;
  --muted:#aaa0bd;
  --panel:rgba(25,18,42,.88);
  --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.14);
  --accent:#9b62ff;
  --accent2:#5d7cff;
  --user1:#7550c9;
  --user2:#536dd5;
}

body {
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:#080611;
  transition:.4s;
}

button,
input {
  font:inherit;
}

button {
  cursor:pointer;
}

/* =====================================================
   THEMES
===================================================== */

body.theme-og {
  --text:#eee;
  --muted:#999;
  --panel:#191919;
  --panel2:#252525;
  --border:#3a3a3a;
  --accent:#888;
  --accent2:#555;
  --user1:#444;
  --user2:#303030;
  background:#111;
}

body.theme-purple {
  --text:#f8f3ff;
  --muted:#aaa0bd;
  --panel:rgba(25,18,42,.88);
  --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.14);
  --accent:#9b62ff;
  --accent2:#5d7cff;
  --user1:#7550c9;
  --user2:#536dd5;

  background:
    radial-gradient(circle at 10% 20%,rgba(155,98,255,.3),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(70,110,255,.25),transparent 30%),
    #080611;
}

body.theme-yarn {
  --text:#fff8f2;
  --muted:#d8c2b2;
  --panel:rgba(76,45,35,.9);
  --panel2:rgba(255,230,210,.1);
  --border:rgba(255,225,205,.22);
  --accent:#ff9b68;
  --accent2:#e76f9b;
  --user1:#c96572;
  --user2:#a85282;

  background-color:#704536;

  background-image:
    repeating-linear-gradient(
      25deg,
      rgba(255,255,255,.13) 0 2px,
      transparent 2px 7px
    ),
    repeating-linear-gradient(
      -25deg,
      rgba(0,0,0,.13) 0 2px,
      transparent 2px 7px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 5px
    );
}

body.theme-yarn::after {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.1) 0 1px,
      transparent 2px
    );

  background-size:13px 13px;
  opacity:.35;
}

body.theme-pillow {
  --text:#44364c;
  --muted:#786b7e;
  --panel:rgba(255,255,255,.88);
  --panel2:rgba(255,255,255,.62);
  --border:rgba(80,50,100,.16);
  --accent:#a879d4;
  --accent2:#7d9ee6;
  --user1:#a96fce;
  --user2:#718fd8;

  background:#cfc3d3;
}

/* =====================================================
   REAL PILLOW WALL
===================================================== */

.pillow-wall {
  display:none;

  position:fixed;
  inset:-40px;

  z-index:-5;

  overflow:hidden;

  padding:25px;

  transform:rotate(-1deg) scale(1.04);

  pointer-events:none;

  grid-template-columns:
    repeat(6,minmax(130px,1fr));

  grid-auto-rows:105px;

  gap:8px;

  background:
    linear-gradient(
      180deg,
      #b9adbe,
      #d8cbd9
    );
}

body.theme-pillow .pillow-wall {
  display:grid;
}

.pillow {
  position:relative;

  min-width:130px;
  min-height:105px;

  border-radius:28px;

  background:
    radial-gradient(
      ellipse at 30% 20%,
      rgba(255,255,255,.9),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 70% 80%,
      rgba(90,60,100,.18),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #f9e9f4,
      #d9bfd4
    );

  border:4px solid
    rgba(170,130,170,.35);

  box-shadow:
    inset 8px 8px 14px
      rgba(255,255,255,.65),
    inset -9px -10px 16px
      rgba(90,60,100,.16),
    0 12px 16px
      rgba(65,45,75,.28);

  transform:rotate(var(--rotation));
}

.pillow::before {
  content:"";

  position:absolute;

  inset:9px;

  border-radius:21px;

  border:2px dashed
    rgba(125,90,130,.28);
}

.pillow:nth-child(3n) {
  background:
    linear-gradient(
      145deg,
      #e9d9ff,
      #c8b5e0
    );
}

.pillow:nth-child(4n) {
  background:
    linear-gradient(
      145deg,
      #dcecff,
      #b9cbe7
    );
}

.pillow:nth-child(5n) {
  background:
    linear-gradient(
      145deg,
      #ffe2ee,
      #ddbaca
    );
}

/* =====================================================
   APP
===================================================== */

.app {
  width:100vw;
  height:100vh;

  display:flex;

  position:relative;

  z-index:2;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  width:270px;

  padding:18px;

  background:var(--panel);

  border-right:
    1px solid var(--border);

  backdrop-filter:blur(20px);

  display:flex;
  flex-direction:column;

  gap:14px;

  z-index:5;
}

.logo {
  display:flex;

  align-items:center;

  gap:12px;

  font-size:21px;

  font-weight:bold;
}

.logo-cat,
.avatar {
  display:grid;

  place-items:center;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.logo-cat {
  width:44px;
  height:44px;

  border-radius:15px;

  font-size:26px;
}

.new-chat,
.arcade-button {
  border:0;

  border-radius:14px;

  padding:13px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight:bold;
}

.arcade-button {
  background:
    linear-gradient(
      135deg,
      #ff8a3d,
      #e74d91
    );
}

.history-title {
  color:var(--muted);

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;
}

.history {
  flex:1;

  overflow-y:auto;
}

.history-item {
  padding:11px;

  margin-bottom:7px;

  border-radius:12px;

  cursor:pointer;

  color:var(--muted);

  font-size:13px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.history-item:hover {
  background:var(--panel2);

  color:var(--text);
}

.sidebar-buttons {
  display:flex;

  gap:8px;
}

.small-button {
  flex:1;

  padding:10px 5px;

  border:
    1px solid var(--border);

  border-radius:12px;

  color:var(--text);

  background:var(--panel2);
}

/* =====================================================
   THEME MENU
===================================================== */

.theme-menu {
  position:absolute;

  left:18px;
  bottom:70px;

  width:234px;

  padding:12px;

  background:var(--panel);

  border:
    1px solid var(--border);

  border-radius:16px;

  backdrop-filter:blur(20px);

  display:none;

  z-index:20;
}

.theme-menu.open {
  display:block;
}

.theme-menu h3 {
  margin:4px 5px 10px;

  font-size:13px;
}

.theme-option {
  width:100%;

  border:0;

  padding:11px;

  margin:4px 0;

  border-radius:11px;

  text-align:left;

  color:var(--text);

  background:var(--panel2);
}

.theme-option:hover {
  filter:brightness(1.15);
}

/* =====================================================
   MAIN CHAT
===================================================== */

.main {
  flex:1;

  min-width:0;

  display:flex;

  flex-direction:column;
}

header {
  height:76px;

  padding:14px 22px;

  display:flex;

  align-items:center;

  gap:14px;

  border-bottom:
    1px solid var(--border);

  background:var(--panel);

  backdrop-filter:blur(20px);
}

.avatar {
  width:48px;
  height:48px;

  border-radius:15px;

  font-size:28px;
}

.header-text h1 {
  margin:0;

  font-size:19px;
}

.header-text span {
  color:#55dc8a;

  font-size:10px;

  font-weight:bold;
}

.shoe-meter {
  margin-left:auto;

  padding:8px 12px;

  border-radius:999px;

  border:
    1px solid rgba(255,180,100,.25);

  background:
    rgba(255,160,70,.08);

  color:#d99049;

  font-size:11px;
}

#messages {
  flex:1;

  overflow-y:auto;

  padding:28px;
}

.message {
  max-width:78%;

  margin:13px 0;

  padding:14px 17px;

  border-radius:20px;

  line-height:1.5;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.user {
  margin-left:auto;

  background:
    linear-gradient(
      135deg,
      var(--user1),
      var(--user2)
    );

  color:white;

  border-bottom-right-radius:6px;
}

.cat {
  background:var(--panel2);

  border:
    1px solid var(--border);

  border-bottom-left-radius:6px;
}

.cat-label {
  font-weight:bold;

  margin-bottom:6px;
}

.bottom {
  padding:15px 22px 20px;

  border-top:
    1px solid var(--border);

  background:var(--panel);

  backdrop-filter:blur(20px);
}

.input-row {
  display:flex;

  gap:10px;
}

#input {
  flex:1;

  min-width:0;

  padding:15px 17px;

  border-radius:15px;

  border:
    1px solid var(--border);

  outline:none;

  color:var(--text);

  background:var(--panel2);
}

#input::placeholder {
  color:var(--muted);
}

.send {
  width:90px;

  border:0;

  border-radius:15px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight:bold;
}

.hint {
  text-align:center;

  color:var(--muted);

  font-size:10px;

  margin-top:8px;
}

/* =====================================================
   ARCADE
===================================================== */

.arcade {
  display:none;

  position:absolute;

  inset:0;

  z-index:30;

  background:
    rgba(5,3,12,.84);

  backdrop-filter:blur(15px);

  align-items:center;

  justify-content:center;

  padding:20px;
}

.arcade.open {
  display:flex;
}

.arcade-card {
  width:min(950px,100%);

  height:min(720px,92vh);

  display:flex;

  flex-direction:column;

  overflow:hidden;

  border-radius:25px;

  border:
    1px solid var(--border);

  background:var(--panel);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5);
}

.arcade-header {
  display:flex;

  align-items:center;

  padding:18px 22px;

  gap:12px;

  border-bottom:
    1px solid var(--border);
}

.arcade-header h2 {
  margin:0;
}

.close-game {
  margin-left:auto;

  width:38px;
  height:38px;

  border:0;

  border-radius:12px;

  color:var(--text);

  background:var(--panel2);
}

.arcade-tabs {
  display:flex;

  gap:8px;

  padding:12px 18px;

  border-bottom:
    1px solid var(--border);

  overflow-x:auto;
}

.arcade-tab {
  padding:9px 14px;

  border:
    1px solid var(--border);

  border-radius:12px;

  color:var(--text);

  background:var(--panel2);

  white-space:nowrap;
}

.arcade-tab.active {
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color:white;
}

.arcade-view {
  flex:1;

  overflow:auto;

  padding:20px;
}

.game-list {
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

  gap:14px;
}

.game-card {
  padding:18px;

  border:
    1px solid var(--border);

  border-radius:18px;

  background:var(--panel2);
}

.game-card:hover {
  transform:translateY(-2px);

  transition:.15s;
}

.game-card-icon {
  font-size:38px;
}

.game-card h3 {
  margin:10px 0 5px;
}

.game-card p {
  margin:0 0 15px;

  color:var(--muted);

  font-size:13px;
}

.play-button {
  width:100%;

  padding:11px;

  border:0;

  border-radius:12px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

/* =====================================================
   LEADERBOARD
===================================================== */

.leaderboard-controls {
  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:18px;
}

.leaderboard-game {
  padding:9px 12px;

  border:
    1px solid var(--border);

  border-radius:11px;

  color:var(--text);

  background:var(--panel2);
}

.leaderboard-game.active {
  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.leaderboard-table {
  width:100%;

  border-collapse:collapse;
}

.leaderboard-table th,
.leaderboard-table td {
  padding:12px 9px;

  border-bottom:
    1px solid var(--border);

  text-align:left;
}

.leaderboard-table th {
  color:var(--muted);

  font-size:11px;
}

.leaderboard-table tr.current-player {
  background:
    rgba(155,98,255,.12);
}

.player-name-box {
  max-width:500px;

  margin:auto;

  padding:30px;

  text-align:center;

  border:
    1px solid var(--border);

  border-radius:20px;

  background:var(--panel2);
}

.player-name-box input {
  width:100%;

  padding:13px;

  margin:15px 0;

  border-radius:12px;

  border:
    1px solid var(--border);

  background:var(--panel);

  color:var(--text);
}

.game-screen {
  height:100%;

  display:flex;

  flex-direction:column;
}

.game-stats {
  display:flex;

  justify-content:center;

  gap:30px;

  padding:12px;

  font-weight:bold;
}

.game-stats span {
  color:var(--accent);
}

.game-board {
  flex:1;

  position:relative;

  overflow:hidden;

  margin:12px;

  min-height:280px;

  border-radius:20px;

  border:
    2px solid var(--border);

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(155,98,255,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(93,124,255,.18),
      transparent 30%
    ),
    var(--panel2);
}

.target {
  position:absolute;

  border:0;

  background:transparent;

  font-size:42px;

  cursor:pointer;

  user-select:none;

  transition:transform .08s;
}

.target:hover {
  transform:scale(1.2);
}

.game-message {
  min-height:55px;

  margin:0 20px 12px;

  padding:13px;

  border-radius:15px;

  background:var(--panel2);

  border:
    1px solid var(--border);

  text-align:center;
}

.start-game {
  align-self:center;

  margin:0 0 18px;

  padding:13px 25px;

  border:0;

  border-radius:14px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #ff8a3d,
      #e74d91
    );

  font-weight:bold;
}

/* =====================================================
   NAME PROMPT
===================================================== */

.name-overlay {
  position:absolute;

  inset:0;

  z-index:50;

  display:none;

  align-items:center;

  justify-content:center;

  background:
    rgba(0,0,0,.6);

  backdrop-filter:blur(10px);

  padding:20px;
}

.name-overlay.open {
  display:flex;
}

.name-box {
  width:min(450px,100%);

  padding:28px;

  border-radius:22px;

  background:var(--panel);

  border:
    1px solid var(--border);

  text-align:center;
}

.name-box input {
  width:100%;

  padding:14px;

  margin:14px 0;

  border-radius:12px;

  border:
    1px solid var(--border);

  background:var(--panel2);

  color:var(--text);
}

.name-box button {
  padding:12px 20px;

  border:0;

  border-radius:12px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

/* =====================================================
   SECRET CAT
===================================================== */

.secret-cat {
  position:fixed;

  right:18px;

  bottom:18px;

  width:45px;

  height:45px;

  border:
    1px solid var(--border);

  border-radius:50%;

  background:var(--panel);

  backdrop-filter:blur(12px);

  font-size:25px;

  opacity:.3;

  transition:.2s;

  z-index:999;
}

.secret-cat:hover {
  opacity:1;

  transform:
    scale(1.15)
    rotate(-6deg);
}

.secret-cat.meowing {
  animation:
    catMeow .5s ease;
}

@keyframes catMeow {

  0% {
    transform:scale(1);
  }

  30% {
    transform:
      scale(1.35)
      rotate(-8deg);
  }

  60% {
    transform:
      scale(.9)
      rotate(8deg);
  }

  100% {
    transform:scale(1);
  }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

  .sidebar {
    display:none;
  }

  .shoe-meter {
    display:none;
  }

  #messages {
    padding:16px;
  }

  .message {
    max-width:90%;
  }

  .secret-cat {
    bottom:80px;
  }

  .arcade-card {
    height:92vh;
  }

  .game-board {
    min-height:230px;
  }

}
</style>
</head>

<body class="theme-purple">

<!-- =====================================================
     PILLOW WALL
===================================================== -->

<div class="pillow-wall">

  <div class="pillow" style="--rotation:-2deg"></div>
  <div class="pillow" style="--rotation:2deg"></div>
  <div class="pillow" style="--rotation:-1deg"></div>
  <div class="pillow" style="--rotation:3deg"></div>
  <div class="pillow" style="--rotation:-3deg"></div>
  <div class="pillow" style="--rotation:1deg"></div>

  <div class="pillow" style="--rotation:-2deg"></div>
  <div class="pillow" style="--rotation:2deg"></div>
  <div class="pillow" style="--rotation:-1deg"></div>
  <div class="pillow" style="--rotation:3deg"></div>
  <div class="pillow" style="--rotation:-2deg"></div>
  <div class="pillow" style="--rotation:1deg"></div>

  <div class="pillow" style="--rotation:-3deg"></div>
  <div class="pillow" style="--rotation:2deg"></div>
  <div class="pillow" style="--rotation:-1deg"></div>
  <div class="pillow" style="--rotation:3deg"></div>
  <div class="pillow" style="--rotation:-2deg"></div>
  <div class="pillow" style="--rotation:1deg"></div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div class="app">

  <aside class="sidebar">

    <div class="logo">

      <div class="logo-cat">
        🐈
      </div>

      Cat.AI

    </div>


    <button
      class="new-chat"
      onclick="newChat()">

      🐾 New Chat

    </button>


    <button
      class="arcade-button"
      onclick="openArcade()">

      🎮 Cat Arcade

    </button>


    <div class="history-title">
      CHAT HISTORY
    </div>


    <div
      id="history"
      class="history">
    </div>


    <div class="sidebar-buttons">

      <button
        class="small-button"
        onclick="toggleThemeMenu()">

        🎨 Themes

      </button>


      <button
        class="small-button"
        onclick="clearHistory()">

        🗑️ Clear

      </button>

    </div>


    <div
      id="themeMenu"
      class="theme-menu">

      <h3>
        🎨 Cat.AI Themes
      </h3>


      <button
        class="theme-option"
        onclick="setTheme('og')">

        🩶 OG

      </button>


      <button
        class="theme-option"
        onclick="setTheme('purple')">

        💜 Purple Shade

      </button>


      <button
        class="theme-option"
        onclick="setTheme('yarn')">

        🧶 Yarn Texture

      </button>


      <button
        class="theme-option"
        onclick="setTheme('pillow')">

        🛏️ Pillow Wall

      </button>

    </div>

  </aside>


  <!-- ===================================================
       CHAT
  ==================================================== -->

  <main class="main">

    <header>

      <div class="avatar">
        🐈
      </div>


      <div class="header-text">

        <h1>
          Cat.AI
        </h1>

        <span>
          ● BRAIN ONLINE
        </span>

      </div>


      <div class="shoe-meter">
        👟 SHOES: SUSPICIOUS
      </div>

    </header>


    <div id="messages"></div>


    <div class="bottom">

      <div class="input-row">

        <input
          id="input"
          placeholder="Talk to Cat.AI..."
          autocomplete="off"
        >


        <button
          class="send"
          onclick="sendMessage()">

          MEOW

        </button>

      </div>


      <div class="hint">

<script>

/* =====================================================
   STATE
===================================================== */

let currentChat = {
  id:Date.now(),
  title:"New Chat",
  messages:[]
};

let playerName =
  localStorage.getItem(
    "catAIPlayerName"
  ) || "";

let selectedGame = "mouse";

let gameState = {
  running:false,
  score:0,
  time:60,
  startedAt:0,
  timer:null,
  target:null,
  goal:20,
  type:"mouse"
};


/* =====================================================
   ELEMENTS
===================================================== */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const historyBox =
  document.getElementById("history");

const arcade =
  document.getElementById("arcade");

const arcadeView =
  document.getElementById("arcadeView");

const nameOverlay =
  document.getElementById("nameOverlay");

const playerNameInput =
  document.getElementById("playerName");


/* =====================================================
   CHAT
===================================================== */

function addMessage(
  text,
  type,
  save = true
) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;


  if(type === "cat") {

    const label =
      document.createElement("div");

    label.className =
      "cat-label";

    label.textContent =
      "🐈 Cat.AI";

    div.appendChild(label);


    div.appendChild(
      document.createTextNode(text)
    );

  } else {

    div.textContent =
      text;

  }


  messages.appendChild(div);


  messages.scrollTop =
    messages.scrollHeight;


  if(save) {

    currentChat.messages.push({
      text,
      type
    });


    if(
      type === "user" &&
      currentChat.title === "New Chat"
    ) {

      currentChat.title =
        text.slice(0,30) +
        (
          text.length > 30
            ? "..."
            : ""
        );

    }


    saveChat();

  }

}


function showWelcome() {

  addMessage(
    "MEOW! New chat detected! What are we talking about?",
    "cat"
  );

}


async function sendMessage() {

  const text =
    input.value.trim();

  if(!text)
    return;


  addMessage(
    text,
    "user"
  );


  input.value = "";


  const thinking =
    document.createElement("div");

  thinking.className =
    "message cat";


  thinking.innerHTML = `
    <div class="cat-label">
      🐈 Cat.AI
    </div>
    Cat.AI is thinking... 🧠
  `;


  messages.appendChild(
    thinking
  );


  messages.scrollTop =
    messages.scrollHeight;


  try {

    const response =
      await fetch(
        "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text
          })
        }
      );


    const data =
      await response.json();


    const reply =
      data.reply ||
      "MRRP! My brain exploded! 🐈";


    thinking.innerHTML = `
      <div class="cat-label">
        🐈 Cat.AI
      </div>
    `;


    thinking.appendChild(
      document.createTextNode(reply)
    );


    currentChat.messages.push({
      text:reply,
      type:"cat"
    });


    saveChat();


  } catch(error) {

    thinking.innerHTML = `
      <div class="cat-label">
        🐈 Cat.AI
      </div>
      MRRP! I can't reach my brain! 🧠💥
    `;

  }

}


input.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter") {

      sendMessage();

    }

  }
);


/* =====================================================
   CHAT HISTORY
===================================================== */

function saveChat() {

  if(!currentChat.messages.length)
    return;


  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );


  const index =
    chats.findIndex(
      chat =>
        chat.id === currentChat.id
    );


  if(index >= 0)
    chats[index] =
      currentChat;

  else
    chats.unshift(
      currentChat
    );


  localStorage.setItem(
    "catAIChats",
    JSON.stringify(
      chats.slice(0,30)
    )
  );


  loadHistory();

}


function loadHistory() {

  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );


  historyBox.innerHTML = "";


  chats.forEach(chat => {

    const item =
      document.createElement("div");


    item.className =
      "history-item";


    item.textContent =
      "🐾 " +
      (
        chat.title ||
        "Untitled Chat"
      );


    item.onclick =
      () =>
        loadChat(chat.id);


    historyBox.appendChild(
      item
    );

  });

}


function loadChat(id) {

  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );


  const chat =
    chats.find(
      c => c.id === id
    );


  if(!chat)
    return;


  currentChat =
    chat;


  messages.innerHTML =
    "";


  currentChat.messages.forEach(
    message => {

      addMessage(
        message.text,
        message.type,
        false
      );

    }
  );

}


function newChat() {

  saveChat();


  currentChat = {
    id:Date.now(),
    title:"New Chat",
    messages:[]
  };


  messages.innerHTML =
    "";


  showWelcome();

}


function clearHistory() {

  if(
    !confirm(
      "Delete all saved Cat.AI chats?"
    )
  )
    return;


  localStorage.removeItem(
    "catAIChats"
  );


  loadHistory();

}


/* =====================================================
   THEMES
===================================================== */

function toggleThemeMenu() {

  document
    .getElementById("themeMenu")
    .classList.toggle(
      "open"
    );

}


function setTheme(theme) {

  document.body.classList.remove(
    "theme-og",
    "theme-purple",
    "theme-yarn",
    "theme-pillow"
  );


  document.body.classList.add(
    "theme-" + theme
  );


  localStorage.setItem(
    "catAITheme",
    theme
  );

}


const savedTheme =
  localStorage.getItem(
    "catAITheme"
  );


if(savedTheme)
  setTheme(savedTheme);


/* =====================================================
   PLAYER NAME
===================================================== */

function ensurePlayerName(
  callback
) {

  if(playerName) {

    callback();

    return;

  }


  nameOverlay.classList.add(
    "open"
  );


  playerNameInput.focus();


  window.pendingGame =
    callback;

}


function savePlayerName() {

  const name =
    playerNameInput.value
      .trim();


  if(!name)
    return;


  playerName =
    name
      .replace(
        /[^a-zA-Z0-9 _-]/g,
        ""
      )
      .slice(0,20);


  if(!playerName)
    return;


  localStorage.setItem(
    "catAIPlayerName",
    playerName
  );


  nameOverlay.classList.remove(
    "open"
  );


  if(window.pendingGame) {

    const callback =
      window.pendingGame;

    window.pendingGame =
      null;

    callback();

  }

}


playerNameInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter")
      savePlayerName();

  }
);


/* =====================================================
   ARCADE
===================================================== */

function openArcade() {

  arcade.classList.add(
    "open"
  );

  showArcadeTab(
    "games"
  );

}


function closeArcade() {

  stopGame();

  arcade.classList.remove(
    "open"
  );

}


function showArcadeTab(tab) {

  document
    .getElementById("gamesTab")
    .classList.toggle(
      "active",
      tab === "games"
    );


  document
    .getElementById("leaderboardTab")
    .classList.toggle(
      "active",
      tab === "leaderboard"
    );


  if(tab === "games") {

    renderGameList();

  } else {

    loadLeaderboard();

  }

}


/* =====================================================
   GAME LIST
===================================================== */

function renderGameList() {

  arcadeView.innerHTML = `

    <div class="game-list">

      <div class="game-card">

        <div class="game-card-icon">
          🐭
        </div>

        <h3>
          Catch the Mouse!
        </h3>

        <p>
          Catch 20 mice in 1 minute.
        </p>

        <button
          class="play-button"
          onclick="startGame('mouse')">

          PLAY

        </button>

      </div>


      <div class="game-card">

        <div class="game-card-icon">
          🧶
        </div>

        <h3>
          Yarn Frenzy
        </h3>

        <p>
          Catch as much yarn as possible.
        </p>

        <button
          class="play-button"
          onclick="startGame('yarn')">

          PLAY

        </button>

      </div>


      <div class="game-card">

        <div class="game-card-icon">
          🐟
        </div>

        <h3>
          Fish Frenzy
        </h3>

        <p>
          Catch as many fish as possible.
        </p>

        <button
          class="play-button"
          onclick="startGame('fish')">

          PLAY

        </button>

      </div>


      <div class="game-card">

        <div class="game-card-icon">
          👟
        </div>

        <h3>
          Shoe Destroyer
        </h3>

        <p>
          Destroy suspicious footwear.
        </p>

        <button
          class="play-button"
          onclick="startGame('shoe')">

          PLAY

        </button>

      </div>


      <div class="game-card">

        <div class="game-card-icon">
          🪶
        </div>

        <h3>
          Feather Chase
        </h3>

        <p>
          Chase the feather before it escapes.
        </p>

        <button
          class="play-button"
          onclick="startGame('feather')">

          PLAY

        </button>

      </div>


      <div class="game-card">

        <div class="game-card-icon">
          📦
        </div>

        <h3>
          Box Attack
        </h3>

        <p>
          Find toys hidden inside boxes.
        </p>

        <button

        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   START GAME
===================================================== */

function startGame(type) {

  ensurePlayerName(
    () => {

      selectedGame =
        type;


      if(type === "mouse") {

        startMouseGame();

      } else {

        startGenericGame(
          type
        );

      }

    }
  );

}


/* =====================================================
   MOUSE GAME
===================================================== */

function startMouseGame() {

  gameState = {

    running:true,

    score:0,

    time:60,

    startedAt:
      performance.now(),

    timer:null,

    target:null,

    goal:20,

    type:"mouse"

  };


  renderGameScreen(
    "🐭 Catch the Mouse!",
    "Catch 20 mice in 1 minute!"
  );


  spawnTarget("🐭");


  gameState.timer =
    setInterval(
      () => {

        if(!gameState.running)
          return;


        gameState.time--;


        updateGameStats();


        if(
          gameState.time <= 0
        ) {

          finishGame(
            false
          );

        }

      },
      1000
    );

}


/* =====================================================
   GENERIC GAMES
===================================================== */

function startGenericGame(
  type
) {

  const configs = {

    yarn:{
      icon:"🧶",
      title:"Yarn Frenzy",
      description:
        "Catch as much yarn as possible!",
      time:30,
      goal:50
    },

    fish:{
      icon:"🐟",
      title:"Fish Frenzy",
      description:
        "Catch as many fish as possible!",
      time:30,
      goal:30
    },

    shoe:{
      icon:"👟",
      title:"Shoe Destroyer",
      description:
        "DESTROY THE SUSPICIOUS FOOTWEAR!",
      time:30,
      goal:50
    },

    feather:{
      icon:"🪶",
      title:"Feather Chase",
      description:
        "Catch the feather!",
      time:30,
      goal:25
    },

    box:{
      icon:"📦",
      title:"Box Attack",
      description:
        "Find the toys!",
      time:30,
      goal:20
    }

  };


  const config =
    configs[type];


  gameState = {

    running:true,

    score:0,

    time:config.time,

    startedAt:
      performance.now(),

    timer:null,

    target:null,

    goal:config.goal,

    type

  };


  renderGameScreen(
    `${config.icon} ${config.title}`,
    config.description
  );


  spawnTarget(
    config.icon
  );


  gameState.timer =
    setInterval(
      () => {

        if(!gameState.running)
          return;


        gameState.time--;


        updateGameStats();


        if(
          gameState.time <= 0
        ) {

          finishGame(
            false
          );

        }

      },
      1000
    );

}


/* =====================================================
   GAME SCREEN
===================================================== */

function renderGameScreen(
  title,
  description
) {

  arcadeView.innerHTML = `

    <div class="game-screen">

      <div
        style="
          text-align:center;
          margin-bottom:5px;
        ">

        <h2>
          ${title}
        </h2>

        <div
          style="
            color:var(--muted);
            font-size:13px;
          ">

          ${description}

        </div>

      </div>


      <div class="game-stats">

        <div>

          Score:

          <span id="gameScore">
            0
          </span>

        </div>


        <div>

          Time:

          <span id="gameTime">
            ${gameState.time}
          </span>

          s

        </div>

      </div>


      <div
        id="gameBoard"
        class="game-board">
      </div>


      <div
        id="gameMessage"
        class="game-message">

        🐈 Cat.AI:
        ${gameStartMessage()}

      </div>


      <button
        class="start-game"
        onclick="
          stopGame();
          renderGameList();
        ">

        ← EXIT GAME

      </button>

    </div>

  `;

}


function gameStartMessage() {

  if(
    selectedGame === "shoe"
  ) {

    return `
      HISS! DESTROY THE FOOTWEAR!
    `;

  }


  return `
    GO ${playerName.toUpperCase()}! GET IT!
  `;

}


/* =====================================================
   TARGET
===================================================== */

function spawnTarget(icon) {

  if(!gameState.running)
    return;


  const board =
    document.getElementById(
      "gameBoard"
    );


  if(!board)
    return;


  if(gameState.target) {

    gameState.target.remove();

  }


  const target =
    document.createElement(
      "button"
    );


  target.className =
    "target";


  target.textContent =
    icon;


  const maxX =
    Math.max(
      0,
      board.clientWidth - 65
    );


  const maxY =
    Math.max(
      0,
      board.clientHeight - 65
    );


  target.style.left =
    Math.random() *
      maxX +
    "px";


  target.style.top =
    Math.random() *
      maxY +
    "px";


  target.onclick =
    hitTarget;


  board.appendChild(
    target
  );


  gameState.target =
    target;

}


function hitTarget() {

  if(!gameState.running)
    return;


  gameState.score++;


  updateGameStats();


  playMeow();


  const goal =
    gameState.goal;


  if(
    gameState.score >= goal
  ) {

    finishGame(
      true
    );

    return;

  }


  updateEncouragement();


  const icons = {

    yarn:"🧶",

    fish:"🐟",

    shoe:"👟",

    feather:"🪶",

    box:"📦",

    mouse:"🐭"

  };


  spawnTarget(
    icons[selectedGame]
  );

}


/* =====================================================
   GAME STATS
===================================================== */

function updateGameStats() {

  const score =
    document.getElementById(
      "gameScore"
    );


  const time =
    document.getElementById(
      "gameTime"
    );


  if(score) {

    score.textContent =
      gameState.score;

  }


  if(time) {

    time.textContent =
      gameState.time;

  }

}


/* =====================================================
   CAT.AI ENCOURAGEMENT
===================================================== */

async function updateEncouragement() {

  const milestones =
    selectedGame === "mouse"

      ? [
          1,
          5,
          10,
          15,
          18,
          19
        ]

      : [
          5,
          10,
          20,
          30,
          40
        ];


  if(
    !milestones.includes(
      gameState.score
    )
  )
    return;


  const message =
    document.getElementById(
      "gameMessage"
    );


  if(!message)
    return;


  message.textContent =
    "🐈 Cat.AI is thinking... 🧠";


  try {

    const response =
      await fetch(
        "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:
              `You are Cat.AI encouraging ${playerName} during a minigame. They have ${gameState.score} points and ${gameState.time} seconds left. Give ONE very short excited cat-like encouragement. Maximum 15 words. No question.`

          })

        }
      );


    const data =
      await response.json();


    message.textContent =
      "🐈 Cat.AI: " +
      (
        data.reply ||
        fallbackEncouragement()
      );


  } catch {

    message.textContent =
      "🐈 Cat.AI: " +
      fallbackEncouragement();

  }

}


function fallbackEncouragement() {

  if(
    selectedGame === "shoe"
  ) {

    return `
      HISS! DESTROY MORE SHOES!
    `;

  }


  if(
    gameState.score >= 18
  ) {

    return `
      MRRP! ALMOST THERE!
    `;

  }


  if(
    gameState.score >= 10
  ) {

    return `
      MEOW! KEEP GOING!
    `;

  }


  return `
    PURR! NICE CATCH!
  `;

}


/* =====================================================
   FINISH GAME
===================================================== */

async function finishGame(
  won
) {

  if(!gameState.running)
    return;


  gameState.running =
    false;


  clearInterval(
    gameState.timer
  );


  if(gameState.target) {

    gameState.target.remove();

    gameState.target =
      null;

  }


  const completionTime =
    Math.round(
      (
        performance.now() -
        gameState.startedAt
      ) / 1000
    );


  const message =
    document.getElementById(
      "gameMessage"
    );


  if(won) {

    message.textContent =
      `
      🐈 Cat.AI:
      MEOW!!! ${playerName.toUpperCase()} DID IT! 🎉
      `;


    playWinSound();

  } else {

    message.textContent =
      `
      🐈 Cat.AI:
      Time's up! ${gameState.score} points!
      `;

  }


  await submitScore(
    gameState.score,
    completionTime,
    won
  );


  const button =
    document.querySelector(
      ".start-game"
    );


  if(button) {

    button.textContent =
      "🏆 VIEW LEADERBOARD";


    button.onclick =
      () => {

        showArcadeTab(
          "leaderboard"
        );

      };

  }

}


/* =====================================================
   PERMANENT SCORE SUBMISSION
===================================================== */

async function submitScore(
  score,
  time,
  won
) {

  try {

    const response =
      await fetch(
        "/api/scores",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            name:playerName,

            game:selectedGame,

            score:score,

            time:time,

            won:won

          })

        }
      );


    if(!response.ok) {

      console.error(
        "Server rejected score."
      );

    }

  } catch(error) {

    console.error(
      "Score submission failed:",
      error
    );

  }

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard() {

  arcadeView.innerHTML = `

    <h2>
      🏆 Global Cat Leaderboard
    </h2>

    <p style="color:var(--muted)">
      Loading the world's cats...
    </p>

  `;


  try {

    const response =
      await fetch(
        `/api/leaderboard?game=${encodeURIComponent(
          selectedGame
        )}`
      );


    if(!response.ok)
      throw new Error(
        "Leaderboard request failed"
      );


    const data =
      await response.json();


    const rows =
      data.scores || [];


    const games = {

      mouse:"🐭 Mouse",

      yarn:"🧶 Yarn",

      fish:"🐟 Fish",

      shoe:"👟 Shoes",

      feather:"🪶 Feather",

      box:"📦 Box"

    };


    arcadeView.innerHTML = `

      <h2>
        🏆 Global Cat Leaderboard
      </h2>


      <div
        class="leaderboard-controls">

        ${
          Object.keys(games)
            .map(
              game => `

                <button
                  class="
                    leaderboard-game
                    ${
                      game === selectedGame
                        ? "active"
                        : ""
                    }
                  "
                  onclick="
                    selectedGame='${game}';
                    loadLeaderboard();
                  ">

                  ${games[game]}

                </button>

              `
            )
            .join("")
        }

      </div>


      <p style="color:var(--muted)">

        Global scores • Top 50 players

      </p>


      <table class="leaderboard-table">

        <thead>

          <tr>

            <th>
              #
            </th>

            <th>
              PLAYER
            </th>

            <th>
              SCORE
            </th>

            <th>
              TIME
            </th>

          </tr>

        </thead>


        <tbody>

          ${
            rows.length

              ? rows
                  .map(
                    (row,index) => {

                      const isMe =
                        row.name ===
                        playerName;

                      return `

                        <tr
                          class="
                            ${
                              isMe
                                ? "current-player"
                                : ""
                            }
                          ">

                          <td>

                            ${
                              index === 0
                                ? "👑"
                                : index + 1
                            }

                          </td>


                          <td>

                            ${
                              escapeHtml(
                                row.name
                              )
                            }

                            ${
                              isMe
                                ? " ⭐"
                                : ""
                            }

                          </td>


                          <td>

                            ${Number(
                              row.score
                            )}

                          </td>


                          <td>

                            ${Number(
                              row.time
                            )}s

                          </td>

                        </tr>

                      `;

                    }
                  )
                  .join("")

              : `

                <tr>

                  <td
                    colspan="4"
                    style="
                      text-align:center;
                      padding:30px;
                    ">

                    🐾 No scores yet!
                    Be the first cat!

                  </td>

                </tr>

              `
          }

        </tbody>

      </table>

    `;


  } catch(error) {

    console.error(
      error
    );


    arcadeView.innerHTML = `

      <h2>
        🏆 Global Cat Leaderboard
      </h2>


      <p>

        MRRP! I can't reach the
        leaderboard server! 🐈💥

      </p>


      <p
        style="
          color:var(--muted);
          font-size:12px;
        ">

        Make sure index.js is running.

      </p>

    `;

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   GAME CONTROL
===================================================== */

function stopGame() {

  gameState.running =
    false;


  clearInterval(
    gameState.timer
  );


  gameState.timer =
    null;


  if(gameState.target) {

    gameState.target.remove();

    gameState.target =
      null;

  }

}


/* =====================================================
   MEOW SOUND
===================================================== */

function playMeow() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if(!AudioContext)
    return;


  const audio =
    new AudioContext();


  const osc =
    audio.createOscillator();


  const gain =
    audio.createGain();


  osc.type =
    "sine";


  osc.frequency.setValueAtTime(
    650,
    audio.currentTime
  );


  osc.frequency.exponentialRampToValueAtTime(
    900,
    audio.currentTime + .08
  );


  osc.frequency.exponentialRampToValueAtTime(
    420,
    audio.currentTime + .22
  );


  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .18,
    audio.currentTime + .02
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + .22
  );


  osc.connect(gain);

  gain.connect(
    audio.destination
  );


  osc.start();

  osc.stop(
    audio.currentTime + .22
  );

}


/* =====================================================
   WIN SOUND
===================================================== */

function playWinSound() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if(!AudioContext)
    return;


  const audio =
    new AudioContext();


  [
    523,
    659,
    784
  ].forEach(
    (
      frequency,
      index
    ) => {

      const osc =
        audio.createOscillator();


      const gain =
        audio.createGain();


      const start =
        audio.currentTime +
        index * .12;


      osc.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        .001,
        start
      );


      gain.gain.exponentialRampToValueAtTime(
        .2,
        start + .02
      );


      gain.gain.exponentialRampToValueAtTime(
        .001,
        start + .18
      );


      osc.connect(gain);

      gain.connect(
        audio.destination
      );


      osc.start(start);

      osc.stop(
        start + .18
      );

    }
  );

}


/* =====================================================
   SECRET CAT
===================================================== */

function secretMeow() {

  const cat =
    document.querySelector(
      ".secret-cat"
    );


  cat.classList.remove(
    "meowing"
  );


  void cat.offsetWidth;


  cat.classList.add(
    "meowing"
  );


  playMeow();


  const bubble =
    document.createElement(
      "div"
    );


  bubble.textContent =
    "MEOW! 🐈";


  bubble.style.cssText = `

    position:fixed;

    right:70px;

    bottom:70px;

    padding:10px 15px;

    border-radius:15px;

    background:var(--panel);

    color:var(--text);

    border:1px solid var(--border);

    z-index:1000;

    font-weight:bold;

  `;


  document.body.appendChild(
    bubble
  );


  setTimeout(
    () => bubble.remove(),
    1200
  );

}
