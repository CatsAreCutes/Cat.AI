<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat.AI 🐈</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --text:#f8f3ff;
  --muted:#aaa0bd;
  --panel:rgba(25,18,42,.9);
  --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.14);
  --accent:#9b62ff;
  --accent2:#5d7cff;
  --user1:#7550c9;
  --user2:#536dd5;
}

body {
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 20%,rgba(155,98,255,.3),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(70,110,255,.25),transparent 30%),
    #080611;
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
}

.app {
  width:100vw;
  height:100vh;
  display:flex;
}

.sidebar {
  width:260px;
  padding:18px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:14px;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:bold;
}

.logo-cat {
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:26px;
}

.sidebar button {
  border:0;
  border-radius:13px;
  padding:12px;
  color:white;
  font-weight:bold;
}

.new-chat {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.arcade-button {
  background:linear-gradient(135deg,#ff8a3d,#e74d91);
}

.history-title {
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
  font-weight:bold;
}

.history {
  flex:1;
  overflow:auto;
}

.history-item {
  padding:10px;
  margin-bottom:6px;
  border-radius:10px;
  color:var(--muted);
  cursor:pointer;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.history-item:hover {
  background:var(--panel2);
  color:var(--text);
}

.history-item.active {
  background:rgba(155,98,255,.2);
  color:var(--text);
}

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

header {
  height:76px;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}

.avatar {
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:28px;
}

.header-text h1 {
  margin:0;
}

.header-text span {
  color:#55dc8a;
  font-size:10px;
  font-weight:bold;
}

.shoe-meter {
  margin-left:auto;
  color:#d99049;
}

#messages {
  flex:1;
  overflow:auto;
  padding:28px;
}

.message {
  max-width:78%;
  margin:13px 0;
  padding:14px 17px;
  border-radius:20px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  margin-left:auto;
  background:linear-gradient(135deg,var(--user1),var(--user2));
}

.cat {
  background:var(--panel2);
  border:1px solid var(--border);
}

.cat-label {
  font-weight:bold;
  margin-bottom:6px;
}

.bottom {
  padding:15px 22px 20px;
  border-top:1px solid var(--border);
  background:var(--panel);
}

.input-row {
  display:flex;
  gap:10px;
}

#input {
  flex:1;
  min-width:0;
  padding:15px;
  border-radius:15px;
  border:1px solid var(--border);
  outline:none;
  color:var(--text);
  background:var(--panel2);
}

.send {
  width:90px;
  border:0;
  border-radius:15px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

/* =====================================================
   ARCADE
===================================================== */

.arcade {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(5,3,12,.88);
  backdrop-filter:blur(15px);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.arcade.open {
  display:flex;
}

.arcade-card {
  width:min(950px,100%);
  height:min(720px,92vh);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:25px;
  border:1px solid var(--border);
  background:var(--panel);
}

.arcade-header {
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 22px;
  border-bottom:1px solid var(--border);
}

.arcade-header h2 {
  margin:0;
}

.close-game {
  margin-left:auto;
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  color:var(--text);
  background:var(--panel2);
}

.arcade-tabs {
  display:flex;
  gap:8px;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
}

.arcade-tab {
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 15px;
  color:var(--text);
  background:var(--panel2);
}

.arcade-tab.active {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

.arcade-view {
  flex:1;
  overflow:auto;
  padding:20px;
}

.game-list {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.game-card {
  padding:20px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel2);
}

.game-card-icon {
  font-size:42px;
}

.game-card h3 {
  margin:10px 0 5px;
}

.game-card p {
  color:var(--muted);
  min-height:38px;
}

.play-button {
  width:100%;
  padding:12px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:bold;
}

.game-screen {
  height:100%;
  display:flex;
  flex-direction:column;
}

.game-title {
  text-align:center;
}

.game-title h2 {
  margin:5px;
}

.game-title p {
  color:var(--muted);
}

.game-stats {
  display:flex;
  justify-content:center;
  gap:40px;
  padding:12px;
  font-weight:bold;
}

.game-stats span {
  color:var(--accent);
  font-size:20px;
}

.game-board {
  position:relative;
  flex:1;
  min-height:280px;
  overflow:hidden;
  margin:10px;
  border-radius:20px;
  border:2px solid var(--border);
  background:
    radial-gradient(circle at 20% 20%,rgba(155,98,255,.2),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(93,124,255,.2),transparent 30%),
    var(--panel2);
}

.target {
  position:absolute;
  border:0;
  background:transparent;
  font-size:45px;
  padding:0;
  user-select:none;
}

.game-message {
  min-height:55px;
  margin:0 10px 12px;
  padding:14px;
  text-align:center;
  border-radius:15px;
  border:1px solid var(--border);
  background:var(--panel2);
}

.exit-button {
  align-self:center;
  padding:12px 22px;
  margin-bottom:10px;
  border:0;
  border-radius:12px;
  color:white;
  background:#555;
}

.leaderboard-table {
  width:100%;
  border-collapse:collapse;
}

.leaderboard-table th,
.leaderboard-table td {
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.leaderboard-table th {
  color:var(--muted);
}

.name-overlay {
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  padding:20px;
}

.name-overlay.open {
  display:flex;
}

.name-box {
  width:min(430px,100%);
  padding:30px;
  border-radius:22px;
  background:var(--panel);
  border:1px solid var(--border);
  text-align:center;
}

.name-box input {
  width:100%;
  padding:14px;
  margin:15px 0;
  border-radius:12px;
  border:1px solid var(--border);
  color:var(--text);
  background:var(--panel2);
}

.name-box button {
  padding:12px 20px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

/* SECRET CAT
   Hidden somewhere else instead of being an obvious
   permanent chat button.
*/

.secret-cat {
  position:fixed;
  right:7px;
  bottom:7px;
  z-index:300;
  width:18px;
  height:18px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  opacity:.08;
  font-size:12px;
  transition:.2s;
}

.secret-cat:hover {
  opacity:.5;
}

.secret-bubble {
  position:fixed;
  right:28px;
  bottom:42px;
  z-index:301;
  max-width:220px;
  padding:9px 12px;
  border-radius:12px;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
  font-size:13px;
  opacity:0;
  transform:translateY(5px);
  pointer-events:none;
  transition:.2s;
}

.secret-bubble.show {
  opacity:1;
  transform:translateY(0);
}

@media(max-width:700px) {
  .sidebar {
    display:none;
  }

  #messages {
    padding:16px;
  }

  .message {
    max-width:90%;
  }

  .shoe-meter {
    display:none;
  }

  .arcade {
    padding:5px;
  }

  .arcade-card {
    height:97vh;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">
    <div class="logo-cat">🐈</div>
    Cat.AI
  </div>

  <button class="new-chat" onclick="newChat()">
    🐾 New Chat
  </button>

  <button class="arcade-button" onclick="openArcade()">
    🎮 Cat Arcade
  </button>

  <div class="history-title">
    CHAT HISTORY
  </div>

  <div id="history" class="history"></div>

</aside>

<main class="main">

<header>

  <div class="avatar">🐈</div>

  <div class="header-text">
    <h1>Cat.AI</h1>
    <span>● BRAIN ONLINE</span>
  </div>

  <div class="shoe-meter">
    👟 SHOES: SUSPICIOUS
  </div>

</header>

<div id="messages"></div>

<div class="bottom">

  <div class="input-row">

    <input
      id="input"
      placeholder="Talk to Cat.AI..."
      autocomplete="off"
    >

    <button class="send" onclick="sendMessage()">
      SEND
    </button>

  </div>

</div>

</main>
</div>


<!-- =====================================================
     ARCADE
===================================================== -->

<div id="arcade" class="arcade">

  <div class="arcade-card">

    <div class="arcade-header">

      <div style="font-size:32px">
        🐈
      </div>

      <div>
        <h2>Cat.AI Arcade</h2>
        <div style="font-size:11px;color:var(--muted)">
          SIX GAMES • GLOBAL SCORES
        </div>
      </div>

      <button
        class="close-game"
        onclick="closeArcade()">
        ✕
      </button>

    </div>

    <div class="arcade-tabs">

      <button
        id="gamesTab"
        class="arcade-tab active"
        onclick="showTab('games')">
        🎮 Games
      </button>

      <button
        id="leaderboardTab"
        class="arcade-tab"
        onclick="showTab('leaderboard')">
        🏆 Leaderboard
      </button>

    </div>

    <div
      id="arcadeView"
      class="arcade-view">
    </div>

  </div>

</div>


<!-- =====================================================
     NAME
===================================================== -->

<div
  id="nameOverlay"
  class="name-overlay">

  <div class="name-box">

    <h2>🐈 Who are you?</h2>

    <p>
      Pick the name Cat.AI will use.
    </p>

    <input
      id="playerName"
      maxlength="20"
      placeholder="Cookie"
    >

    <button onclick="saveName()">
      MEOW, LET'S PLAY!
    </button>

  </div>

</div>


<!-- =====================================================
     SECRET CAT
===================================================== -->

<div
  id="secretBubble"
  class="secret-bubble">
</div>

<button
  class="secret-cat"
  aria-label="Secret cat"
  onclick="secretMeow()">
  🐈
</button>


<script>

/* =====================================================
   STATE
===================================================== */

let playerName =
  localStorage.getItem(
    "catAIPlayerName"
  ) || "";

let currentGame = null;

let game = {
  running:false,
  score:0,
  time:0,
  timer:null,
  target:null
};

let pendingAction = null;


/*
   Current conversation.

   Each chat is stored like:

   {
     id,
     title,
     date,
     messages: [
       { type:"user", text:"hello" },
       { type:"cat", text:"MEOW!" }
     ]
   }
*/

let currentChatId = null;
let currentTitle = "New Chat";
let conversation = [];


/* =====================================================
   SIX GAMES
===================================================== */

const games = {

  mouse: {
    name:"Catch the Mouse!",
    icon:"🐭",
    description:"Catch 20 mice in 1 minute!",
    time:60,
    goal:20
  },

  yarn: {
    name:"Yarn Frenzy",
    icon:"🧶",
    description:"Catch 30 balls of yarn!",
    time:45,
    goal:30
  },

  fish: {
    name:"Fish Frenzy",
    icon:"🐟",
    description:"Catch 25 fish!",
    time:45,
    goal:25
  },

  shoe: {
    name:"Shoe Destroyer",
    icon:"👟",
    description:"DESTROY 30 SUSPICIOUS SHOES!",
    time:45,
    goal:30
  },

  feather: {
    name:"Feather Chase",
    icon:"🪶",
    description:"Catch 25 feathers!",
    time:45,
    goal:25
  },

  box: {
    name:"Box Attack",
    icon:"📦",
    description:"Attack 20 boxes!",
    time:45,
    goal:20
  }

};


/* =====================================================
   ELEMENTS
===================================================== */

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("input");

const historyBox =
  document.getElementById("history");

const arcade =
  document.getElementById("arcade");

const arcadeView =
  document.getElementById("arcadeView");

const nameOverlay =
  document.getElementById("nameOverlay");

const playerNameInput =
  document.getElementById("playerName");

const secretBubble =
  document.getElementById("secretBubble");


/* =====================================================
   CHAT STORAGE
===================================================== */

function getChats() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveChats(chats) {

  localStorage.setItem(
    "catAIChats",
    JSON.stringify(chats)
  );

}


function saveCurrentChat() {

  if(!conversation.length)
    return;

  const chats =
    getChats();

  const existingIndex =
    chats.findIndex(
      chat =>
        chat.id === currentChatId
    );

  const chat = {

    id:
      currentChatId ||
      (
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2)
      ),

    title:
      currentTitle,

    date:
      Date.now(),

    messages:
      conversation

  };

  currentChatId =
    chat.id;

  if(existingIndex >= 0) {

    chats[existingIndex] =
      chat;

  } else {

    chats.unshift(chat);

  }

  /*
     Newest first.
  */

  chats.sort(
    (a,b) =>
      b.date - a.date
  );

  /*
     Keep the most recent 30.
  */

  saveChats(
    chats.slice(0,30)
  );

  loadHistory();

}


function loadHistory() {

  const chats =
    getChats();

  historyBox.innerHTML = "";

  if(!chats.length) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "history-item";

    empty.style.cursor =
      "default";

    empty.textContent =
      "No chats yet...";

    historyBox.appendChild(
      empty
    );

    return;

  }

  chats.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      if(
        chat.id ===
        currentChatId
      ) {

        item.classList.add(
          "active"
        );

      }

      item.textContent =
        "🐾 " +
        (
          chat.title ||
          "New Chat"
        );

      item.title =
        chat.title ||
        "New Chat";

      item.onclick =
        () =>
          loadChat(chat.id);

      historyBox.appendChild(
        item
      );

    }
  );

}


function loadChat(id) {

  const chats =
    getChats();

  const chat =
    chats.find(
      item =>
        item.id === id
    );

  if(!chat)
    return;

  stopGame();

  currentChatId =
    chat.id;

  currentTitle =
    chat.title ||
    "New Chat";

  conversation =
    Array.isArray(
      chat.messages
    )
      ? chat.messages
      : [];

  messages.innerHTML =
    "";

  conversation.forEach(
    item => {

      addMessage(
        item.text,
        item.type,
        false
      );

    }
  );

  loadHistory();

}


function makeTitle(text) {

  const clean =
    String(text || "")
      .replace(/\s+/g," ")
      .trim();

  if(!clean)
    return "New Chat";

  return clean.length > 32
    ? clean.slice(0,32) + "..."
    : clean;

}


/* =====================================================
   MARKDOWN / CODE-FENCE CLEANUP
===================================================== */

function cleanAIResponse(text) {

  let result =
    String(text || "");

  /*
     Remove Markdown code fences.

     This catches:

     ```
     text
     ```

     and:

     ```text
     text
     ```

     without touching normal apostrophes
     or quotation marks.
  */

  result =
    result.replace(
      /```[a-zA-Z0-9_-]*\s*/g,
      ""
    );

  result =
    result.replace(
      /```/g,
      ""
    );

  /*
     Remove accidental leading/trailing
     whitespace left behind by fences.
  */

  return result.trim();

}


/* =====================================================
   CHAT
===================================================== */

function addMessage(
  text,
  type,
  save = true
) {

  const cleanText =
    String(text || "");

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " + type;

  if(type === "cat") {

    div.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
      </div>`;

    div.appendChild(
      document.createTextNode(
        cleanAIResponse(
          cleanText
        )
      )
    );

  } else {

    div.textContent =
      cleanText;

  }

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

  if(save) {

    conversation.push({
      type,
      text: cleanText
    });

    saveCurrentChat();

  }

}


async function sendMessage() {

  const text =
    input.value.trim();

  if(!text)
    return;

  /*
     First user message becomes
     the chat title.
  */

  if(
    conversation.length === 0
  ) {

    currentTitle =
      makeTitle(text);

  }

  addMessage(
    text,
    "user"
  );

  input.value = "";

  const thinking =
    document.createElement(
      "div"
    );

  thinking.className =
    "message cat";

  thinking.innerHTML =
    `<div class="cat-label">
      🐈 Cat.AI
    </div>`;

  thinking.appendChild(
    document.createTextNode(
      "Cat.AI is thinking... 🧠"
    )
  );

  messages.appendChild(
    thinking
  );

  messages.scrollTop =
    messages.scrollHeight;

  try {

    const response =
      await fetch(
        "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:text
            })
        }
      );

    if(!response.ok) {

      throw new Error(
        "Chat request failed"
      );

    }

    const data =
      await response.json();

    const reply =
      cleanAIResponse(
        data.reply ||
        "MEOW!"
      );

    thinking.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
      </div>`;

    thinking.appendChild(
      document.createTextNode(
        reply
      )
    );

    /*
       Save the AI response.
    */

    conversation.push({
      type:"cat",
      text:reply
    });

    saveCurrentChat();

  } catch {

    const reply =
      "MRRP! I can't reach my brain! 🧠💥";

    thinking.innerHTML =
      `<div class="cat-label">
        🐈 Cat.AI
      </div>`;

    thinking.appendChild(
      document.createTextNode(
        reply
      )
    );

    conversation.push({
      type:"cat",
      text:reply
    });

    saveCurrentChat();

  }

}


input.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter") {

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   NEW CHAT
===================================================== */

function newChat() {

  stopGame();

  messages.innerHTML = "";

  currentChatId =
    null;

  currentTitle =
    "New Chat";

  conversation =
    [];

  loadHistory();

  addMessage(
    "Cat.AI is online. Ask me anything or open the Cat Arcade! 6 Games in the arcade! Yay!",
    "cat"
  );

}


/* =====================================================
   PLAYER NAME
===================================================== */

function requireName(
  action
) {

  if(playerName) {

    action();

    return;

  }

  pendingAction =
    action;

  nameOverlay.classList.add(
    "open"
  );

  playerNameInput.focus();

}


function saveName() {

  const name =
    playerNameInput.value
      .trim()
      .replace(
        /[<>]/g,
        ""
      )
      .slice(0,20);

  if(!name)
    return;

  playerName =
    name;

  localStorage.setItem(
    "catAIPlayerName",
    playerName
  );

  nameOverlay.classList.remove(
    "open"
  );

  if(pendingAction) {

    const action =
      pendingAction;

    pendingAction =
      null;

    action();

  }

}


playerNameInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      saveName();

  }
);


/* =====================================================
   ARCADE
===================================================== */

function openArcade() {

  arcade.classList.add(
    "open"
  );

  showTab(
    "games"
  );

}


function closeArcade() {

  stopGame();

  arcade.classList.remove(
    "open"
  );

}


function showTab(tab) {

  document
    .getElementById("gamesTab")
    .classList.toggle(
      "active",
      tab === "games"
    );

  document
    .getElementById("leaderboardTab")
    .classList.toggle(
      "active",
      tab === "leaderboard"
    );

  if(tab === "games")
    renderGames();
  else
    renderLeaderboard();

}


/* =====================================================
   SIX GAME MENU
===================================================== */

function renderGames() {

  arcadeView.innerHTML =
    `<div class="game-list">

      ${Object.entries(games)
        .map(
          ([id,g]) => `

          <div class="game-card">

            <div class="game-card-icon">
              ${g.icon}
            </div>

            <h3>
              ${g.name}
            </h3>

            <p>
              ${g.description}
            </p>

            <button
              class="play-button"
              onclick="playGame('${id}')">
              PLAY
            </button>

          </div>

        `
        )
        .join("")}

    </div>`;

}


/* =====================================================
   START GAME
===================================================== */

function playGame(id) {

  requireName(
    () => startGame(id)
  );

}


function startGame(id) {

  stopGame();

  currentGame =
    id;

  const config =
    games[id];

  game = {

    running:true,

    score:0,

    time:
      config.time,

    timer:null,

    target:null

  };

  renderGame();

  spawnTarget();

  game.timer =
    setInterval(
      () => {

        game.time--;

        updateStats();

        if(
          game.time <= 0
        ) {

          finishGame(
            false
          );

        }

      },
      1000
    );

}


/* =====================================================
   GAME SCREEN
===================================================== */

function renderGame() {

  const config =
    games[currentGame];

  arcadeView.innerHTML = `

    <div class="game-screen">

      <div class="game-title">

        <h2>
          ${config.icon}
          ${config.name}
        </h2>

        <p>
          ${config.description}
        </p>

      </div>

      <div class="game-stats">

        <div>
          Score:
          <span id="score">
            0
          </span>
          /
          ${config.goal}
        </div>

        <div>
          Time:
          <span id="time">
            ${config.time}
          </span>
          s
        </div>

      </div>

      <div
        id="gameBoard"
        class="game-board">
      </div>

      <div
        id="gameMessage"
        class="game-message">

        🐈 Cat.AI:
        Ready, ${escapeHTML(playerName)}?

      </div>

      <button
        class="exit-button"
        onclick="exitGame()">

        ← EXIT GAME

      </button>

    </div>

  `;

}


function updateStats() {

  const score =
    document.getElementById(
      "score"
    );

  const time =
    document.getElementById(
      "time"
    );

  if(score)
    score.textContent =
      game.score;

  if(time)
    time.textContent =
      game.time;

}


/* =====================================================
   TARGET
===================================================== */

function spawnTarget() {

  if(!game.running)
    return;

  const board =
    document.getElementById(
      "gameBoard"
    );

  if(!board)
    return;

  if(game.target)
    game.target.remove();

  const target =
    document.createElement(
      "button"
    );

  target.className =
    "target";

  target.textContent =
    games[currentGame].icon;

  const x =
    Math.random() *
    Math.max(
      1,
      board.clientWidth - 60
    );

  const y =
    Math.random() *
    Math.max(
      1,
      board.clientHeight - 60
    );

  target.style.left =
    x + "px";

  target.style.top =
    y + "px";

  target.onclick =
    hitTarget;

  board.appendChild(
    target
  );

  game.target =
    target;

}


/* =====================================================
   HIT TARGET
===================================================== */

function hitTarget() {

  if(!game.running)
    return;

  game.score++;

  updateStats();

  playMeow();

  if(
    game.score >=
    games[currentGame].goal
  ) {

    finishGame(
      true
    );

    return;

  }

  catEncouragement();

  spawnTarget();

}


/* =====================================================
   CAT.AI GAME ENCOURAGEMENT
===================================================== */

async function catEncouragement() {

  const message =
    document.getElementById(
      "gameMessage"
    );

  if(!message)
    return;

  if(
    game.score % 5 !== 0 &&
    game.score !== 1
  )
    return;

  message.textContent =
    "🐈 Cat.AI is thinking... 🧠";

  try {

    const response =
      await fetch(
        "/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                `You are Cat.AI encouraging ${playerName} during ${games[currentGame].name}. They have ${game.score} points and ${game.time} seconds left. Give one extremely short excited cat-like encouragement. Maximum 12 words.`

            })

        }
      );

    const data =
      await response.json();

    message.textContent =
      "🐈 Cat.AI: " +
      cleanAIResponse(
        data.reply ||
        "KEEP GOING!"
      );

  } catch {

    message.textContent =
      "🐈 Cat.AI: KEEP GOING!";

  }

}


/* =====================================================
   FINISH
===================================================== */

async function finishGame(
  won
) {

  if(!game.running)
    return;

  game.running =
    false;

  clearInterval(
    game.timer
  );

  if(game.target)
    game.target.remove();

  const message =
    document.getElementById(
      "gameMessage"
    );

  if(won) {

    message.textContent =
      `🐈 Cat.AI: MEOW!!! ${playerName.toUpperCase()} WON! 🎉`;

    playWinSound();

  } else {

    message.textContent =
      `🐈 Cat.AI: TIME'S UP! ${game.score} points!`;

  }

  await submitScore(
    game.score,
    games[currentGame].time -
      game.time,
    won
  );

  const button =
    document.querySelector(
      ".exit-button"
    );

  if(button) {

    button.textContent =
      "🏆 VIEW LEADERBOARD";

    button.onclick =
      () =>
        showTab(
          "leaderboard"
        );

  }

}


/* =====================================================
   SCORE SUBMISSION
===================================================== */

async function submitScore(
  score,
  time,
  won
) {

  try {

    await fetch(
      "/api/scores",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            name:
              playerName,

            game:
              currentGame,

            score,

            time,

            won

          })

      }
    );

  } catch(error) {

    console.error(
      "Score failed:",
      error
    );

  }

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function renderLeaderboard() {

  arcadeView.innerHTML = `

    <h2>
      🏆 Cat.AI Global Leaderboard
    </h2>

    <p style="color:var(--muted)">
      Choose a game:
    </p>

    <div class="game-list">

      ${Object.entries(games)
        .map(
          ([id,g]) => `

          <div class="game-card">

            <div class="game-card-icon">
              ${g.icon}
            </div>

            <h3>
              ${g.name}
            </h3>

            <button
              class="play-button"
              onclick="loadScores('${id}')">

              VIEW SCORES

            </button>

          </div>

        `
        )
        .join("")}

    </div>

  `;

}


async function loadScores(
  id
) {

  arcadeView.innerHTML = `

    <h2>
      ${games[id].icon}
      ${games[id].name}
    </h2>

    <p style="color:var(--muted)">
      Loading scores...
    </p>

  `;

  try {

    const response =
      await fetch(
        "/api/leaderboard?game=" +
        encodeURIComponent(id)
      );

    const data =
      await response.json();

    const rows =
      data.scores || [];

    arcadeView.innerHTML = `

      <button
        class="arcade-tab"
        onclick="renderLeaderboard()">

        ← All Games

      </button>

      <h2>
        🏆 ${games[id].name}
      </h2>

      <table class="leaderboard-table">

        <thead>

          <tr>
            <th>#</th>
            <th>PLAYER</th>
            <th>SCORE</th>
            <th>TIME</th>
          </tr>

        </thead>

        <tbody>

          ${
            rows.length
              ? rows.map(
                  (row,i) => `

                    <tr>

                      <td>
                        ${
                          i === 0
                            ? "👑"
                            : i + 1
                        }
                      </td>

                      <td>
                        ${escapeHTML(
                          row.name
                        )}
                      </td>

                      <td>
                        ${row.score}
                      </td>

                      <td>
                        ${row.time}s
                      </td>

                    </tr>

                  `
                ).join("")
              :
              `
                <tr>
                  <td colspan="4">
                    No scores yet!
                    Be the first cat!
                  </td>
                </tr>
              `
          }

        </tbody>

      </table>

    `;

  } catch {

    arcadeView.innerHTML = `

      <h2>
        🏆 Leaderboard
      </h2>

      <p>
        MRRP! I can't reach the leaderboard server!
      </p>

      <button
        class="arcade-tab"
        onclick="renderLeaderboard()">

        TRY AGAIN

      </button>

    `;

  }

}


/* =====================================================
   GAME CONTROL
===================================================== */

function stopGame() {

  game.running =
    false;

  clearInterval(
    game.timer
  );

  game.timer =
    null;

  if(game.target) {

    game.target.remove();

    game.target =
      null;

  }

}


function exitGame() {

  stopGame();

  renderGames();

}


/* =====================================================
   SOUND
===================================================== */

function playMeow() {

  const AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC)
    return;

  const audio =
    new AC();

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.frequency.value =
    700;

  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .15,
    audio.currentTime + .02
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + .2
  );

  osc.connect(gain);

  gain.connect(
    audio.destination
  );

  osc.start();

  osc.stop(
    audio.currentTime + .2
  );

}


function playWinSound() {

  const AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC)
    return;

  const audio =
    new AC();

  [523,659,784,1046]
    .forEach(
      (freq,i) => {

        const osc =
          audio.createOscillator();

        const gain =
          audio.createGain();

        const start =
          audio.currentTime +
          i * .12;

        osc.frequency.value =
          freq;

        gain.gain.setValueAtTime(
          .001,
          start
        );

        gain.gain.exponentialRampToValueAtTime(
          .18,
          start + .02
        );

        gain.gain.exponentialRampToValueAtTime(
          .001,
          start + .18
        );

        osc.connect(gain);

        gain.connect(
          audio.destination
        );

        osc.start(start);

        osc.stop(
          start + .18
        );

      }
    );

}


/* =====================================================
   SECRET CAT
===================================================== */

function secretMeow() {

  playMeow();

  secretBubble.textContent =
    "MEOW. You found me. 🐈";

  secretBubble.classList.add(
    "show"
  );

  clearTimeout(
    window.secretBubbleTimer
  );

  window.secretBubbleTimer =
    setTimeout(
      () => {

        secretBubble.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(value);

  return div.innerHTML;

}
