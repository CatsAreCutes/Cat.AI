<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cat.AI 🐈</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}

:root {
  --text: #f8f3ff;
  --muted: #aaa0bd;
  --panel: rgba(25,18,42,.88);
  --panel2: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.14);
  --accent: #9b62ff;
  --accent2: #5d7cff;
  --user1: #7550c9;
  --user2: #536dd5;
}

body {
  margin: 0;
  min-height: 100vh;

  overflow: hidden;

  font-family: Arial, sans-serif;

  color: var(--text);

  background: #080611;

  transition: .4s;
}


/* =====================================================
   OG THEME
===================================================== */

body.theme-og {
  --text: #eeeeee;
  --muted: #999999;
  --panel: #191919;
  --panel2: #252525;
  --border: #3a3a3a;
  --accent: #888888;
  --accent2: #555555;
  --user1: #444444;
  --user2: #303030;

  background: #111111;
}


/* =====================================================
   PURPLE THEME
===================================================== */

body.theme-purple {
  --text: #f8f3ff;
  --muted: #aaa0bd;
  --panel: rgba(25,18,42,.88);
  --panel2: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.14);
  --accent: #9b62ff;
  --accent2: #5d7cff;
  --user1: #7550c9;
  --user2: #536dd5;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(155,98,255,.3),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(70,110,255,.25),
      transparent 30%
    ),
    #080611;
}


/* =====================================================
   YARN THEME
===================================================== */

body.theme-yarn {
  --text: #fff8f2;
  --muted: #d8c2b2;
  --panel: rgba(76,45,35,.88);
  --panel2: rgba(255,230,210,.10);
  --border: rgba(255,225,205,.22);
  --accent: #ff9b68;
  --accent2: #e76f9b;
  --user1: #c96572;
  --user2: #a85282;

  background-color: #704536;

  background-image:
    repeating-linear-gradient(
      25deg,
      rgba(255,255,255,.13) 0px,
      rgba(255,255,255,.13) 2px,
      transparent 2px,
      transparent 7px
    ),
    repeating-linear-gradient(
      -25deg,
      rgba(0,0,0,.13) 0px,
      rgba(0,0,0,.13) 2px,
      transparent 2px,
      transparent 7px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 5px
    );

  background-size:
    18px 18px,
    18px 18px,
    7px 7px;
}

body.theme-yarn::before {
  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -1;

  background:
    repeating-linear-gradient(
      115deg,
      transparent 0px,
      transparent 9px,
      rgba(255,255,255,.045) 10px,
      rgba(255,255,255,.045) 12px,
      transparent 13px,
      transparent 22px
    );
}

body.theme-yarn::after {
  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -1;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.10) 0 1px,
      transparent 2px
    );

  background-size: 13px 13px;

  opacity: .35;
}


/* =====================================================
   PILLOW WALL
===================================================== */

body.theme-pillow {
  --text: #44364c;
  --muted: #786b7e;
  --panel: rgba(255,255,255,.88);
  --panel2: rgba(255,255,255,.62);
  --border: rgba(80,50,100,.16);
  --accent: #a879d4;
  --accent2: #7d9ee6;
  --user1: #a96fce;
  --user2: #718fd8;

  background: #cfc3d3;
}

.pillow-wall {
  display: none;

  position: fixed;

  inset: -40px;

  z-index: -5;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #b9adbe,
      #d8cbd9
    );

  padding: 25px;

  transform:
    rotate(-1deg)
    scale(1.04);

  pointer-events: none;

  grid-template-columns:
    repeat(6, minmax(130px, 1fr));

  grid-auto-rows: 105px;

  gap: 8px;
}

body.theme-pillow .pillow-wall {
  display: grid;
}

.pillow {
  position: relative;

  min-width: 130px;
  min-height: 105px;

  border-radius: 28px;

  background:
    radial-gradient(
      ellipse at 30% 20%,
      rgba(255,255,255,.9),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 70% 80%,
      rgba(90,60,100,.18),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #f9e9f4,
      #d9bfd4
    );

  border:
    4px solid rgba(170,130,170,.35);

  box-shadow:
    inset 8px 8px 14px rgba(255,255,255,.65),
    inset -9px -10px 16px rgba(90,60,100,.16),
    0 12px 16px rgba(65,45,75,.28);

  transform:
    rotate(var(--rotation));
}

.pillow::before {
  content: "";

  position: absolute;

  inset: 9px;

  border-radius: 21px;

  border:
    2px dashed rgba(125,90,130,.28);

  box-shadow:
    inset 0 0 10px rgba(100,70,110,.12);
}

.pillow:nth-child(3n) {
  background:
    linear-gradient(
      145deg,
      #e9d9ff,
      #c8b5e0
    );
}

.pillow:nth-child(4n) {
  background:
    linear-gradient(
      145deg,
      #dcecff,
      #b9cbe7
    );
}

.pillow:nth-child(5n) {
  background:
    linear-gradient(
      145deg,
      #ffe2ee,
      #ddbaca
    );
}


/* =====================================================
   APP
===================================================== */

.app {
  width: 100vw;
  height: 100vh;

  display: flex;

  position: relative;

  z-index: 2;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  width: 270px;

  padding: 18px;

  background: var(--panel);

  border-right:
    1px solid var(--border);

  backdrop-filter: blur(20px);

  display: flex;

  flex-direction: column;

  gap: 14px;

  z-index: 5;
}

.logo {
  display: flex;

  align-items: center;

  gap: 12px;

  font-size: 21px;

  font-weight: bold;
}

.logo-cat {
  width: 44px;
  height: 44px;

  display: grid;

  place-items: center;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-size: 26px;
}

.new-chat,
.arcade-button {
  border: 0;

  border-radius: 14px;

  padding: 13px;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight: bold;

  cursor: pointer;
}

.arcade-button {
  background:
    linear-gradient(
      135deg,
      #ff8a3d,
      #e74d91
    );
}

.history-title {
  color: var(--muted);

  font-size: 11px;

  font-weight: bold;

  letter-spacing: 1px;
}

.history {
  flex: 1;

  overflow-y: auto;
}

.history-item {
  padding: 11px;

  margin-bottom: 7px;

  border-radius: 12px;

  cursor: pointer;

  color: var(--muted);

  font-size: 13px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.history-item:hover {
  background: var(--panel2);

  color: var(--text);
}

.sidebar-buttons {
  display: flex;

  gap: 8px;
}

.small-button {
  flex: 1;

  padding: 10px 5px;

  border:
    1px solid var(--border);

  border-radius: 12px;

  color: var(--text);

  background: var(--panel2);

  cursor: pointer;
}


/* =====================================================
   THEME MENU
===================================================== */

.theme-menu {
  position: absolute;

  left: 18px;

  bottom: 70px;

  width: 234px;

  padding: 12px;

  background: var(--panel);

  border:
    1px solid var(--border);

  border-radius: 16px;

  backdrop-filter: blur(20px);

  display: none;

  z-index: 20;
}

.theme-menu.open {
  display: block;
}

.theme-menu h3 {
  margin: 4px 5px 10px;

  font-size: 13px;
}

.theme-option {
  width: 100%;

  border: 0;

  padding: 11px;

  margin: 4px 0;

  border-radius: 11px;

  text-align: left;

  color: var(--text);

  background: var(--panel2);

  cursor: pointer;
}

.theme-option:hover {
  outline:
    1px solid var(--accent);
}


/* =====================================================
   MAIN
===================================================== */

.main {
  flex: 1;

  min-width: 0;

  display: flex;

  flex-direction: column;
}

header {
  height: 76px;

  padding: 14px 22px;

  display: flex;

  align-items: center;

  gap: 14px;

  border-bottom:
    1px solid var(--border);

  background: var(--panel);

  backdrop-filter: blur(20px);
}

.avatar {
  width: 48px;
  height: 48px;

  display: grid;

  place-items: center;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-size: 28px;
}

.header-text h1 {
  margin: 0;

  font-size: 19px;
}

.header-text span {
  color: #55dc8a;

  font-size: 10px;

  font-weight: bold;
}

.shoe-meter {
  margin-left: auto;

  padding: 8px 12px;

  border-radius: 999px;

  border:
    1px solid rgba(255,180,100,.25);

  background:
    rgba(255,160,70,.08);

  color: #d99049;

  font-size: 11px;
}


/* =====================================================
   MESSAGES
===================================================== */

#messages {
  flex: 1;

  overflow-y: auto;

  padding: 28px;
}

.message {
  max-width: 78%;

  margin: 13px 0;

  padding: 14px 17px;

  border-radius: 20px;

  line-height: 1.5;

  white-space: pre-wrap;

  overflow-wrap: anywhere;
}

.user {
  margin-left: auto;

  background:
    linear-gradient(
      135deg,
      var(--user1),
      var(--user2)
    );

  color: white;

  border-bottom-right-radius: 6px;
}

.cat {
  background: var(--panel2);

  border:
    1px solid var(--border);

  border-bottom-left-radius: 6px;
}

.cat-label {
  font-weight: bold;

  margin-bottom: 6px;
}


/* =====================================================
   INPUT
===================================================== */

.bottom {
  padding: 15px 22px 20px;

  border-top:
    1px solid var(--border);

  background: var(--panel);

  backdrop-filter: blur(20px);
}

.input-row {
  display: flex;

  gap: 10px;
}

#input {
  flex: 1;

  min-width: 0;

  padding: 15px 17px;

  border-radius: 15px;

  border:
    1px solid var(--border);

  outline: none;

  color: var(--text);

  background: var(--panel2);

  font-size: 15px;
}

#input:focus {
  border-color: var(--accent);
}

.send {
  width: 90px;

  border: 0;

  border-radius: 15px;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-weight: bold;

  cursor: pointer;
}

.hint {
  text-align: center;

  color: var(--muted);

  font-size: 10px;

  margin-top: 8px;
}


/* =====================================================
   ARCADE
===================================================== */

.arcade {
  display: none;

  position: absolute;

  inset: 0;

  z-index: 30;

  background:
    rgba(5,3,12,.82);

  backdrop-filter: blur(15px);

  align-items: center;

  justify-content: center;

  padding: 20px;
}

.arcade.open {
  display: flex;
}

.game-card {
  width: min(850px, 100%);

  height: min(650px, 90vh);

  display: flex;

  flex-direction: column;

  overflow: hidden;

  border-radius: 25px;

  border:
    1px solid var(--border);

  background: var(--panel);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5);
}

.game-header {
  padding: 18px 22px;

  display: flex;

  align-items: center;

  gap: 12px;

  border-bottom:
    1px solid var(--border);
}

.game-header h2 {
  margin: 0;

  font-size: 20px;
}

.close-game {
  margin-left: auto;

  width: 38px;
  height: 38px;

  border: 0;

  border-radius: 12px;

  color: var(--text);

  background: var(--panel2);

  cursor: pointer;

  font-size: 18px;
}

.game-info {
  display: flex;

  justify-content: center;

  gap: 25px;

  padding: 15px;

  font-weight: bold;

  border-bottom:
    1px solid var(--border);
}

.game-info span {
  color: var(--accent);
}

.game-board {
  flex: 1;

  position: relative;

  margin: 18px;

  overflow: hidden;

  border-radius: 20px;

  border:
    2px solid var(--border);

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(155,98,255,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(93,124,255,.18),
      transparent 30%
    ),
    var(--panel2);
}

.mouse {
  position: absolute;

  width: 54px;
  height: 54px;

  border: 0;

  background: transparent;

  cursor: pointer;

  font-size: 40px;

  user-select: none;

  transition: transform .08s;
}

.mouse:hover {
  transform: scale(1.2);
}

.game-message {
  min-height: 55px;

  margin: 0 20px 18px;

  padding: 13px 16px;

  border-radius: 15px;

  background: var(--panel2);

  border:
    1px solid var(--border);

  text-align: center;

  color: var(--text);
}

.start-game {
  align-self: center;

  margin: 0 0 20px;

  padding: 13px 25px;

  border: 0;

  border-radius: 14px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #ff8a3d,
      #e74d91
    );

  font-weight: bold;

  cursor: pointer;
}


/* =====================================================
   SECRET CAT
===================================================== */

.secret-cat {
  position: fixed;

  right: 18px;
  bottom: 18px;

  width: 45px;
  height: 45px;

  border:
    1px solid var(--border);

  border-radius: 50%;

  background: var(--panel);

  backdrop-filter: blur(12px);

  font-size: 25px;

  cursor: pointer;

  opacity: .3;

  transition: .2s;

  z-index: 999;
}

.secret-cat:hover {
  opacity: 1;

  transform:
    scale(1.15)
    rotate(-6deg);
}

.secret-cat.meowing {
  animation:
    catMeow .5s ease;
}

@keyframes catMeow {

  0% {
    transform: scale(1);
  }

  30% {
    transform:
      scale(1.35)
      rotate(-8deg);
  }

  60% {
    transform:
      scale(.9)
      rotate(8deg);
  }

  100% {
    transform: scale(1);
  }

}

.secret-meow-bubble {
  position: fixed;

  right: 70px;
  bottom: 70px;

  padding: 10px 15px;

  border-radius: 15px;

  background: var(--panel);

  color: var(--text);

  border:
    1px solid var(--border);

  backdrop-filter: blur(12px);

  font-weight: bold;

  z-index: 1000;

  box-shadow:
    0 5px 20px rgba(0,0,0,.25);

  animation:
    meowBubble .2s ease;
}

@keyframes meowBubble {

  from {
    opacity: 0;

    transform:
      scale(.7)
      translateY(10px);
  }

  to {
    opacity: 1;

    transform:
      scale(1)
      translateY(0);
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

  .sidebar {
    display: none;
  }

  .shoe-meter {
    display: none;
  }

  #messages {
    padding: 16px;
  }

  .message {
    max-width: 90%;
  }

  .secret-cat {
    bottom: 80px;
  }

  .game-card {
    height: 90vh;
  }

  .game-info {
    gap: 12px;

    font-size: 13px;
  }

}

</style>
</head>


<body class="theme-purple">


<!-- =====================================================
     PILLOW WALL
===================================================== -->

  <div class="pillow" style="--rotation:-2deg"></div>

  <div class="pillow" style="--rotation:3deg"></div>
  <div class="pillow" style="--rotation:-3deg"></div>
  <div class="pillow" style="--rotation:1deg"></div>

  <div class="pillow" style="--rotation:-2deg"></div>
  <div class="pillow" style="--rotation:2deg"></div>
  <div class="pillow" style="--rotation:-1deg"></div>
  <div class="pillow" style="--rotation:3deg"></div>
  <div class="pillow" style="--rotation:-2deg"></div>
  <div class="pillow" style="--rotation:1deg"></div>

  <div class="pillow" style="--rotation:-3deg"></div>
  <div class="pillow" style="--rotation:2deg"></div>
  <div class="pillow" style="--rotation:-1deg"></div>
  <div class="pillow" style="--rotation:3deg"></div>
  <div class="pillow" style="--rotation:-2deg"></div>
  <div class="pillow" style="--rotation:1deg"></div>

  <div class="pillow" style="--rotation:2deg"></div>
  <div class="pillow" style="--rotation:-1deg"></div>

</div>

<button

  🐈

</button>


<!-- =====================================================
     ARCADE WINDOW
===================================================== -->

<div
  id="arcade"
  class="arcade">


  <div class="game-card">


    <div class="game-header">

      <div style="font-size:30px">
        🐭
      </div>

        </h2>

          style="
            font-size:11px;

    </div>


    <div

    </div>

      🐈 Cat.AI:
      Ready to hunt some mice?

    </div>


    <button
      id="startGameButton"

      onclick="startMouseGame()">

      🐭 START GAME

    </button>


  </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentChat = {
  id: Date.now(),
  title: "New Chat",
  messages: []
};


/* =====================================================
   ELEMENTS
===================================================== */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const historyBox =
  document.getElementById("history");

const themeMenu =
  document.getElementById("themeMenu");

const arcade =
  document.getElementById("arcade");

const gameBoard =
  document.getElementById("gameBoard");

const scoreElement =
  document.getElementById("score");

const timerElement =
  document.getElementById("timer");

const gameMessage =
  document.getElementById("gameMessage");

const startGameButton =
  document.getElementById("startGameButton");


/* =====================================================
   CHAT HISTORY
===================================================== */

function saveChat() {

  if (
    currentChat.messages.length === 0
  ) {
    return;
  }


  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );


  const index =
    chats.findIndex(
      chat =>
        chat.id === currentChat.id
    );


  if (index >= 0) {

    chats[index] =
      currentChat;

  } else {

    chats.unshift(
      currentChat
    );

  }


  localStorage.setItem(
    "catAIChats",
    JSON.stringify(
      chats.slice(0, 30)
    )
  );


  loadHistory();

}


function loadHistory() {

  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );


  historyBox.innerHTML = "";


  chats.forEach(chat => {

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "history-item";


    item.textContent =
      "🐾 " +
      (
        chat.title ||
        "Untitled Chat"
      );


    item.onclick =
      () => loadChat(chat.id);


    historyBox.appendChild(
      item
    );

  });

}


function loadChat(id) {

  const chats =
    JSON.parse(
      localStorage.getItem(
        "catAIChats"
      ) || "[]"
    );


  const chat =
    chats.find(
      c => c.id === id
    );


  if (!chat) {
    return;
  }


  currentChat =
    chat;


  messages.innerHTML = "";


  currentChat.messages.forEach(
    message => {

      addMessage(
        message.text,
        message.type,
        false
      );

    }
  );

}


function newChat() {

  saveChat();


  currentChat = {
    id: Date.now(),
    title: "New Chat",
    messages: []
  };


  messages.innerHTML = "";


  showWelcome();

}


function clearHistory() {

  if (
    !confirm(
      "Delete all saved Cat.AI chats?"
    )
  ) {
    return;
  }


  localStorage.removeItem(
    "catAIChats"
  );


  loadHistory();

}


/* =====================================================
   CHAT UI
===================================================== */

function showWelcome() {

  addMessage(
    "MEOW! New chat detected! What are we talking about?",
    "cat",
    true
  );

}


function addMessage(
  text,
  type,
  save = true
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message " + type;


  if (type === "cat") {

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "cat-label";


    label.textContent =
      "🐈 Cat.AI";


    div.appendChild(
      label
    );


    div.appendChild(
      document.createTextNode(
        text
      )
    );

  } else {

    div.textContent =
      text;

  }


  messages.appendChild(
    div
  );


  messages.scrollTop =
    messages.scrollHeight;


  if (save) {

    currentChat.messages.push({
      text,
      type
    });


    if (
      type === "user" &&
      currentChat.title === "New Chat"
    ) {

      currentChat.title =
        text.slice(0, 30) +
        (
          text.length > 30
            ? "..."
            : ""
        );

    }


    saveChat();

  }

}


/* =====================================================
   SEND CHAT MESSAGE
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  addMessage(
    text,
    "user"
  );


  input.value = "";


  const thinking =
    document.createElement(
      "div"
    );


  thinking.className =
    "message cat";


  thinking.innerHTML = `
    <div class="cat-label">
      🐈 Cat.AI
    </div>

    <div class="thinking">
      <i></i>
      <i></i>
      <i></i>
    </div>
  `;


  messages.appendChild(
    thinking
  );


  messages.scrollTop =
    messages.scrollHeight;


  try {

    const response =
      await fetch(
        "/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text
            })
        }
      );


    const data =
      await response.json();


    const reply =
      data.reply ||
      "MRRP! My brain went on vacation!";


    thinking.innerHTML = "";


    const label =
      document.createElement(
        "div"
      );


    label.className =
      "cat-label";


    label.textContent =
      "🐈 Cat.AI";


    thinking.appendChild(
      label
    );


    thinking.appendChild(
      document.createTextNode(
        reply
      )
    );


    currentChat.messages.push({
      text: reply,
      type: "cat"
    });


    saveChat();


  } catch (error) {

    thinking.innerHTML = `
      <div class="cat-label">
        🐈 Cat.AI
      </div>

      MRRP! I can't reach my brain! 🧠💥
    `;

  }

}


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      sendMessage();

    }

  }
);


/* =====================================================
   THEMES
===================================================== */

function toggleThemeMenu() {

  themeMenu.classList.toggle(
    "open"
  );

}


function setTheme(theme) {

  document.body.classList.remove(
    "theme-og",
    "theme-purple",
    "theme-yarn",
    "theme-pillow"
  );


  document.body.classList.add(
    "theme-" + theme
  );


  localStorage.setItem(
    "catAITheme",
    theme
  );


  themeMenu.classList.remove(
    "open"
  );

}


const savedTheme =
  localStorage.getItem(
    "catAITheme"
  );


if (savedTheme) {

  setTheme(
    savedTheme
  );

}


/* =====================================================
   CAT ARCADE
===================================================== */

function openArcade() {

  arcade.classList.add(
    "open"
  );

}


function closeArcade() {

  arcade.classList.remove(
    "open"
  );

}


/* =====================================================
   MOUSE GAME VARIABLES
===================================================== */

let mouseScore = 0;

let mouseTime = 60;

let mouseTimer = null;

let mouseRunning = false;

let mouseElement = null;


/* =====================================================
   START MOUSE GAME
===================================================== */

function startMouseGame() {

  clearInterval(
    mouseTimer
  );


  mouseScore = 0;

  mouseTime = 60;

  mouseRunning = true;


  scoreElement.textContent =
    mouseScore;


  timerElement.textContent =
    mouseTime;


  gameBoard.innerHTML =
    "";


  startGameButton.disabled =
    true;


  startGameButton.textContent =
    "🐭 CATCH THEM!";


  gameMessage.textContent =
    "🐈 Cat.AI: GO GO GO! CATCH THOSE MICE!";


  spawnMouse();


  mouseTimer =
    setInterval(
      () => {

        mouseTime--;

        timerElement.textContent =
          mouseTime;


        if (
          mouseTime <= 0
        ) {

          endMouseGame(
            false
          );

        }

      },
      1000
    );

}


/* =====================================================
   SPAWN MOUSE
===================================================== */

function spawnMouse() {

  if (
    !mouseRunning
  ) {
    return;
  }


  if (
    mouseElement
  ) {

    mouseElement.remove();

  }


  const mouse =
    document.createElement(
      "button"
    );


  mouse.className =
    "mouse";


  mouse.textContent =
    "🐭";


  mouse.setAttribute(
    "aria-label",
    "Catch mouse"
  );


  const maxX =
    Math.max(
      0,
      gameBoard.clientWidth - 65
    );


  const maxY =
    Math.max(
      0,
      gameBoard.clientHeight - 65
    );


  mouse.style.left =
    Math.random() *
    maxX +
    "px";


  mouse.style.top =
    Math.random() *
    maxY +
    "px";


  mouse.onclick =
    catchMouse;


  gameBoard.appendChild(
    mouse
  );


  mouseElement =
    mouse;

}


/* =====================================================
   CATCH MOUSE
===================================================== */

function catchMouse() {

  if (
    !mouseRunning
  ) {
    return;
  }


  mouseScore++;


  scoreElement.textContent =
    mouseScore;


  playTinyMeow();


  if (
    mouseScore >= 20
  ) {

    endMouseGame(
      true
    );

    return;

  }


  updateCatEncouragement();


  spawnMouse();

}


/* =====================================================
   CAT.AI ENCOURAGEMENT
===================================================== */

async function updateCatEncouragement() {

  /*
    We only ask Groq at milestones,
    so the game doesn't spam the API.
  */

  const milestones =
    [1, 5, 10, 15, 18, 19];


  if (
    !milestones.includes(
      mouseScore
    )
  ) {

    return;

  }


  gameMessage.textContent =
    "🐈 Cat.AI is thinking... 🧠";


  try {

    const response =
      await fetch(
        "/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                `You are Cat.AI encouraging a player in a minigame called Catch the Mouse. The player has caught ${mouseScore} out of 20 mice and has ${mouseTime} seconds left. Give ONE very short excited cat-like encouragement. Maximum 15 words. Do not ask a question. Do not mention being an AI.`

            })

        }
      );


    const data =
      await response.json();


    if (
      data.reply
    ) {

      gameMessage.textContent =
        "🐈 Cat.AI: " +
        data.reply;

    }

  } catch (error) {

    /*
      If Groq isn't available,
      the game still works.
    */

    const fallback =
      getFallbackEncouragement();


    gameMessage.textContent =
      "🐈 Cat.AI: " +
      fallback;

  }

}


/* =====================================================
   FALLBACK ENCOURAGEMENT
===================================================== */

function getFallbackEncouragement() {

  if (
    mouseScore >= 18
  ) {

    return "MRRP! ALMOST THERE! DON'T LET THOSE MICE ESCAPE!";

  }


  if (
    mouseScore >= 15
  ) {

    return "PURR! FIFTEEN! YOU'RE A MOUSE-CATCHING MACHINE!";

  }


  if (
    mouseScore >= 10
  ) {

    return "MEOW! HALFWAY THERE! KEEP GOING!";

  }


  if (
    mouseScore >= 5
  ) {

    return "MRRP! FIVE MICE! YOU'RE GETTING FAST!";

  }


  return "MEOW! GET THAT MOUSE!";

}


/* =====================================================
   END GAME
===================================================== */

function endMouseGame(won) {

  mouseRunning =
    false;


  clearInterval(
    mouseTimer
  );


  mouseTimer =
    null;


  if (
    mouseElement
  ) {

    mouseElement.remove();

    mouseElement =
      null;

  }


  startGameButton.disabled =
    false;


  startGameButton.textContent =
    "🐭 PLAY AGAIN";


  if (won) {

    gameMessage.textContent =
      "🐈 Cat.AI: MEOW!!! YOU CAUGHT ALL 20 MICE! 🎉";

    playWinSound();

  } else {

    gameMessage.textContent =
      `🐈 Cat.AI: Time's up! You caught ${mouseScore}/20 mice!`;

  }

}


/* =====================================================
   TINY MEOW SOUND
===================================================== */

function playTinyMeow() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) {
    return;
  }


  const audio =
    new AudioContext();


  const oscillator =
    audio.createOscillator();


  const gain =
    audio.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    650,
    audio.currentTime
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    900,
    audio.currentTime + .08
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    420,
    audio.currentTime + .22
  );


  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .18,
    audio.currentTime + .02
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + .22
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audio.destination
  );


  oscillator.start();


  oscillator.stop(
    audio.currentTime + .22
  );


  setTimeout(
    () => audio.close(),
    400
  );

}


/* =====================================================
   WIN SOUND
===================================================== */

function playWinSound() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) {
    return;
  }


  const audio =
    new AudioContext();


  const notes =
    [523, 659, 784];


  notes.forEach(
    (frequency, index) => {

      const oscillator =
        audio.createOscillator();


      const gain =
        audio.createGain();


      const start =
        audio.currentTime +
        index * .12;


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        .001,
        start
      );


      gain.gain.exponentialRampToValueAtTime(
        .2,
        start + .02
      );


      gain.gain.exponentialRampToValueAtTime(
        .001,
        start + .18
      );


      oscillator.connect(
        gain
      );


      gain.connect(
        audio.destination
      );


      oscillator.start(
        start
      );


      oscillator.stop(
        start + .18
      );

    }
  );


  setTimeout(
    () => audio.close(),
    700
  );

}


/* =====================================================
   SECRET CAT
===================================================== */

function secretMeow() {

  const cat =
    document.querySelector(
      ".secret-cat"
    );


  cat.classList.remove(
    "meowing"
  );


  void cat.offsetWidth;


  cat.classList.add(
    "meowing"
  );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "secret-meow-bubble";


  bubble.textContent =
    "MEOW! 🐈";


  document.body.appendChild(
    bubble
  );


  setTimeout(
    () => bubble.remove(),
    1200
  );


  playTinyMeow();

}


/* =====================================================
   START
===================================================== */

loadHistory();

showWelcome();

</script>

</body>
</html>
